<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGradient)"/>

  <!-- Center container -->
  <g id="content" transform="translate(400, 300)">
    <!-- News Media Logo/Icon -->
    <circle cx="0" cy="-40" r="60" fill="#c41e3a" opacity="0.1"/>

    <!-- Newspaper icon -->
    <g transform="translate(-50, -60)">
      <rect x="10" y="10" width="80" height="60" fill="none" stroke="#c41e3a" stroke-width="2" rx="2"/>
      <line x1="15" y1="20" x2="85" y2="20" stroke="#c41e3a" stroke-width="2"/>
      <line x1="15" y1="28" x2="85" y2="28" stroke="#c41e3a" stroke-width="1.5"/>
      <line x1="15" y1="35" x2="70" y2="35" stroke="#c41e3a" stroke-width="1.5"/>
      <line x1="15" y1="42" x2="85" y2="42" stroke="#c41e3a" stroke-width="1.5"/>
      <line x1="15" y1="49" x2="50" y2="49" stroke="#c41e3a" stroke-width="1.5"/>
      <line x1="15" y1="56" x2="85" y2="56" stroke="#c41e3a" stroke-width="1.5"/>
      <line x1="15" y1="63" x2="60" y2="63" stroke="#c41e3a" stroke-width="1.5"/>
    </g>

    <!-- Text -->
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#1f2937">
      NEWS MEDIA
    </text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#6b7280">
      Featured Image
    </text>
  </g>
</svg>
