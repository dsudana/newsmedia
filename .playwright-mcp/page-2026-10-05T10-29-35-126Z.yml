              - generic [ref=f8e1010]: <!-- wp:paragraph -->
              - generic [ref=f8e1011]: <p>"Mari kita dukung dan sukseskan kegiatan Musda VI Forkabi Kota Depok berjalan lancar dan sukses, makin maju dalam menjaga adat dan budaya Betawi," pungkasnya.</p>
              - generic [ref=f8e1012]: <!-- /wp:paragraph -->
              - generic [ref=f8e1013]: <!-- wp:paragraph -->
              - generic [ref=f8e1014]: <p>Untuk diketahui, hingga pukul 21.00.wib malam ini, tercatat di kepanitian yang resmi mendaftarkan diri sebagai calon Ketua DPD dan Ketua MPOD, hanya Edi Dadang Chandra dan Ade Suwardi. </p>
