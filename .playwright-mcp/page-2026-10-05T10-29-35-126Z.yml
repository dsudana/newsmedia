              - generic [ref=f8e2005]: <!-- /wp:image -->
              - generic [ref=f8e2006]: "<!-- wp:image {\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e2007]: <figure class="wp-block-image size-large"><img/></figure>
