:\"status\";i:11;s:12:\"published_at\";i:12;s:12:\"scheduled_at\";i:13;s:11:\"views_count\";i:14;s:11:\"is_featured\";i:15;s:9:\"read_time\";i:16;s:10:\"word_count\";i:17;s:11:\"ai_provider\";i:18;s:9:\"seo_score\";}s:10:\"*guarded\";a:1:{i:0;s:1:\"*\";}s:16:\"*forceDeleting\";b:0;}i:9;O:18:\"App\\Models\\Article\":34:{s:13:\"*connection\";s:5:\"mysql\";s:8:\"*table\";s:8:\"articles\";s:13:\"*primaryKey\";s:2:\"id\";s:10:\"*keyType\";s:3:\"int\";s:12:\"incrementing\";b:1;s:7:\"*with\";a:0:{}s:12:\"*withCount\";a:0:{}s:19:\"preventsLazyLoading\";b:0;s:10:\"*perPage\";i:15;s:6:\"exists\";b:1;s:18:\"wasRecentlyCreated\";b:0;s:28:\"*escapeWhenCastingToString\";b:0;s:13:\"*attributes\";a:30:{s:2:\"id\";i:892;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:79:\"Kolaborasi Ulama, Wartawan dan Pemerintah Warnai Maulid PIN Al Bahrain Cipayung\";s:4:\"slug\";s:78:\"kolaborasi-ulama-wartawan-dan-pemerintah-warnai-maulid-pin-al-bahrain-cipayung\";s:7:\"excerpt\";s:0:\"\";s:7:\"content\";s:7486:\"<!-- wp:paragraph -->"
              - generic [ref=f8e1260]: <p>DEBAR.COM.-PONDOKJAYA, DEPOK- Padepokan Islam Nusantara (PIN) Al-Bahrain&nbsp;Kota Depok menggelar Peringatan Maulid Nabi Muhammad SAW 1448 Hijirah yang mengangkat tema 'Meneladani Akhlak Rasulullah, Mewujudkan Pribadi Penuh Cinta dan Manfaat' berlangsung di Markaz PIN Al Bahrain Jl. KH. Abdurahman No.15 RT001/001 Kelurahan Pondok Jaya, Kecamatan Cipayung, Depok, Selasa (25/08/2026) malam.</p>
              - generic [ref=f8e1261]: <!-- /wp:paragraph -->
              - generic [ref=f8e1262]: <!-- wp:paragraph -->
              - generic [ref=f8e1263]: <p>Kegiatan yang menjadi momentum untuk memperkuat kecintaan kepada Rasulullah SAW sekaligus mempererat tali silaturahmi antarjemaah dan masyarakat dihadiri Pengasuh Markaz PIN Al Bahrain, KH. Fatkhuri Wahmad. MA, H. Bibit Hariyadi (Anugerah Jaya Mandiri), Penanggungjawab Acara, H. Erik Saputra Slamet, KH. Ahmad Buchori (Mbah Mad), KH. Bahrudin Toyib, KH. Harir, KH. Ahmad Furqon, KH. Nurcholis, KH. Samwari, KH. Raden Salamun, KH. Rais, KH. Abd. Mujib, Camat Cipayung, Muhammad Fahmi, Lurah Cipayung Jaya, Marbawi, Sekel Bojong Pondok Terong, Penanggungjawab acara, H. Erik Saputra Slamet, Pengurus/Jamaah MT. Balai Wartawan Kota Depok, para Ketua RT/RW, Tokoh Masyarakat setempat dan 300 jamaah turut hadir memadati halaman PIN Al Bahrain. Sedangkan untuk Tausyiah disampaikan oleh Ustadz Ahmad Kamaluddin (Ustadz Galau).</p>
              - generic [ref=f8e1264]: <!-- /wp:paragraph -->
              - generic [ref=f8e1265]: <!-- wp:paragraph -->
              - generic [ref=f8e1266]: <p>Penanggungjawab yang juga Direktur Operasional Adeem Tour, H. Erik Saputra Slamet mengungkapkan rasa syukur atas terselenggaranya kegiatan tersebut. Menurutnya, persiapan Maulid tahun ini terbilang singkat karena sebelumnya pihak panitia juga baru selesai menggelar kegiatan santunan.</p>
              - generic [ref=f8e1267]: <!-- /wp:paragraph -->
              - generic [ref=f8e1268]: <!-- wp:paragraph -->
              - generic [ref=f8e1269]: <p>"Alhamdulillah, pelaksanaan Maulid tahun ini memang waktunya agak sedikit mepet karena sebelumnya kami habis mengadakan santunan. Kami hanya memiliki waktu kurang lebih tiga minggu untuk melakukan persiapan. Tetapi, dengan kebersamaan dan kekompakan, Alhamdulillah semuanya dapat berjalan dengan lancar dan penuh keberkahan," ujar H. Erik didampingi Pengasuh Markaz PIN Al Bahrain, KH. Fatkhuri Wahmad. MA.</p>
              - generic [ref=f8e1270]: <!-- /wp:paragraph -->
              - generic [ref=f8e1271]: <!-- wp:paragraph -->
              - generic [ref=f8e1272]: <p>Ia menjelaskan, peringatan Maulid Nabi tersebut melibatkan berbagai majelis taklim dan elemen masyarakat yang selama ini mendapatkan pembinaan di lingkungan Markaz PIN Al Bahrain. Di antaranya Majelis Taklim Al Bahrain, Majelis Taklim Nur, majelis-majelis taklim RNU di Kelurahan Cipayung, majelis taklim masjid di sekitar kediaman kiai, serta masyarakat di sejumlah lingkungan RT.</p>
              - generic [ref=f8e1273]: <!-- /wp:paragraph -->
              - generic [ref=f8e1274]: <!-- wp:paragraph -->
              - generic [ref=f8e1275]: <p>Menurut Erik, kegiatan Maulid Nabi bukan sekadar seremoni tahunan, melainkan menjadi sarana untuk mengenal dan meneladani Rasulullah SAW lebih dalam melalui introspeksi atau muhasabah.</p>
              - generic [ref=f8e1276]: <!-- /wp:paragraph -->
              - generic [ref=f8e1277]: <!-- wp:paragraph -->
              - generic [ref=f8e1278]: <p>"Yang utama adalah bagaimana kita semakin mengenal dan melakukan muhasabah kepada Rasulullah SAW. Selain itu, kegiatan ini juga menjadi media silaturahmi yang sangat penting," jelasnya.</p>
              - generic [ref=f8e1279]: <!-- /wp:paragraph -->
              - generic [ref=f8e1280]: <!-- wp:paragraph -->
              - generic [ref=f8e1281]: <p>Ia juga menyinggung hubungan baik antara Markaz PIN Al Bahrain dengan berbagai elemen masyarakat dan organisasi di Kota Depok, termasuk dengan Majelis Taklim Balai Wartawan Kota Depok.</p>
              - generic [ref=f8e1282]: <!-- /wp:paragraph -->
              - generic [ref=f8e1283]: <!-- wp:paragraph -->
              - generic [ref=f8e1284]: <p>"Alhamdulillah, salah satunya dengan MT. Balai Wartawan Kota Depok. Kiai juga pernah mengisi acara pengajian bulanannya," ungkapnya.</p>
              - generic [ref=f8e1285]: <!-- /wp:paragraph -->
              - generic [ref=f8e1286]: <!-- wp:paragraph -->
              - generic [ref=f8e1287]: <p>Sementara itu, Camat Cipayung, Muhammad Fahmi menyampaikan apresiasi kepada seluruh pihak yang telah berkolaborasi dalam menyelenggarakan peringatan Maulid Nabi Muhammad SAW di Padepokan Islam Nusantara Al Bahrain.</p>
              - generic [ref=f8e1288]: <!-- /wp:paragraph -->
              - generic [ref=f8e1289]: <!-- wp:paragraph -->
              - generic [ref=f8e1290]: <p>"Saya sangat mengapresiasi kegiatan Maulid pada malam ini. Rasulullah SAW adalah manusia yang namanya paling banyak disebut dan menjadi teladan bagi seluruh umat manusia," terang Fahmi.</p>
              - generic [ref=f8e1291]: <!-- /wp:paragraph -->
              - generic [ref=f8e1292]: <!-- wp:paragraph -->
              - generic [ref=f8e1293]: <p>Ia juga menyampaikan terima kasih kepada seluruh elemen masyarakat yang selama ini telah membangun kolaborasi bersama Pemerintah Kecamatan Cipayung.</p>
              - generic [ref=f8e1294]: <!-- /wp:paragraph -->
              - generic [ref=f8e1295]: <!-- wp:paragraph -->
              - generic [ref=f8e1296]: <p>Menurutnya, kebersamaan antara pemerintah, tokoh agama, organisasi masyarakat, dan warga menjadi modal penting dalam menjaga wilayah tetap kondusif.</p>
              - generic [ref=f8e1297]: <!-- /wp:paragraph -->
              - generic [ref=f8e1298]: <!-- wp:paragraph -->
              - generic [ref=f8e1299]: <p>"Saya mengucapkan terima kasih kepada seluruh masyarakat yang telah berkolaborasi untuk Kecamatan Cipayung. Alhamdulillah, sampai saat ini Cipayung dalam keadaan baik, mulai dari aspek keamanan, kebersihan, dan berbagai bidang lainnya," katanya.</p>
              - generic [ref=f8e1300]: <!-- /wp:paragraph -->
              - generic [ref=f8e1301]: <!-- wp:paragraph -->
              - generic [ref=f8e1302]: <p>Fahmi juga menyinggung persoalan kebersihan dan pengelolaan sampah yang menjadi perhatian bersama. Ia berharap kesadaran masyarakat dalam memilah dan mengolah sampah dapat terus ditingkatkan dalam kehidupan sehari-hari.</p>
              - generic [ref=f8e1303]: <!-- /wp:paragraph -->
              - generic [ref=f8e1304]: <!-- wp:paragraph -->
              - generic [ref=f8e1305]: <p>Selain itu, sektor pendidikan turut menjadi perhatian Pemerintah Kota Depok. Fahmi menyampaikan bahwa terdapat berbagai terobosan untuk memastikan anak-anak di Kota Depok tetap mendapatkan akses pendidikan.</p>
              - generic [ref=f8e1306]: <!-- /wp:paragraph -->
              - generic [ref=f8e1307]: <!-- wp:paragraph -->
              - generic [ref=f8e1308]: <p>"Apabila ada anak-anak yang mengalami kesulitan mendapatkan pendidikan, silakan dilaporkan. Pesan Wali Kota Depok jelas, anak-anak Depok harus tetap sekolah," tegasnya.</p>
              - generic [ref=f8e1309]: <!-- /wp:paragraph -->
              - generic [ref=f8e1310]: <!-- wp:paragraph -->
              - generic [ref=f8e1311]: <p>Ia juga mengapresiasi kehadiran pengurus dan jamaah Majelis Taklim Balai Wartawan Kota Depok yang turut hadir diacara Maulid Nabi Muhammad SAW di Markaz PIN Al Bahrain, ini menunjukan kolaborasi yang baik dan berjalan antar wartawan, ulama dan masyarakat saling mengisi dalam memberikan informasi yang baik dan benar.</p>
              - generic [ref=f8e1312]: <!-- /wp:paragraph -->
              - generic [ref=f8e1313]: <!-- wp:paragraph -->
              - generic [ref=f8e1314]: <p>“Terima kasih juga buat kehadiran Pengurus dan Jamaah MT. Balai Wartawan Kota Depok yang digawangi Adie Rakasiwi, semoga kolaborasi ini terus berjalan dalam ikatan silaturahim dalam saling memberi informasi dalam mensyiarkan kebaikan," tuturnya.</p>
              - generic [ref=f8e1315]: <!-- /wp:paragraph -->
              - generic [ref=f8e1316]: <!-- wp:paragraph -->
              - generic [ref=f8e1317]: <p>Sedangkan Ustazd Ahmad Kamaluddin menekankan pentingnya menjaga silaturahmi di tengah perkembangan teknologi yang semakin pesat.</p>
              - generic [ref=f8e1318]: <!-- /wp:paragraph -->
              - generic [ref=f8e1319]: <!-- wp:paragraph -->
              - generic [ref=f8e1320]: <p>"Jangan sampai silaturahmi kita rusak gara-gara handphone," pesannya di hadapan para jemaah.</p>
              - generic [ref=f8e1321]: <!-- /wp:paragraph -->
              - generic [ref=f8e1322]: <!-- wp:paragraph -->
              - generic [ref=f8e1323]: <p>Menurutnya, manusia tidak dapat hidup sendiri dan selalu membutuhkan bantuan orang lain dalam berbagai fase kehidupan.</p>
              - generic [ref=f8e1324]: <!-- /wp:paragraph -->
              - generic [ref=f8e1325]: <!-- wp:paragraph -->
              - generic [ref=f8e1326]: <p>"Kita lahir ke dunia membutuhkan bantuan manusia, dan ketika meninggal pun membutuhkan bantuan manusia. Karena itu, hidup bersama-sama akan terasa lebih indah. Hidup akan lebih baik jika kita kompak,” ujarnya.</p>
              - generic [ref=f8e1327]: <!-- /wp:paragraph -->
              - generic [ref=f8e1328]: <!-- wp:paragraph -->
              - generic [ref=f8e1329]: <p>Ia juga mengingatkan pentingnya ilmu sebagai dasar dalam menjalankan ibadah dan kehidupan sehari-hari.</p>
              - generic [ref=f8e1330]: <!-- /wp:paragraph -->
              - generic [ref=f8e1331]: <!-- wp:paragraph -->
              - generic [ref=f8e1332]: <p>"Ibadah tanpa ilmu tidak akan bernilai sebagaimana mestinya. Karena itu, kita harus terus belajar dan memperkuat pemahaman agama," pungkasnya. </p>
