;s:6:\"status\";i:11;s:12:\"published_at\";i:12;s:12:\"scheduled_at\";i:13;s:11:\"views_count\";i:14;s:11:\"is_featured\";i:15;s:9:\"read_time\";i:16;s:10:\"word_count\";i:17;s:11:\"ai_provider\";i:18;s:9:\"seo_score\";}s:10:\"*guarded\";a:1:{i:0;s:1:\"*\";}s:16:\"*forceDeleting\";b:0;}i:15;O:18:\"App\\Models\\Article\":34:{s:13:\"*connection\";s:5:\"mysql\";s:8:\"*table\";s:8:\"articles\";s:13:\"*primaryKey\";s:2:\"id\";s:10:\"*keyType\";s:3:\"int\";s:12:\"incrementing\";b:1;s:7:\"*with\";a:0:{}s:12:\"*withCount\";a:0:{}s:19:\"preventsLazyLoading\";b:0;s:10:\"*perPage\";i:15;s:6:\"exists\";b:1;s:18:\"wasRecentlyCreated\";b:0;s:28:\"*escapeWhenCastingToString\";b:0;s:13:\"*attributes\";a:30:{s:2:\"id\";i:886;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:85:\"Kodim 0508 Sambut Hangat MT Balwan Kota Depok “Siap Sinergi Dalwah dan Bakti Sosial\";s:4:\"slug\";s:82:\"kodim-0508-sambut-hangat-mt-balwan-kota-depok-siap-sinergi-dalwah-dan-bakti-sosial\";s:7:\"excerpt\";s:0:\"\";s:7:\"content\";s:4101:\"<!-- wp:paragraph -->"
              - generic [ref=f8e1848]: <p>-DEPOK- Majelis Taklim Balai Wartawan Kota Depok (MT Balwan) melakukan audiensi sekaligus silaturahmi dengan Komandan Kodim 0508/Depok, Kolonel Inf. Ginanjar Wahyutomo, Rabu (12/08/2026).</p>
              - generic [ref=f8e1849]: <!-- /wp:paragraph -->
              - generic [ref=f8e1850]: <!-- wp:paragraph -->
              - generic [ref=f8e1851]: <p>Kunjungan silaturahmi&nbsp; tersebut menjadi momentum untuk mempererat hubungan sekaligus membuka peluang kolaborasi antara MT. Balwan Kota Depok dan Kodim 0508/Depok dalam berbagai kegiatan keagamaan maupun sosial kemasyarakatan.</p>
              - generic [ref=f8e1852]: <!-- /wp:paragraph -->
              - generic [ref=f8e1853]: <!-- wp:paragraph -->
              - generic [ref=f8e1854]: <p>Ketua MT. Balwan Kota Depok, Adie Rakasiwi, mengatakan silaturahmi tersebut merupakan bagian dari upaya memperkenalkan keberadaan serta aktivitas MT. Balwan kepada jajaran Kodim 0508/Depok.</p>
              - generic [ref=f8e1855]: <!-- /wp:paragraph -->
              - generic [ref=f8e1856]: <!-- wp:paragraph -->
              - generic [ref=f8e1857]: <p>"Alhamdulillah, kami mendapat kesempatan bersilaturahmi dengan Dandim 0508/Depok dan diterima secara langsung. Ini menjadi suatu kehormatan bagi kami," ujar Adie Rakasiwi.</p>
              - generic [ref=f8e1858]: <!-- /wp:paragraph -->
              - generic [ref=f8e1859]: <!-- wp:paragraph -->
              - generic [ref=f8e1860]: <p>Dikatakan Adie, kedatangan MT. Balwan Kota Depok tidak hanya bertujuan untuk bersilaturahmi, tetapi juga memperkenalkan berbagai program kegiatan yang telah dijalankan dan sedang berjalan selama kurang lebih lima tahun.</p>
              - generic [ref=f8e1861]: <!-- /wp:paragraph -->
              - generic [ref=f8e1862]: <!-- wp:paragraph -->
              - generic [ref=f8e1863]: <p>Sejumlah kegiatan tersebut antara lain Pengajian Rutin Bulanan, Jumat Berkah, Ziarah, Tadabur Alam, hingga Bakti Sosial yang melibatkan anggota dan masyarakat. Dirinya juga berharap hubungan yang telah terjalin dapat dikembangkan menjadi sinergi yang lebih luas antara MT. Balwan dan Kodim 0508/Depok.</p>
              - generic [ref=f8e1864]: <!-- /wp:paragraph -->
              - generic [ref=f8e1865]: <!-- wp:paragraph -->
              - generic [ref=f8e1866]: <p>"Kami berharap ke depan MT. Balwan Kota Depok dapat bersinergi dengan Kodim 0508/Depok dalam berbagai kegiatan yang memberikan manfaat bagi masyarakat," ungkapnya.</p>
              - generic [ref=f8e1867]: <!-- /wp:paragraph -->
              - generic [ref=f8e1868]: <!-- wp:paragraph -->
              - generic [ref=f8e1869]: <p>Sementara itu, Dandim 0508/Depok, Kolonel Inf Ginanjar Wahyutomo menyambut baik kunjungan para pengurus dan anggota MT. Balwan Kota Depok. Ia mengaku senang dapat menerima langsung jajaran MT. Balwan sekaligus mengetahui lebih jauh keberadaan majelis taklim yang beranggotakan para wartawan tersebut.</p>
              - generic [ref=f8e1870]: <!-- /wp:paragraph -->
              - generic [ref=f8e1871]: <!-- wp:paragraph -->
              - generic [ref=f8e1872]: <p>"Alhamdulillah, saya sudah didatangi ustazd-ustazd wartawan dari MT. Balai Wartawan Kota Depok. Semoga kedatangan MT. Balwan membawa keberkahan bagi Kodim 0508/Depok," katanya.</p>
              - generic [ref=f8e1873]: <!-- /wp:paragraph -->
              - generic [ref=f8e1874]: <!-- wp:paragraph -->
              - generic [ref=f8e1875]: <p>Ginanjar mengatakan, keberadaan MT. Balwan Kota Depok menjadi hal positif, karena dapat menjadi wadah bagi para wartawan untuk menjalankan kegiatan keagamaan sekaligus kepedulian sosial.</p>
              - generic [ref=f8e1876]: <!-- /wp:paragraph -->
              - generic [ref=f8e1877]: <!-- wp:paragraph -->
              - generic [ref=f8e1878]: <p>"Saya baru mengetahui bahwa di Kota Depok ada Majelis Taklim Wartawan. Ternyata memang ada. Ini keren dan alhamdulillah saya bisa bertemu langsung," tuturnya.</p>
              - generic [ref=f8e1879]: <!-- /wp:paragraph -->
              - generic [ref=f8e1880]: <!-- wp:paragraph -->
              - generic [ref=f8e1881]: <p>Ginanjar juga membuka peluang terjalinnya kerja sama antara Kodim 0508/Depok dan MT. Balwan dalam berbagai kegiatan ke depan.</p>
              - generic [ref=f8e1882]: <!-- /wp:paragraph -->
              - generic [ref=f8e1883]: <!-- wp:paragraph -->
              - generic [ref=f8e1884]: <p>Ia berharap sinergi tersebut dapat terus dibangun sehingga program-program MT. Balwan yang berkaitan dengan keagamaan dan sosial kemasyarakatan dapat berjalan semakin baik.</p>
              - generic [ref=f8e1885]: <!-- /wp:paragraph -->
              - generic [ref=f8e1886]: <!-- wp:paragraph -->
              - generic [ref=f8e1887]: <p>"Kami berharap ke depan MT. Balwan Kota Depok bersama Kodim 0508/Depok dapat bersinergi. Kodim 0508/Depok juga siap mendukung kegiatan-kegiatan MT Balwan sesuai dengan kemampuan dan ketentuan yang ada," pungkasnya. (**)</p>
              - generic [ref=f8e1888]: <!-- /wp:paragraph -->
