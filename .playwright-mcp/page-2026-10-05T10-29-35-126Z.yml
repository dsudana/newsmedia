:\"published_at\";i:12;s:12:\"scheduled_at\";i:13;s:11:\"views_count\";i:14;s:11:\"is_featured\";i:15;s:9:\"read_time\";i:16;s:10:\"word_count\";i:17;s:11:\"ai_provider\";i:18;s:9:\"seo_score\";}s:10:\"*guarded\";a:1:{i:0;s:1:\"*\";}s:16:\"*forceDeleting\";b:0;}i:18;O:18:\"App\\Models\\Article\":34:{s:13:\"*connection\";s:5:\"mysql\";s:8:\"*table\";s:8:\"articles\";s:13:\"*primaryKey\";s:2:\"id\";s:10:\"*keyType\";s:3:\"int\";s:12:\"incrementing\";b:1;s:7:\"*with\";a:0:{}s:12:\"*withCount\";a:0:{}s:19:\"preventsLazyLoading\";b:0;s:10:\"*perPage\";i:15;s:6:\"exists\";b:1;s:18:\"wasRecentlyCreated\";b:0;s:28:\"*escapeWhenCastingToString\";b:0;s:13:\"*attributes\";a:30:{s:2:\"id\";i:883;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:70:\"Infokomdigi MUI Depok Belajar Produksi Konten AI di Workshop MUI Pusat\";s:4:\"slug\";s:70:\"infokomdigi-mui-depok-belajar-produksi-konten-ai-di-workshop-mui-pusat\";s:7:\"excerpt\";s:0:\"\";s:7:\"content\";s:5378:\"<!-- wp:paragraph -->"
              - generic [ref=f8e2222]: <p>Jakarta, Majelis Ulama Indonesia (MUI) Kota Depok melalui Komisi Informasi dan Komunikasi Digital (Infokomdigi) mengikuti Workshop Amplifikasi Literasi Keislaman Digital Era Artificial Intelligence (AI) di Aula Buya Hamka, MUI Pusat, Jakarta, Rabu (29/7/2026).<br>Kegiatan ini mengusung tema “Penguatan Syiar Zakat, Infak, dan Sedekah untuk Membangun Umat di Era Digital” dan dihadiri pengurus Komisi Infokomdigi MUI kabupaten/kota se-Jabodetabek, perwakilan ormas Islam, serta berbagai lembaga terkait.<br>Dalam sambutannya, Ketua MUI Pusat Bidang Informasi dan Komunikasi Digital (Infokomdigi), KH. Masduki Baidlowi, mengatakan dakwah saat ini tengah mengalami pergeseran dari pola konvensional menuju ruang digital.</p>
              - generic [ref=f8e2223]: <!-- /wp:paragraph -->
              - generic [ref=f8e2224]: <!-- wp:paragraph -->
              - generic [ref=f8e2225]: <p>Oleh karena itu, Komisi Infokomdigi diharapkan dapat mendorong transformasi digital dalam seluruh aktivitas MUI, mulai dari fatwa, dakwah, hingga berbagai layanan lainnya,” ujarnya.<br>Mantan Jubir Wapres RI ke-13 KH. Ma’ruf Amin tersebut, mencontohkan perkembangan avatar berbasis AI yang mampu menyampaikan jawaban atas pertanyaan keagamaan secara fasih dan menarik banyak pengikut di media sosial. Fenomena tersebut, menurutnya, menunjukkan bahwa AI telah berkembang hingga mampu menjalankan sebagian fungsi yang selama ini lekat dengan institusi keagamaan.<br>“Jika tidak bersiap, maka peran dan pengaruh institusi keagamaan seperti MUI, dan&nbsp;ormas Islam NU, Muhammadiyah, dan yang lainnya dapat semakin berkurang di mata generasi muda,” katanya.</p>
              - generic [ref=f8e2226]: <!-- /wp:paragraph -->
              - generic [ref=f8e2227]: <!-- wp:paragraph -->
              - generic [ref=f8e2228]: <p>Kiai Masduki melanjutkan, bahwa sejatinya substansi dakwah tidak berubah, namun sarana dan pola penyampaiannya perlu menyesuaikan perkembangan zaman.<br>“Hal ini penting mengingat sebagian besar masyarakat Indonesia, khususnya generasi muda, tumbuh sebagai digital native yang sangat dekat dengan teknologi dalam kesehariannya,” terangnya.<br>Sementara itu, Ketua Komisi Infokomdigi MUI Pusat, Hari Usmayadi, M.Kom., M.M., menyampaikan dalam laporannya bahwa workshop ini bertujuan membekali peserta agar mampu memanfaatkan AI secara produktif, etis, bertanggung jawab, dan selaras dengan nilai-nilai keislaman.<br>“Melalui kegiatan ini, peserta diharapkan dapat menghasilkan konten digital berkualitas sekaligus memperkuat syiar zakat, infak, dan sedekah di ruang digital. Materi workshop disusun dengan komposisi 40 persen teori dan 60 persen praktik,” tuturnya.</p>
              - generic [ref=f8e2229]: <!-- /wp:paragraph -->
              - generic [ref=f8e2230]: <!-- wp:paragraph -->
              - generic [ref=f8e2231]: "<p>Pada sesi teori, Hari Usmayadi melanjutkan, peserta memperoleh pemahaman mengenai perkembangan AI, etika pemanfaatan AI dalam perspektif syariah, transformasi digital zakat, serta strategi literasi keislaman digital. Sementara dalam sesi praktik, peserta didampingi menggunakan perangkat AI untuk menyusun strategi media sosial, membuat kalender konten, menulis artikel berbasis Generative Engine Optimization (GEO), memproduksi desain visual dan video pendek, hingga mendistribusikan serta mengamplifikasi konten dakwah secara efektif.<br>Mewakili Komisi Infokomdigi MUI Kota Depok Nanang Kurniawan yang biasa disapa Bang Monank menyampaikan apresiasi atas penyelenggaraan kegiatan tersebut.<br>Menurut operator live streaming MUI Depok TV tersebut, workshop ini sangat bermanfaat bagi pegiat literasi dan media digital MUI kabupaten/kota, khususnya dalam meningkatkan kemampuan membuat konten keislaman, menulis artikel berbasis GEO, serta memproduksi konten visual dan video dakwah dengan dukungan AI.<br>“Yang terpenting adalah bagaimana kita memanfaatkan AI dan bekerja bersama AI,” katanya.<br>Materi yang disampaikan dalam workshop tersebut, yaitu:<br>1 “AI untuk Literasi Zakat, Infak, dan Sedekah Digital,” narasumber: Dr. Muhammad Hasbi Zaenal (Direktur Riset, Kajian dan Pengembangan BAZNAS RI);<br>2 “Etika dan Panduan Syar’i Penggunaan AI dalam Konten Keislaman,” narasumber: Dr. H. Asrori S. Karni, S.Ag., M.H. (Wakil Sekjen MUI Pusat Bidang Infokomdigi);<br>3 “AI dan Masa Depan Dakwah Digital,” narasumber: Ismail Fahmi, Ph.D. (Wakil Ketua Bidang Riset Digital Komisi Infokomdigi MUI);<br>4 “Membangun Akun Medsos Dakwah/Keislaman dengan AI: dari Niche hingga Kalender Konten,” narasumber: H. Abdul Muis Sobri, M.Kom. (Wakil Ketua Bidang Media Sosial Komisi Infokomdigi MUI Pusat);<br>5 “Menulis Artikel Keislaman di Era Generative Engine Optimization (GEO) serta Strategi Amplifikasi Dakwah di Media Sosial melalui Distribusi Cerdas dan Repurposing Konten,” narasumber: H.M. Alvin Nur Choironi, M.A. (Sekretaris Komisi Infokomdigi MUI Pusat);<br>6 “Memproduksi Konten Visual &amp; Video Dakwah dengan AI: dari Poster hingga Reels,” narasumber: Muhyiddin Fanda Setiawan, M.I.Kom (Wakil Sekretaris Bidang Media Sosial Komisi Infokomdigi MUI).</p>"
