              - generic [ref=f8e1424]: "<figure class=\"wp-block-gallery has-nested-images columns-default is-cropped\"><!-- wp:image {\"id\":1104,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e1425]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/08/b4efaae2-9403-474e-9dba-969ad4dec106-1024x768.jpeg" alt="" class="wp-image-1104"/></figure>
              - generic [ref=f8e1426]: <!-- /wp:image --></figure>
