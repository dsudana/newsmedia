"status\";i:11;s:12:\"published_at\";i:12;s:12:\"scheduled_at\";i:13;s:11:\"views_count\";i:14;s:11:\"is_featured\";i:15;s:9:\"read_time\";i:16;s:10:\"word_count\";i:17;s:11:\"ai_provider\";i:18;s:9:\"seo_score\";}s:10:\"*guarded\";a:1:{i:0;s:1:\"*\";}s:16:\"*forceDeleting\";b:0;}i:17;O:18:\"App\\Models\\Article\":34:{s:13:\"*connection\";s:5:\"mysql\";s:8:\"*table\";s:8:\"articles\";s:13:\"*primaryKey\";s:2:\"id\";s:10:\"*keyType\";s:3:\"int\";s:12:\"incrementing\";b:1;s:7:\"*with\";a:0:{}s:12:\"*withCount\";a:0:{}s:19:\"preventsLazyLoading\";b:0;s:10:\"*perPage\";i:15;s:6:\"exists\";b:1;s:18:\"wasRecentlyCreated\";b:0;s:28:\"*escapeWhenCastingToString\";b:0;s:13:\"*attributes\";a:30:{s:2:\"id\";i:884;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:89:\"GEBRAKAN BARU “DKM BAITUL KAMAL BENTUK REMAJA MASJID”DORONG PEMUDA RAMAIKAN MASJID”\";s:4:\"slug\";s:80:\"gebrakan-baru-dkm-baitul-kamal-bentuk-remaja-masjiddorong-pemuda-ramaikan-masjid\";s:7:\"excerpt\";s:0:\"\";s:7:\"content\";s:5233:\"<!-- wp:paragraph -->"
              - generic [ref=f8e2068]: <p></p>
              - generic [ref=f8e2069]: <!-- /wp:paragraph -->
              - generic [ref=f8e2070]: <!-- wp:paragraph -->
              - generic [ref=f8e2071]: <p>DEPOK — Pengurus Dewan Kemakmuran Masjid (DKM) Masjid Baitul Kamal Balaikota Depok periode baru melakukan gebrakan dengan membentuk Remaja Masjid Baitul Kamal.</p>
              - generic [ref=f8e2072]: <!-- /wp:paragraph -->
              - generic [ref=f8e2073]: <!-- wp:paragraph -->
              - generic [ref=f8e2074]: <p>Pembentukan organisasi tersebut merupakan bagian dari upaya DKM di bawah kepemimpinan KH. Abu Bakar Madris untuk menjadikan Masjid Baitul Kamal tidak hanya sebagai tempat ibadah, tetapi juga sebagai ruang bagi berbagai kegiatan keagamaan dan kemasyarakatan.</p>
              - generic [ref=f8e2075]: <!-- /wp:paragraph -->
              - generic [ref=f8e2076]: <!-- wp:paragraph -->
              - generic [ref=f8e2077]: <p>KH. Abu Bakar Madris mengatakan, Masjid Baitul Kamal yang berada di lingkungan Balaikota Depok pada dasarnya merupakan milik masyarakat Kota Depok. Karena itu, masyarakat diharapkan dapat turut meramaikan masjid dan menghidupkan syiar Islam di dalamnya.</p>
              - generic [ref=f8e2078]: <!-- /wp:paragraph -->
              - generic [ref=f8e2079]: <!-- wp:paragraph -->
              - generic [ref=f8e2080]: <p>"Masjid Baitul Kamal adalah milik masyarakat Kota Depok yang kebetulan lokasinya berada di lingkungan Balaikota Depok, sehingga masyarakat boleh datang dan meramaikan syiar Islam di masjid ini," ujar KH. Abu Bakar Madris.</p>
              - generic [ref=f8e2081]: <!-- /wp:paragraph -->
              - generic [ref=f8e2082]: <!-- wp:paragraph -->
              - generic [ref=f8e2083]: <p>Menurut pria yang juga Dewan Pertimbangan MUI Depok dan Ketua KuduSS Ramah tersebut, aktivitas di Masjid Baitul Kamal diharapkan tidak hanya ramai oleh jamaah yang berasal dari kalangan aparatur sipil negara (ASN) pada hari kerja. Masjid tersebut juga diharapkan dapat menjadi pusat kegiatan masyarakat Kota Depok, termasuk pada waktu-waktu di luar jam kerja dan akhir pekan.</p>
              - generic [ref=f8e2084]: <!-- /wp:paragraph -->
              - generic [ref=f8e2085]: <!-- wp:paragraph -->
              - generic [ref=f8e2086]: <p>Salah satu langkah untuk mewujudkan hal tersebut adalah pembentukan Remaja Masjid Baitul Kamal yang melibatkan perwakilan pemuda dari berbagai kecamatan di Kota Depok.</p>
              - generic [ref=f8e2087]: <!-- /wp:paragraph -->
              - generic [ref=f8e2088]: <!-- wp:paragraph -->
              - generic [ref=f8e2089]: <p>Sementara itu Sekretaris Masjid Baitul Kamal, Rohmat Rospari, mengatakan keberadaan remaja masjid penting sebagai wadah bagi generasi muda untuk menyalurkan kreativitas dan aktivitas mereka di bidang keagamaan.</p>
              - generic [ref=f8e2090]: <!-- /wp:paragraph -->
              - generic [ref=f8e2091]: <!-- wp:paragraph -->
              - generic [ref=f8e2092]: <p>"Remaja adalah penerus generasi bangsa dan agama. Oleh karena itu, mereka perlu diberi ruang berekspresi dalam bidang keagamaan di Masjid Baitul Kamal, karena nantinya merekalah yang akan jadi pemimpin bangsa dan agama," ujar Rohmat Rospari.</p>
              - generic [ref=f8e2093]: <!-- /wp:paragraph -->
              - generic [ref=f8e2094]: <!-- wp:paragraph -->
              - generic [ref=f8e2095]: <p>Pembentukan Remaja Masjid Baitul Kamal dilaksanakan pada Ahad, 9 Agustus 2026, sekitar pukul 13.00 WIB. Kegiatan tersebut mengundang perwakilan dari 11 kecamatan di Kota Depok.</p>
              - generic [ref=f8e2096]: <!-- /wp:paragraph -->
              - generic [ref=f8e2097]: <!-- wp:paragraph -->
              - generic [ref=f8e2098]: <p>Dari undangan tersebut, delapan kecamatan mengirimkan perwakilan remaja, sementara tiga kecamatan tidak mengirimkan utusan. Perwakilan yang hadir di antaranya:</p>
              - generic [ref=f8e2099]: <!-- /wp:paragraph -->
              - generic [ref=f8e2100]: <!-- wp:paragraph -->
              - generic [ref=f8e2101]: <p>Bojongsari, tiga orang remaja.<br>Cilodong, tiga orang remaja.<br>Cipayung, tiga orang remaja.<br>Limo, tiga orang remaja.<br>Pancoran Mas, tiga orang remaja.<br>Sawangan, tiga orang remaja.<br>Sukmajaya, tiga orang remaja.<br>Tapos, tiga orang remaja.</p>
              - generic [ref=f8e2102]: <!-- /wp:paragraph -->
              - generic [ref=f8e2103]: <!-- wp:paragraph -->
              - generic [ref=f8e2104]: <p>Pertemuan berlangsung dalam suasana hangat dan kekeluargaan. Kegiatan tersebut mendapat arahan dari tiga pengurus Masjid Baitul Kamal yang ditugaskan Ketua DKM sebagai pengayom Remaja Masjid Baitul Kamal, yakni Ustaz Rohmat Rospari, Ustaz Niran, dan Ustaz Nurul Anwar.</p>
              - generic [ref=f8e2105]: <!-- /wp:paragraph -->
              - generic [ref=f8e2106]: <!-- wp:paragraph -->
              - generic [ref=f8e2107]: <p>Hingga waktu salat Ashar tiba, pertemuan tersebut menghasilkan susunan Badan Pengurus Harian Remaja Masjid Baitul Kamal.</p>
              - generic [ref=f8e2108]: <!-- /wp:paragraph -->
              - generic [ref=f8e2109]: <!-- wp:paragraph -->
              - generic [ref=f8e2110]: <p>Berikut susunan kepengurusan yang terbentuk:</p>
              - generic [ref=f8e2111]: <!-- /wp:paragraph -->
              - generic [ref=f8e2112]: <!-- wp:paragraph -->
              - generic [ref=f8e2113]: <p>Ketua:<br>Ahmad Naufal Muhtarom (Limo)</p>
              - generic [ref=f8e2114]: <!-- /wp:paragraph -->
              - generic [ref=f8e2115]: <!-- wp:paragraph -->
              - generic [ref=f8e2116]: <p>Wakil Ketua:<br>Fahmi Humaidy (Cipayung)</p>
              - generic [ref=f8e2117]: <!-- /wp:paragraph -->
              - generic [ref=f8e2118]: <!-- wp:paragraph -->
              - generic [ref=f8e2119]: <p>Sekretaris:<br>Habil Aulia Mufa<br>Maulida Azzahra</p>
              - generic [ref=f8e2120]: <!-- /wp:paragraph -->
              - generic [ref=f8e2121]: <!-- wp:paragraph -->
              - generic [ref=f8e2122]: <p>Bendahara:<br>N. Muflihatul Azizah<br>Nur Aisyah Zanlianty</p>
              - generic [ref=f8e2123]: <!-- /wp:paragraph -->
              - generic [ref=f8e2124]: <!-- wp:paragraph -->
              - generic [ref=f8e2125]: <p>Pembentukan Remaja Masjid Baitul Kamal Balaikota Depok diharapkan dapat membawa keberkahan dan semakin memakmurkan masjid.</p>
              - generic [ref=f8e2126]: <!-- /wp:paragraph -->
              - generic [ref=f8e2127]: <!-- wp:paragraph -->
              - generic [ref=f8e2128]: <p>Selain itu, keberadaan wadah tersebut diharapkan mampu memberikan semangat kepada para remaja di Kota Depok agar tidak ragu beraktivitas, mencurahkan kreativitas, serta menyampaikan gagasan dan pemikiran positif di lingkungan masjid.</p>
              - generic [ref=f8e2129]: <!-- /wp:paragraph -->
