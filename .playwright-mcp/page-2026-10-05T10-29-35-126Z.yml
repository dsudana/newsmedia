              - generic [ref=f8e1428]: <!-- wp:paragraph -->
              - generic [ref=f8e1429]: <p><em>DEPOK</em> – Semangat kemerdekaan masih terasa. Warga RT 02 dan RT 06 RW 05 Kelurahan Tirta Jaya, Kecamatan Sukmajaya, Kota Depok menggelar Malam Pentas Seni dalam rangka memperingati Hari Ulang Tahun ke-81 Republik Indonesia.</p>
              - generic [ref=f8e1430]: <!-- /wp:paragraph -->
              - generic [ref=f8e1431]: <!-- wp:paragraph -->
              - generic [ref=f8e1432]: <p>Acara berlangsung meriah di Jalan Masjid Nurul Yakin RT 02 RW 05 Tirta Jaya, Sabtu malam (22/08/2026).</p>
              - generic [ref=f8e1433]: <!-- /wp:paragraph -->
              - generic [ref=f8e1434]: <!-- wp:paragraph -->
              - generic [ref=f8e1435]: <p>Kegiatan yang dipandu MC Rara dan Olik ini dibuka dengan menyanyikan lagu kebangsaan Indonesia Raya oleh seluruh warga yang hadir. Suasana khidmat langsung berubah menjadi riuh gembira saat acara inti dimulai.</p>
              - generic [ref=f8e1436]: <!-- /wp:paragraph -->
              - generic [ref=f8e1437]: <!-- wp:paragraph -->
              - generic [ref=f8e1438]: <p>Ketua RW 05, Yayat Hidayat dalam sambutannya mengajak seluruh warga untuk terus menjaga semangat kemerdekaan dengan aksi nyata.<br>"Saya mengimbau kepada seluruh warga agar membuang sampah pada tempatnya dan menjaga kebersihan lingkungan. Kemerdekaan juga berarti merdeka dari lingkungan yang kotor," ujarnya.</p>
              - generic [ref=f8e1439]: <!-- /wp:paragraph -->
              - generic [ref=f8e1440]: <!-- wp:paragraph -->
              - generic [ref=f8e1441]: <p>Sementara itu, Asri selaku Ketua RT 02 mengawali sambutannya dengan pekik kemerdekaan yang disambut sorak warga. Ia menyampaikan apresiasi dan terima kasih kepada seluruh warga serta panitia yang telah bekerja keras menyukseskan kegiatan ini.</p>
              - generic [ref=f8e1442]: <!-- /wp:paragraph -->
              - generic [ref=f8e1443]: <!-- wp:paragraph -->
              - generic [ref=f8e1444]: <p>"Malam ini adalah bukti kekompakan kita. Terima kasih kepada semua yang sudah berpartisipasi. Semoga kegiatan seperti ini terus kita jaga untuk mempererat silaturahmi," katanya.</p>
              - generic [ref=f8e1445]: <!-- /wp:paragraph -->
              - generic [ref=f8e1446]: <!-- wp:paragraph -->
              - generic [ref=f8e1447]: <p>Panggung pentas seni menampilkan berbagai pertunjukan dari warga berbagai usia. Mulai dari tari, menyanyi, puisi, hingga drama komedi berhasil menghibur dan mengundang gelak tawa penonton.</p>
              - generic [ref=f8e1448]: <!-- /wp:paragraph -->
              - generic [ref=f8e1449]: <!-- wp:paragraph -->
              - generic [ref=f8e1450]: <p>Kemeriahan malam itu memuncak dengan atraksi kembang api yang menyalakan langit Tirta Jaya. Sorak sorai warga mengiringi setiap dentuman kembang api sebagai simbol semangat dan harapan di usia kemerdekaan ke-81.</p>
              - generic [ref=f8e1451]: <!-- /wp:paragraph -->
              - generic [ref=f8e1452]: <!-- wp:paragraph -->
              - generic [ref=f8e1453]: <p>Acara malam pentas seni ini menjadi momentum penting untuk memperkuat persatuan, gotong royong, dan kebersamaan antar warga di lingkungan RT 02 dan 06 RW 05 Tirtajaya</p>
