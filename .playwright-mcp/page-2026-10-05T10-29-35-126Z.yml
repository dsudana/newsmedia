              - generic [ref=f8e1462]: <!-- wp:paragraph -->
              - generic [ref=f8e1463]: <p>Acara berlangsung meriah di Jalan Masjid Nurul Yakin RT 02 RW 05 Tirta Jaya, Sabtu malam (22/08/2026).</p>
              - generic [ref=f8e1464]: <!-- /wp:paragraph -->
              - generic [ref=f8e1465]: <!-- wp:paragraph -->
              - generic [ref=f8e1466]: <p>Kegiatan yang dipandu MC Rara dan Olik ini dibuka dengan menyanyikan lagu kebangsaan Indonesia Raya oleh seluruh warga yang hadir. Suasana khidmat langsung berubah menjadi riuh gembira saat acara inti dimulai.</p>
              - generic [ref=f8e1467]: <!-- /wp:paragraph -->
              - generic [ref=f8e1468]: <!-- wp:paragraph -->
              - generic [ref=f8e1469]: <p>Ketua RW 05, Yayat Hidayat dalam sambutannya mengajak seluruh warga untuk terus menjaga semangat kemerdekaan dengan aksi nyata.<br>"Saya mengimbau kepada seluruh warga agar membuang sampah pada tempatnya dan menjaga kebersihan lingkungan. Kemerdekaan juga berarti merdeka dari lingkungan yang kotor," ujarnya.</p>
              - generic [ref=f8e1470]: <!-- /wp:paragraph -->
              - generic [ref=f8e1471]: <!-- wp:paragraph -->
              - generic [ref=f8e1472]: <p>Sementara itu, Asri selaku Ketua RT 02 mengawali sambutannya dengan pekik kemerdekaan yang disambut sorak warga. Ia menyampaikan apresiasi dan terima kasih kepada seluruh warga serta panitia yang telah bekerja keras menyukseskan kegiatan ini.</p>
              - generic [ref=f8e1473]: <!-- /wp:paragraph -->
              - generic [ref=f8e1474]: <!-- wp:paragraph -->
              - generic [ref=f8e1475]: <p>"Malam ini adalah bukti kekompakan kita. Terima kasih kepada semua yang sudah berpartisipasi. Semoga kegiatan seperti ini terus kita jaga untuk mempererat silaturahmi," katanya.</p>
              - generic [ref=f8e1476]: <!-- /wp:paragraph -->
              - generic [ref=f8e1477]: <!-- wp:paragraph -->
              - generic [ref=f8e1478]: <p>Panggung pentas seni menampilkan berbagai pertunjukan dari warga berbagai usia. Mulai dari tari, menyanyi, puisi, hingga drama komedi berhasil menghibur dan mengundang gelak tawa penonton.</p>
              - generic [ref=f8e1479]: <!-- /wp:paragraph -->
              - generic [ref=f8e1480]: <!-- wp:paragraph -->
              - generic [ref=f8e1481]: <p>Kemeriahan malam itu memuncak dengan atraksi kembang api yang menyalakan langit Tirta Jaya. Sorak sorai warga mengiringi setiap dentuman kembang api sebagai simbol semangat dan harapan di usia kemerdekaan ke-81.</p>
              - generic [ref=f8e1482]: <!-- /wp:paragraph -->
              - generic [ref=f8e1483]: <!-- wp:paragraph -->
              - generic [ref=f8e1484]: <p>Acara malam pentas seni ini menjadi momentum penting untuk memperkuat persatuan, gotong royong, dan kebersamaan antar warga di lingkungan RT 02 dan 06 RW 05 Tirtajaya</p>
              - generic [ref=f8e1485]: "<!-- /wp:paragraph -->\";s:14:\"featured_image\";s:103:\"articles/meriahnya-hajatan-warga-rt-02-06-rw-05-tirtajaya-gelar-pentas-seni-hut-ke-81-ri-1790924823.jpg\";s:10:\"meta_title\";s:86:\"MERIAHNYA HAJATAN WARGA RT 02 &amp; 06 RW 05 TIRTAJAYA GELAR PENTAS SENI HUT KE 81 RI\";s:16:\"meta_description\";s:0:\"\";s:11:\"schema_type\";s:7:\"Article\";s:6:\"status\";s:9:\"published\";s:12:\"published_at\";s:19:\"2026-08-23 11:34:51\";s:12:\"scheduled_at\";N;s:11:\"views_count\";i:0;s:9:\"read_time\";i:2;s:10:\"word_count\";i:250;s:11:\"ai_provider\";N;s:9:\"seo_score\";i:0;s:11:\"is_featured\";i:0;s:11:\"is_breaking\";i:0;s:11:\"is_headline\";i:0;s:4:\"tags\";N;s:8:\"location\";N;s:11:\"series_name\";N;s:12:\"series_order\";N;s:10:\"deleted_at\";N;s:10:\"created_at\";s:19:\"2026-10-02 07:07:03\";s:10:\"updated_at\";s:19:\"2026-10-02 07:07:03\";}s:10:\"*changes\";a:0:{}s:11:\"*previous\";a:0:{}s:8:\"*casts\";a:7:{s:12:\"published_at\";s:8:\"datetime\";s:12:\"scheduled_at\";s:8:\"datetime\";s:11:\"is_featured\";s:7:\"boolean\";s:9:\"read_time\";s:7:\"integer\";s:10:\"word_count\";s:7:\"integer\";s:9:\"seo_score\";s:7:\"integer\";s:10:\"deleted_at\";s:8:\"datetime\";}s:17:\"*classCastCache\";a:0:{}s:21:\"*attributeCastCache\";a:0:{}s:13:\"*dateFormat\";N;s:10:\"*appends\";a:4:{i:0;s:3:\"url\";i:1;s:5:\"image\";i:2;s:4:\"date\";i:3;s:6:\"author\";}s:19:\"*dispatchesEvents\";a:0:{}s:14:\"*observables\";a:0:{}s:12:\"*relations\";a:2:{s:8:\"category\";r:99;s:4:\"user\";r:151;}s:10:\"*touches\";a:0:{}s:27:\"*relationAutoloadCallback\";N;s:26:\"*relationAutoloadContext\";N;s:10:\"timestamps\";b:1;s:13:\"usesUniqueIds\";b:0;s:9:\"*hidden\";a:0:{}s:10:\"*visible\";a:0:{}s:11:\"*fillable\";a:19:{i:0;s:7:\"user_id\";i:1;s:11:\"category_id\";i:2;s:5:\"title\";i:3;s:4:\"slug\";i:4;s:7:\"excerpt\";i:5;s:7:\"content\";i:6;s:14:\"featured_image\";i:7;s:10:\"meta_title\";i:8;s:16:\"meta_description\";i:9;s:11:\"schema_type\";i:10;s:6:\"status\";i:11;s:12:\"published_at\";i:12;s:12:\"scheduled_at\";i:13;s:11:\"views_count\";i:14;s:11:\"is_featured\";i:15;s:9:\"read_time\";i:16;s:10:\"word_count\";i:17;s:11:\"ai_provider\";i:18;s:9:\"seo_score\";}s:10:\"*guarded\";a:1:{i:0;s:1:\"*\";}s:16:\"*forceDeleting\";b:0;}i:12;O:18:\"App\\Models\\Article\":34:{s:13:\"*connection\";s:5:\"mysql\";s:8:\"*table\";s:8:\"articles\";s:13:\"*primaryKey\";s:2:\"id\";s:10:\"*keyType\";s:3:\"int\";s:12:\"incrementing\";b:1;s:7:\"*with\";a:0:{}s:12:\"*withCount\";a:0:{}s:19:\"preventsLazyLoading\";b:0;s:10:\"*perPage\";i:15;s:6:\"exists\";b:1;s:18:\"wasRecentlyCreated\";b:0;s:28:\"*escapeWhenCastingToString\";b:0;s:13:\"*attributes\";a:30:{s:2:\"id\";i:889;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:92:\"Mensyukuri Kemerdekaan’ MT Balwan Kota Depok Gaungkan Persatuan Bareng Dinsos dan Imigrasi\";s:4:\"slug\";s:89:\"mensyukuri-kemerdekaan-mt-balwan-kota-depok-gaungkan-persatuan-bareng-dinsos-dan-imigrasi\";s:7:\"excerpt\";s:0:\"\";s:7:\"content\";s:7730:\"<!-- wp:paragraph -->"
              - generic [ref=f8e1486]: <p>DEPOK- Masih dalam suasana Hari Ulang Tahun Kemerdekaan Republik Indonesia ke-81,<br>Majelis Taklim (MT) Balai Wartawan (Balwan) Kota Depok kembali menggelar rutinitas Pengajian Bulanan di Balai Wartawan Kota Depok dengan mengangkat tajuk 'Perkuat Persatuan dan Mensyukuri Nikmat Kemerdekaan' yang berlangsung di Sekretariat Balai Wartawan Kota Depok, Kamis (20/08/2026).</p>
              - generic [ref=f8e1487]: <!-- /wp:paragraph -->
              - generic [ref=f8e1488]: "<!-- wp:gallery {\"linkTo\":\"none\"} -->"
              - generic [ref=f8e1489]: "<figure class=\"wp-block-gallery has-nested-images columns-default is-cropped\"><!-- wp:image {\"id\":1100,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e1490]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/08/4a459fa0-b55d-4a47-af7f-6c2fa95b23bc.jpeg" alt="" class="wp-image-1100"/></figure>
              - generic [ref=f8e1491]: <!-- /wp:image --></figure>
              - generic [ref=f8e1492]: <!-- /wp:gallery -->
              - generic [ref=f8e1493]: "<!-- wp:gallery {\"linkTo\":\"none\"} -->"
              - generic [ref=f8e1494]: "<figure class=\"wp-block-gallery has-nested-images columns-default is-cropped\"><!-- wp:image {\"id\":1101,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e1495]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/08/IMG_4126-1024x768.jpeg" alt="" class="wp-image-1101"/></figure>
              - generic [ref=f8e1496]: <!-- /wp:image --></figure>
              - generic [ref=f8e1497]: <!-- /wp:gallery -->
              - generic [ref=f8e1498]: <!-- wp:paragraph -->
              - generic [ref=f8e1499]: <p>Pengajian Bulanan MT. Balwan Kota Depok kali ini menghadirkan Narasumber Kepala Dinas Sosial Kota Depok, H. Utang Wardaya, tausyiah disampaikan oleh Ustadz H. Syahruddin El Fikri, pembacaan tahlil dan tahmid oleh Ustadz Salwani, serta dihadiri perwakilan Kantor Imigrasi Kelas I Non TPI Depok, Anwar dan Nurjaya Depok ini menjadi momentum untuk mempererat silaturahmi, memperkuat nilai-nilai keagamaan, sekaligus membangun sinergi antara insan pers dengan berbagai unsur pemerintah dan instansi di Kota Depok.</p>
              - generic [ref=f8e1500]: <!-- /wp:paragraph -->
              - generic [ref=f8e1501]: <!-- wp:paragraph -->
              - generic [ref=f8e1502]: <p>Ketua MT Balai Wartawan Kota Depok, Adie Rakasiwi, menyampaikan apresiasi dan terima kasih kepada seluruh pihak yang telah hadir dan memberikan dukungan terhadap kegiatan rutin tersebut.</p>
              - generic [ref=f8e1503]: <!-- /wp:paragraph -->
              - generic [ref=f8e1504]: <!-- wp:paragraph -->
              - generic [ref=f8e1505]: <p>Ucapan terima kasih secara khusus disampaikan kepada para pembina, penasihat, anggota MT. Balwan, Kepala Dinas Sosial Kota Depok H. Utang Wardaya, serta perwakilan Kantor Imigrasi Kelas I Non TPI Depok, Anwar dan Nurjaya.</p>
              - generic [ref=f8e1506]: <!-- /wp:paragraph -->
              - generic [ref=f8e1507]: <!-- wp:paragraph -->
              - generic [ref=f8e1508]: <p>"Terima kasih kepada seluruh pihak yang telah meluangkan waktu untuk hadir dan bersama-sama mengikuti pengajian rutin bulanan MT. Balwan Kota Depok. Semoga kebersamaan ini terus terjaga dan ke depan kita dapat membangun sinergi yang semakin baik," ujar Adie Rakasiwi.</p>
              - generic [ref=f8e1509]: <!-- /wp:paragraph -->
              - generic [ref=f8e1510]: <!-- wp:paragraph -->
              - generic [ref=f8e1511]: <p>Menurut Adie, MT. Balwan Kota Depok tidak hanya menjadi wadah untuk meningkatkan keimanan dan ketakwaan, tetapi juga diharapkan mampu menjadi ruang silaturahmi serta jembatan komunikasi yang positif dengan berbagai instansi yang ada di kota Depok.</p>
              - generic [ref=f8e1512]: <!-- /wp:paragraph -->
              - generic [ref=f8e1513]: <!-- wp:paragraph -->
              - generic [ref=f8e1514]: <p>"Saya berharap hubungan baik antara MT. Balai Wartawan Kota Depok dengan Dinas Sosial maupun Kantor Imigrasi Kelas I Non TPI Depok dapat terus terjaga dan berkembang melalui berbagai kegiatan yang memberikan manfaat bagi masyarakat Depok," harapnya.</p>
              - generic [ref=f8e1515]: <!-- /wp:paragraph -->
              - generic [ref=f8e1516]: <!-- wp:paragraph -->
              - generic [ref=f8e1517]: <p>Sementara itu, Anwar dan Nurjaya selaku perwakilan Kantor Imigrasi Kelas I Non TPI Depok mengapresiasi undangan dan sambutan yang diberikan MT. Balwan Kota Depok.</p>
              - generic [ref=f8e1518]: <!-- /wp:paragraph -->
              - generic [ref=f8e1519]: <!-- wp:paragraph -->
              - generic [ref=f8e1520]: <p>Mereka berharap silaturahmi yang telah terjalin tidak berhenti pada kegiatan pengajian semata, tetapi dapat berkembang menjadi kerja sama dan sinergi yang lebih kuat di masa mendatang.</p>
              - generic [ref=f8e1521]: <!-- /wp:paragraph -->
              - generic [ref=f8e1522]: <!-- wp:paragraph -->
              - generic [ref=f8e1523]: <p>"Kami mewakili Pimpinan Kantor Imigrasi Depok mengucapkan terima kasih kepada MT. Balai Wartawan Kota Depok yang telah mengundang kami. Semoga ke depan hubungan dan sinergi antara Imigrasi dengan MT. Balwan Kota Depok dapat terus terjalin dengan semakin baik," ungkapnya.</p>
              - generic [ref=f8e1524]: <!-- /wp:paragraph -->
              - generic [ref=f8e1525]: <!-- wp:paragraph -->
              - generic [ref=f8e1526]: <p>Sedangkan Kepala Dinas Sosial Kota Depok, H. Utang Wardaya mengaku bersyukur dapat hadir dan bersilaturahmi bersama keluarga besar MT. Balai Wartawan Kota Depok.</p>
              - generic [ref=f8e1527]: <!-- /wp:paragraph -->
              - generic [ref=f8e1528]: <!-- wp:paragraph -->
              - generic [ref=f8e1529]: <p>Ia juga menyampaikan sejumlah gambaran mengenai tugas dan peran Dinas Sosial dalam menangani persoalan kesejahteraan sosial di Kota Depok, khususnya dalam memberikan perlindungan kepada kelompok masyarakat yang membutuhkan perhatian.</p>
              - generic [ref=f8e1530]: <!-- /wp:paragraph -->
              - generic [ref=f8e1531]: <!-- wp:paragraph -->
              - generic [ref=f8e1532]: <p>"Berdasarkan data Dinas Sosial Kota Depok tertanggal 27 Februari 2026, jumlah Pemerlu Pelayanan Kesejahteraan Sosial (PPKS) pada tahun 2025 untuk kategori anak terlantar usia 6 hingga 17 tahun mencapai 2.346 orang. Selain itu, terdapat 21 anak balita terlantar, sehingga secara keseluruhan tercatat 2.367 anak terlantar," papar Utang Wardaya.</p>
              - generic [ref=f8e1533]: <!-- /wp:paragraph -->
              - generic [ref=f8e1534]: <!-- wp:paragraph -->
              - generic [ref=f8e1535]: <p>Utang juga menjelaskan, bagi anak-anak terlantar yang tidak mengalami kondisi disabilitas fisik maupun mental, Pemerintah Kota (Pemkot) Depok membangun kerja sama dengan sejumlah panti asuhan dan panti sosial.</p>
              - generic [ref=f8e1536]: <!-- /wp:paragraph -->
              - generic [ref=f8e1537]: <!-- wp:paragraph -->
              - generic [ref=f8e1538]: <p>"Untuk anak-anak terlantar yang kondisinya normal, kami titipkan ke panti-panti anak yang telah bekerja sama dengan Dinas Sosial. Tujuannya untuk menjamin hak hidup mereka, baik kebutuhan fisik, pendidikan maupun kesehatan," jelasnya.</p>
              - generic [ref=f8e1539]: <!-- /wp:paragraph -->
              - generic [ref=f8e1540]: <!-- wp:paragraph -->
              - generic [ref=f8e1541]: <p>Selain penanganan anak terlantar, Dinsos Kota Depok juga terus melakukan penguatan program perlindungan sosial. Hingga pertengahan 2026, realisasi penyaluran bantuan sosial dari Kementerian Sosial kepada puluhan ribu Keluarga Penerima Manfaat (KPM) di Depok disebut telah mencapai lebih dari Rp41 miliar.</p>
              - generic [ref=f8e1542]: <!-- /wp:paragraph -->
              - generic [ref=f8e1543]: <!-- wp:paragraph -->
              - generic [ref=f8e1544]: <p>"Penguatan data sosial juga menjadi perhatian penting melalui pemanfaatan Data Tunggal Sosial Ekonomi Nasional (DTSEN) serta optimalisasi 126 petugas Puskesos SLRT yang berada di tingkat kelurahan. Langkah tersebut diharapkan mampu membuat pelayanan perlindungan sosial bagi warga kurang mampu semakin tepat sasaran," terangnya.</p>
              - generic [ref=f8e1545]: <!-- /wp:paragraph -->
              - generic [ref=f8e1546]: <!-- wp:paragraph -->
              - generic [ref=f8e1547]: <p>Ustadz Syahruddin El Fikri mengingatkan pentingnya peran wartawan dalam menyampaikan informasi yang benar, akurat dan bertanggung jawab kepada masyarakat.</p>
              - generic [ref=f8e1548]: <!-- /wp:paragraph -->
              - generic [ref=f8e1549]: <!-- wp:paragraph -->
              - generic [ref=f8e1550]: <p>Menurutnya, insan pers memiliki tanggung jawab besar dalam menjaga kualitas informasi di tengah derasnya arus berita dan penyebaran informasi yang belum tentu dapat dipertanggungjawabkan kebenarannya.</p>
              - generic [ref=f8e1551]: <!-- /wp:paragraph -->
              - generic [ref=f8e1552]: <!-- wp:paragraph -->
              - generic [ref=f8e1553]: <p>"Seorang wartawan harus menyampaikan informasi dengan baik dan benar. Jangan sampai masyarakat justru menerima informasi hoaks yang dapat menimbulkan kesalahpahaman," pesannya.</p>
              - generic [ref=f8e1554]: <!-- /wp:paragraph -->
              - generic [ref=f8e1555]: <!-- wp:paragraph -->
              - generic [ref=f8e1556]: <p>Ia juga mengajak seluruh peserta untuk semakin peka terhadap kondisi masyarakat yang masih menghadapi berbagai kerentanan, baik dari sisi ekonomi, sosial maupun kesehatan.</p>
              - generic [ref=f8e1557]: <!-- /wp:paragraph -->
              - generic [ref=f8e1558]: <!-- wp:paragraph -->
              - generic [ref=f8e1559]: <p>Sejalan dengan tema 'Perkuat Persatuan dan Mensyukuri Nikmat Kemerdekaan', Ustadz Syahruddin mengingatkan bahwa rasa syukur atas nikmat kemerdekaan harus diwujudkan melalui kepedulian, persatuan dan semangat saling membantu.</p>
              - generic [ref=f8e1560]: <!-- /wp:paragraph -->
              - generic [ref=f8e1561]: <!-- wp:paragraph -->
              - generic [ref=f8e1562]: <p>"Melalui kisah tentang anak-anak dengan berbagai keterbatasan, ia mengajak jamaah untuk lebih mensyukuri nikmat yang telah diberikan Allah SWT serta meningkatkan kepedulian terhadap sesama," pungkasnya.</p>
              - generic [ref=f8e1563]: <!-- /wp:paragraph -->
              - generic [ref=f8e1564]: <!-- wp:paragraph -->
              - generic [ref=f8e1565]: <p></p>
