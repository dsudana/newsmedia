              - generic [ref=f8e1581]: <!-- /wp:paragraph -->
              - generic [ref=f8e1582]: <!-- wp:paragraph -->
              - generic [ref=f8e1583]: <p>Ketua MT Balai Wartawan Kota Depok, Adie Rakasiwi, menyampaikan apresiasi dan terima kasih kepada seluruh pihak yang telah hadir dan memberikan dukungan terhadap kegiatan rutin tersebut.</p>
              - generic [ref=f8e1584]: <!-- /wp:paragraph -->
              - generic [ref=f8e1585]: <!-- wp:paragraph -->
              - generic [ref=f8e1586]: <p>Ucapan terima kasih secara khusus disampaikan kepada para pembina, penasihat, anggota MT. Balwan, Kepala Dinas Sosial Kota Depok H. Utang Wardaya, serta perwakilan Kantor Imigrasi Kelas I Non TPI Depok, Anwar dan Nurjaya.</p>
              - generic [ref=f8e1587]: <!-- /wp:paragraph -->
              - generic [ref=f8e1588]: <!-- wp:paragraph -->
              - generic [ref=f8e1589]: <p>"Terima kasih kepada seluruh pihak yang telah meluangkan waktu untuk hadir dan bersama-sama mengikuti pengajian rutin bulanan MT. Balwan Kota Depok. Semoga kebersamaan ini terus terjaga dan ke depan kita dapat membangun sinergi yang semakin baik," ujar Adie Rakasiwi.</p>
              - generic [ref=f8e1590]: <!-- /wp:paragraph -->
              - generic [ref=f8e1591]: <!-- wp:paragraph -->
              - generic [ref=f8e1592]: <p>Menurut Adie, MT. Balwan Kota Depok tidak hanya menjadi wadah untuk meningkatkan keimanan dan ketakwaan, tetapi juga diharapkan mampu menjadi ruang silaturahmi serta jembatan komunikasi yang positif dengan berbagai instansi yang ada di kota Depok.</p>
              - generic [ref=f8e1593]: <!-- /wp:paragraph -->
              - generic [ref=f8e1594]: <!-- wp:paragraph -->
              - generic [ref=f8e1595]: <p>"Saya berharap hubungan baik antara MT. Balai Wartawan Kota Depok dengan Dinas Sosial maupun Kantor Imigrasi Kelas I Non TPI Depok dapat terus terjaga dan berkembang melalui berbagai kegiatan yang memberikan manfaat bagi masyarakat Depok," harapnya.</p>
              - generic [ref=f8e1596]: <!-- /wp:paragraph -->
              - generic [ref=f8e1597]: <!-- wp:paragraph -->
              - generic [ref=f8e1598]: <p>Sementara itu, Anwar dan Nurjaya selaku perwakilan Kantor Imigrasi Kelas I Non TPI Depok mengapresiasi undangan dan sambutan yang diberikan MT. Balwan Kota Depok.</p>
              - generic [ref=f8e1599]: <!-- /wp:paragraph -->
              - generic [ref=f8e1600]: <!-- wp:paragraph -->
              - generic [ref=f8e1601]: <p>Mereka berharap silaturahmi yang telah terjalin tidak berhenti pada kegiatan pengajian semata, tetapi dapat berkembang menjadi kerja sama dan sinergi yang lebih kuat di masa mendatang.</p>
              - generic [ref=f8e1602]: <!-- /wp:paragraph -->
              - generic [ref=f8e1603]: <!-- wp:paragraph -->
              - generic [ref=f8e1604]: <p>"Kami mewakili Pimpinan Kantor Imigrasi Depok mengucapkan terima kasih kepada MT. Balai Wartawan Kota Depok yang telah mengundang kami. Semoga ke depan hubungan dan sinergi antara Imigrasi dengan MT. Balwan Kota Depok dapat terus terjalin dengan semakin baik," ungkapnya.</p>
              - generic [ref=f8e1605]: <!-- /wp:paragraph -->
              - generic [ref=f8e1606]: <!-- wp:paragraph -->
              - generic [ref=f8e1607]: <p>Sedangkan Kepala Dinas Sosial Kota Depok, H. Utang Wardaya mengaku bersyukur dapat hadir dan bersilaturahmi bersama keluarga besar MT. Balai Wartawan Kota Depok.</p>
              - generic [ref=f8e1608]: <!-- /wp:paragraph -->
              - generic [ref=f8e1609]: <!-- wp:paragraph -->
              - generic [ref=f8e1610]: <p>Ia juga menyampaikan sejumlah gambaran mengenai tugas dan peran Dinas Sosial dalam menangani persoalan kesejahteraan sosial di Kota Depok, khususnya dalam memberikan perlindungan kepada kelompok masyarakat yang membutuhkan perhatian.</p>
              - generic [ref=f8e1611]: <!-- /wp:paragraph -->
              - generic [ref=f8e1612]: <!-- wp:paragraph -->
              - generic [ref=f8e1613]: <p>"Berdasarkan data Dinas Sosial Kota Depok tertanggal 27 Februari 2026, jumlah Pemerlu Pelayanan Kesejahteraan Sosial (PPKS) pada tahun 2025 untuk kategori anak terlantar usia 6 hingga 17 tahun mencapai 2.346 orang. Selain itu, terdapat 21 anak balita terlantar, sehingga secara keseluruhan tercatat 2.367 anak terlantar," papar Utang Wardaya.</p>
              - generic [ref=f8e1614]: <!-- /wp:paragraph -->
              - generic [ref=f8e1615]: <!-- wp:paragraph -->
              - generic [ref=f8e1616]: <p>Utang juga menjelaskan, bagi anak-anak terlantar yang tidak mengalami kondisi disabilitas fisik maupun mental, Pemerintah Kota (Pemkot) Depok membangun kerja sama dengan sejumlah panti asuhan dan panti sosial.</p>
              - generic [ref=f8e1617]: <!-- /wp:paragraph -->
              - generic [ref=f8e1618]: <!-- wp:paragraph -->
              - generic [ref=f8e1619]: <p>"Untuk anak-anak terlantar yang kondisinya normal, kami titipkan ke panti-panti anak yang telah bekerja sama dengan Dinas Sosial. Tujuannya untuk menjamin hak hidup mereka, baik kebutuhan fisik, pendidikan maupun kesehatan," jelasnya.</p>
              - generic [ref=f8e1620]: <!-- /wp:paragraph -->
              - generic [ref=f8e1621]: <!-- wp:paragraph -->
              - generic [ref=f8e1622]: <p>Selain penanganan anak terlantar, Dinsos Kota Depok juga terus melakukan penguatan program perlindungan sosial. Hingga pertengahan 2026, realisasi penyaluran bantuan sosial dari Kementerian Sosial kepada puluhan ribu Keluarga Penerima Manfaat (KPM) di Depok disebut telah mencapai lebih dari Rp41 miliar.</p>
              - generic [ref=f8e1623]: <!-- /wp:paragraph -->
              - generic [ref=f8e1624]: <!-- wp:paragraph -->
              - generic [ref=f8e1625]: <p>"Penguatan data sosial juga menjadi perhatian penting melalui pemanfaatan Data Tunggal Sosial Ekonomi Nasional (DTSEN) serta optimalisasi 126 petugas Puskesos SLRT yang berada di tingkat kelurahan. Langkah tersebut diharapkan mampu membuat pelayanan perlindungan sosial bagi warga kurang mampu semakin tepat sasaran," terangnya.</p>
              - generic [ref=f8e1626]: <!-- /wp:paragraph -->
              - generic [ref=f8e1627]: <!-- wp:paragraph -->
              - generic [ref=f8e1628]: <p>Ustadz Syahruddin El Fikri mengingatkan pentingnya peran wartawan dalam menyampaikan informasi yang benar, akurat dan bertanggung jawab kepada masyarakat.</p>
              - generic [ref=f8e1629]: <!-- /wp:paragraph -->
              - generic [ref=f8e1630]: <!-- wp:paragraph -->
              - generic [ref=f8e1631]: <p>Menurutnya, insan pers memiliki tanggung jawab besar dalam menjaga kualitas informasi di tengah derasnya arus berita dan penyebaran informasi yang belum tentu dapat dipertanggungjawabkan kebenarannya.</p>
              - generic [ref=f8e1632]: <!-- /wp:paragraph -->
              - generic [ref=f8e1633]: <!-- wp:paragraph -->
              - generic [ref=f8e1634]: <p>"Seorang wartawan harus menyampaikan informasi dengan baik dan benar. Jangan sampai masyarakat justru menerima informasi hoaks yang dapat menimbulkan kesalahpahaman," pesannya.</p>
              - generic [ref=f8e1635]: <!-- /wp:paragraph -->
              - generic [ref=f8e1636]: <!-- wp:paragraph -->
              - generic [ref=f8e1637]: <p>Ia juga mengajak seluruh peserta untuk semakin peka terhadap kondisi masyarakat yang masih menghadapi berbagai kerentanan, baik dari sisi ekonomi, sosial maupun kesehatan.</p>
              - generic [ref=f8e1638]: <!-- /wp:paragraph -->
              - generic [ref=f8e1639]: <!-- wp:paragraph -->
              - generic [ref=f8e1640]: <p>Sejalan dengan tema 'Perkuat Persatuan dan Mensyukuri Nikmat Kemerdekaan', Ustadz Syahruddin mengingatkan bahwa rasa syukur atas nikmat kemerdekaan harus diwujudkan melalui kepedulian, persatuan dan semangat saling membantu.</p>
              - generic [ref=f8e1641]: <!-- /wp:paragraph -->
              - generic [ref=f8e1642]: <!-- wp:paragraph -->
              - generic [ref=f8e1643]: <p>"Melalui kisah tentang anak-anak dengan berbagai keterbatasan, ia mengajak jamaah untuk lebih mensyukuri nikmat yang telah diberikan Allah SWT serta meningkatkan kepedulian terhadap sesama," pungkasnya.</p>
              - generic [ref=f8e1644]: <!-- /wp:paragraph -->
              - generic [ref=f8e1645]: <!-- wp:paragraph -->
              - generic [ref=f8e1646]: <p></p>
