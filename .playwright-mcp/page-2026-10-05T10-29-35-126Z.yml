status\";i:11;s:12:\"published_at\";i:12;s:12:\"scheduled_at\";i:13;s:11:\"views_count\";i:14;s:11:\"is_featured\";i:15;s:9:\"read_time\";i:16;s:10:\"word_count\";i:17;s:11:\"ai_provider\";i:18;s:9:\"seo_score\";}s:10:\"*guarded\";a:1:{i:0;s:1:\"*\";}s:16:\"*forceDeleting\";b:0;}i:8;O:18:\"App\\Models\\Article\":34:{s:13:\"*connection\";s:5:\"mysql\";s:8:\"*table\";s:8:\"articles\";s:13:\"*primaryKey\";s:2:\"id\";s:10:\"*keyType\";s:3:\"int\";s:12:\"incrementing\";b:1;s:7:\"*with\";a:0:{}s:12:\"*withCount\";a:0:{}s:19:\"preventsLazyLoading\";b:0;s:10:\"*perPage\";i:15;s:6:\"exists\";b:1;s:18:\"wasRecentlyCreated\";b:0;s:28:\"*escapeWhenCastingToString\";b:0;s:13:\"*attributes\";a:30:{s:2:\"id\";i:893;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:94:\"Keluarga Besar H. Syamsuddin Gelar Takziah Peringatan 6 Hari Wafatnya Dra. Hj. Maryam, M.M.Pd.\";s:4:\"slug\";s:89:\"keluarga-besar-h-syamsuddin-gelar-takziah-peringatan-6-hari-wafatnya-dra-hj-maryam-m-m-pd\";s:7:\"excerpt\";s:0:\"\";s:7:\"content\";s:2503:\"<!-- wp:paragraph -->"
              - generic [ref=f8e1208]: <p>Depok, 28 Agustus 2026 — Keluarga besar Bapak H. Syamsuddin, H.S. mengadakan acara takziah dan doa bersama dalam rangka mengenang 6 hari wafatnya Almarhumah Dra. Hj. Maryam, M.M.Pd., yang merupakan istri tercinta dari Bapak H. Syamsuddin, H.S.</p>
              - generic [ref=f8e1209]: <!-- /wp:paragraph -->
              - generic [ref=f8e1210]: <!-- wp:paragraph -->
              - generic [ref=f8e1211]: <p>Acara mendoakan tersebut berlangsung pada Jumat, 28 Agustus 2026, pukul 19.30 WIB, bertempat di kediaman keluarga di Jl. Kali Licin Pitara RT. 03 RW. 013, Pancoran Mas, Kota Depok.</p>
              - generic [ref=f8e1212]: <!-- /wp:paragraph -->
              - generic [ref=f8e1213]: <!-- wp:paragraph -->
              - generic [ref=f8e1214]: <p>Acara yang dipandu oleh MC Rohmani ini dimulai dengan pembacaan Tahlil yang dipimpin oleh Ustadz Irwandi, diikuti oleh seluruh tamu undangan yang hadir dengan penuh kekhusyukan.</p>
              - generic [ref=f8e1215]: <!-- /wp:paragraph -->
              - generic [ref=f8e1216]: <!-- wp:paragraph -->
              - generic [ref=f8e1217]: <p>Selanjutnya, acara dilanjutkan dengan Taushiyah yang disampaikan oleh Abi Anshori. Dalam tausiyahnya, beliau menekankan pentingnya doa bagi mayit, menyampaikan bahwa tanpa doa, celakalah orang yang telah meninggal dunia. Abi Anshori juga menyampaikan bahwa Almarhumah Hj. Maryam merupakan sosok yang baik, mengingat jabatannya semasa hidup sebagai seorang guru yang merupakan profesi mulia.</p>
              - generic [ref=f8e1218]: <!-- /wp:paragraph -->
              - generic [ref=f8e1219]: <!-- wp:paragraph -->
              - generic [ref=f8e1220]: <p>Rangkaian acara kemudian ditutup dengan doa yang dipimpin oleh Ustadz Abdullah, memohon agar Almarhumah diampuni segala dosanya, diterima seluruh amal ibadahnya, serta keluarga yang ditinggalkan diberikan kesabaran dan ketabahan.</p>
              - generic [ref=f8e1221]: <!-- /wp:paragraph -->
              - generic [ref=f8e1222]: <!-- wp:paragraph -->
              - generic [ref=f8e1223]: <p>Acara berlangsung dengan tertib dan diikuti oleh sanak saudara, kerabat, tetangga, serta handai taulan yang turut mendoakan Almarhumah.</p>
              - generic [ref=f8e1224]: <!-- /wp:paragraph -->
