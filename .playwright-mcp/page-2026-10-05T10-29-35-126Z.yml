:\"published_at\";i:12;s:12:\"scheduled_at\";i:13;s:11:\"views_count\";i:14;s:11:\"is_featured\";i:15;s:9:\"read_time\";i:16;s:10:\"word_count\";i:17;s:11:\"ai_provider\";i:18;s:9:\"seo_score\";}s:10:\"*guarded\";a:1:{i:0;s:1:\"*\";}s:16:\"*forceDeleting\";b:0;}i:6;O:18:\"App\\Models\\Article\":34:{s:13:\"*connection\";s:5:\"mysql\";s:8:\"*table\";s:8:\"articles\";s:13:\"*primaryKey\";s:2:\"id\";s:10:\"*keyType\";s:3:\"int\";s:12:\"incrementing\";b:1;s:7:\"*with\";a:0:{}s:12:\"*withCount\";a:0:{}s:19:\"preventsLazyLoading\";b:0;s:10:\"*perPage\";i:15;s:6:\"exists\";b:1;s:18:\"wasRecentlyCreated\";b:0;s:28:\"*escapeWhenCastingToString\";b:0;s:13:\"*attributes\";a:30:{s:2:\"id\";i:895;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:93:\"TAKHASSUS TAFSIR PKU MUI KOTA DEPOK HARI KEDUA SEMAKIN MENARIK, PEMATERI KOMPETEN DIBIDANGNYA\";s:4:\"slug\";s:92:\"takhassus-tafsir-pku-mui-kota-depok-hari-kedua-semakin-menarik-pemateri-kompeten-dibidangnya\";s:7:\"excerpt\";s:0:\"\";s:7:\"content\";s:5223:\"<!-- wp:paragraph -->"
              - generic [ref=f8e1016]: <p>*Depok, Selasa 15 September 2026 Program *Takhassus Tafsir dan Ilmu Tafsir Pendidikan Kader Ulama MUI Kota Depok* memasuki hari kedua, Antusiasme peserta semakin tinggi karena menghadirkan pemateri-pemateri yang kompeten di bidangnya.</p>
              - generic [ref=f8e1017]: <!-- /wp:paragraph -->
              - generic [ref=f8e1018]: <!-- wp:paragraph -->
              - generic [ref=f8e1019]: <p>Kegiatan masih dipusatkan di Gedung Dakwah MUI Kota Depok dan disiarkan langsung melalui channel <em>MUI Depok TV</em>.</p>
              - generic [ref=f8e1020]: <!-- /wp:paragraph -->
              - generic [ref=f8e1021]: <!-- wp:paragraph -->
              - generic [ref=f8e1022]: <p>Berikut kegiatan hari kedua:</p>
              - generic [ref=f8e1023]: <!-- /wp:paragraph -->
              - generic [ref=f8e1024]: <!-- wp:paragraph -->
              - generic [ref=f8e1025]: "<p><em>SESI 1: Tafsir Nusantara</em><br><em>Tema</em>: <em>التفسير في نوسانتارا: التاريخ والأنساب العلمية وتطوّره</em><br><em>“Tafsir Nusantara: Sejarah, Genealogi Keilmuan, dan Perkembangannya”</em></p>"
              - generic [ref=f8e1026]: <!-- /wp:paragraph -->
              - generic [ref=f8e1027]: <!-- wp:paragraph -->
              - generic [ref=f8e1028]: <p>Mengkaji sejarah, genealogi keilmuan, serta perkembangan metodologis Tafsir Nusantara sebagai tradisi penafsiran Al-Qur’an yang terbentuk melalui dialog antara khazanah Islam global dan konteks sosial-budaya lokal. Materi meliputi perkembangan tafsir dari tradisi lisan, terjemahan, dan pengajian kitab hingga lahirnya karya-karya tafsir Melayu-Jawi, bahasa Indonesia, dan bahasa daerah; peran jaringan ulama, pesantren, Haramain, percetakan, organisasi Islam, serta perubahan sosial-politik modern dalam pembentukan otoritas tafsir.</p>
              - generic [ref=f8e1029]: <!-- /wp:paragraph -->
              - generic [ref=f8e1030]: "<!-- wp:image {\"id\":1129,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e1031]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_4934-1024x768.jpeg" alt="" class="wp-image-1129"/></figure>
              - generic [ref=f8e1032]: <!-- /wp:image -->
              - generic [ref=f8e1033]: <!-- wp:image -->
              - generic [ref=f8e1034]: <figure class="wp-block-image"><img alt=""/></figure>
              - generic [ref=f8e1035]: <!-- /wp:image -->
              - generic [ref=f8e1036]: <!-- wp:image -->
              - generic [ref=f8e1037]: <figure class="wp-block-image"><img alt=""/></figure>
              - generic [ref=f8e1038]: <!-- /wp:image -->
              - generic [ref=f8e1039]: <!-- wp:image -->
              - generic [ref=f8e1040]: <figure class="wp-block-image"><img alt=""/></figure>
              - generic [ref=f8e1041]: <!-- /wp:image -->
              - generic [ref=f8e1042]: <!-- wp:paragraph -->
              - generic [ref=f8e1043]: "<p><em>Pemateri Utama</em>: <em>Prof. Dr. Lilik Ummi Kaltsum</em><br><em>Pendamping</em>: <em>KH. Yusron Shidqi, MA</em> Pimpinan Pondok Pesantren Al-Hikam Depok</p>"
              - generic [ref=f8e1044]: <!-- /wp:paragraph -->
              - generic [ref=f8e1045]: <!-- wp:paragraph -->
              - generic [ref=f8e1046]: "<p><em>SESI 2: Tafsir Isyari</em><br><em>Tema</em>: <em>اﻟﺘﻔﺴﯿﺮ اﻹﺷﺎري ﻋﻨﺪ اﺑﻦ ﻋﺮﺑﻲ وﻋﺒﺪ اﻟﻘﺎدر اﻟﺠﯿﻼﻧﻲ</em><br><em>“Tafsir Isyari menurut Ibnu 'Arabi dan 'Abdul Qadir al-Jilani”</em></p>"
              - generic [ref=f8e1047]: <!-- /wp:paragraph -->
              - generic [ref=f8e1048]: <!-- wp:paragraph -->
              - generic [ref=f8e1049]: <p>Kajian mendalam terhadap dimensi at-Tafsir al-Isyari atau tafsir sufi/esoteris. Menganalisis perbedaan metodologis dan kedalaman makna batiniyah antara gaya penafsiran Wahdat al-Wujud karya Ibnu 'Arabi dengan pendekatan sufistik-amali karya Syekh 'Abdul Qadir al-Jilani, disertai batasan ketat <code>dhawabit</code> yang membedakan tafsir isyari yang dapat diterima <code>maqbul</code> dan yang tertolak <code>mardud</code>.</p>
              - generic [ref=f8e1050]: <!-- /wp:paragraph -->
              - generic [ref=f8e1051]: "<!-- wp:image {\"id\":1131,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e1052]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_4940-1024x768.jpeg" alt="" class="wp-image-1131"/></figure>
              - generic [ref=f8e1053]: <!-- /wp:image -->
              - generic [ref=f8e1054]: <!-- wp:paragraph -->
              - generic [ref=f8e1055]: "<p><em>Pemateri Utama</em>: <em>Dr. KH. Ali M. Abdillah, MA</em> Guru Thariqah dan Sekjen JATMAN<br><em>Pendamping</em>: <em>Dr. KH. M. Shofin Sugito</em> Dosen UIN Banten, Alumni PhD Université Sidi Mohamed Ben Abdellah Fes, Maroko</p>"
              - generic [ref=f8e1056]: <!-- /wp:paragraph -->
              - generic [ref=f8e1057]: <!-- wp:paragraph -->
              - generic [ref=f8e1058]: "<p><em>SESI 3: Perspektif Perempuan</em><br><em>Pukul 13.30 - 15.30 WIB</em><br><em>Tema</em>: <em>ﻗﺮاءة ﻧﺴﺎﺋﯿﺔ ﻟﻠﻨﺺ اﻟﻘﺮءاﻧﻲ وﺗﺮاﺟﻤﮫ ﻓﻲ إﻧﺪوﻧﯿﺴﯿﺎ</em><br><em>“Tafsir dan Terjemah Al-Qur’an Indonesia Perspektif Perempuan”</em></p>"
              - generic [ref=f8e1059]: <!-- /wp:paragraph -->
              - generic [ref=f8e1060]: <!-- wp:paragraph -->
              - generic [ref=f8e1061]: <p>Analisis hermeneutika Al-Qur'an berbasis perspektif perempuan <code>qira'ah nisa'iyyah</code>. Menelaah pembacaan ayat-ayat kesetaraan, peran gender, dan hak-hak perempuan dalam literatur tafsir dan terjemahan di Indonesia guna menghasilkan pemahaman keagamaan yang adil, ramah keluarga, serta ramah perempuan.</p>
              - generic [ref=f8e1062]: <!-- /wp:paragraph -->
              - generic [ref=f8e1063]: <!-- wp:paragraph -->
              - generic [ref=f8e1064]: "<p><em>Pemateri Utama</em>: <em>Dr. Nur Rofiah, Bil. Uzm.</em> Direktur Akademik PKU Masjid Istiqlal Bergelar<br><em>Pendamping</em>: <em>Dr. Ade Rina Farida</em> Dosen UIN Syarif Hidayatullah Jakarta</p>"
              - generic [ref=f8e1065]: <!-- /wp:paragraph -->
              - generic [ref=f8e1066]: "<!-- wp:image {\"id\":1132,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e1067]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_4945-1024x768.jpeg" alt="" class="wp-image-1132"/></figure>
              - generic [ref=f8e1068]: <!-- /wp:image -->
              - generic [ref=f8e1069]: "<!-- wp:gallery {\"linkTo\":\"none\"} -->"
              - generic [ref=f8e1070]: <figure class="wp-block-gallery has-nested-images columns-default is-cropped"><!-- wp:image -->
              - generic [ref=f8e1071]: <figure class="wp-block-image"><img alt=""/></figure>
              - generic [ref=f8e1072]: <!-- /wp:image --></figure>
              - generic [ref=f8e1073]: <!-- /wp:gallery -->
              - generic [ref=f8e1074]: <!-- wp:paragraph -->
              - generic [ref=f8e1075]: <p>Dengan hadirnya para pakar dari berbagai disiplin ilmu, diharapkan kader ulama MUI Kota Depok mampu menjadi mufassir yang moderat, berwawasan Nusantara, dan mampu menjawab isu-isu kontemporer.</p>
