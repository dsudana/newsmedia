              - generic [ref=f8e1711]: <!-- /wp:image -->
              - generic [ref=f8e1712]: <!-- wp:paragraph -->
              - generic [ref=f8e1713]: <p><em>DEPOK</em> – Gerakan Nasional Anti Penyimpangan Seksual (GENAP) Kota Depok melakukan audiensi ke Pimpinan DPRD Kota Depok, Rabu (19/08/2026). Audiensi ini menjadi langkah nyata mendesak DPRD Kota Depok segera mengeluarkan Peraturan Daerah (PERDA) tentang Pelarangan LGBT.</p>
              - generic [ref=f8e1714]: <!-- /wp:paragraph -->
              - generic [ref=f8e1715]: <!-- wp:paragraph -->
              - generic [ref=f8e1716]: <p>Rombongan GENAP Kota Depok yang dikoordinatori H. Ahmad Saifuddin diterima langsung oleh Ketua DPRD Kota Depok Ade Supriyatna, ST, MAP, Ketua Fraksi Partai Demokrat Hj. Endah Winarti, SH, dan Ketua Fraksi Partai PKS Hafid Nasir.</p>
              - generic [ref=f8e1717]: <!-- /wp:paragraph -->
              - generic [ref=f8e1718]: <!-- wp:paragraph -->
              - generic [ref=f8e1719]: <p>GENAP Kota Depok hadir bersama unsur Tokoh Alim Ulama, Habaib, Aktivis Dakwah, Pondok Pesantren, Majelis Taklim, Forum DKM Masjid Musholla, dan Ormas-ormas se-Kota Depok.</p>
              - generic [ref=f8e1720]: <!-- /wp:paragraph -->
              - generic [ref=f8e1721]: <!-- wp:paragraph -->
              - generic [ref=f8e1722]: <p>Dalam audiensi tersebut, GENAP Depok menyerahkan 2 bundel konsep dan materi terkait urgensi PERDA Pelarangan LGBT. Materi disampaikan langsung oleh 3 narasumber dari berbagai perspektif.</p>
              - generic [ref=f8e1723]: <!-- /wp:paragraph -->
              - generic [ref=f8e1724]: <!-- wp:paragraph -->
              - generic [ref=f8e1725]: <p><em>1. Prof. DR. KH. Ahmad Dimyathi Badruzzaman, MA</em><br>Menjelaskan bahaya LGBT dalam perspektif Agama Islam berdasarkan dalil Al-Qur'an, Hadits, dan Riwayat Ibnu Abbas dalam Kitab Al-Kabair karya Imam Adz-Dzahabi.</p>
              - generic [ref=f8e1726]: <!-- /wp:paragraph -->
              - generic [ref=f8e1727]: <!-- wp:paragraph -->
              - generic [ref=f8e1728]: <p><em>2. Dokter Fakhrurrozi</em><br>Memaparkan dampak LGBT dari perspektif Kedokteran dan kesehatan masyarakat.</p>
              - generic [ref=f8e1729]: <!-- /wp:paragraph -->
              - generic [ref=f8e1730]: <!-- wp:paragraph -->
              - generic [ref=f8e1731]: <p><em>3. H. Borisa Rezadi Bachtiar, SH</em><br>Menjelaskan aspek hukum pidana terkait perilaku penyimpangan seksual.</p>
              - generic [ref=f8e1732]: <!-- /wp:paragraph -->
              - generic [ref=f8e1733]: <!-- wp:paragraph -->
              - generic [ref=f8e1734]: <p>Penutupan acara diisi doa oleh Syech Ikbal Khan. Dalam penyampaiannya, ia menegaskan agar PERDA Pelarangan LGBT jangan ditunda hingga tahun depan.<br>"Di Kota Depok sudah terjadi kejadian pembunuhan mutilasi yang terindikasi sebagai LGBT. Ini harus jadi perhatian serius kita bersama," tegasnya.</p>
              - generic [ref=f8e1735]: <!-- /wp:paragraph -->
              - generic [ref=f8e1736]: <!-- wp:paragraph -->
              - generic [ref=f8e1737]: <p>Hadir pula Prof. DR. Pangeran Syarif Abdurahman Bahasyim selaku Sekretaris RA Rabithah Alawiyah Kota Depok, Ust. Hidayatulloh, http://S.Pd.I sebagai Tokoh Remaja Islam, dan Subagya selaku Ketua JARETA Jaringan Rakyat Jelata.</p>
              - generic [ref=f8e1738]: <!-- /wp:paragraph -->
              - generic [ref=f8e1739]: "<!-- wp:image {\"id\":1097,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e1740]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/08/6750aa97-4643-46a6-93e5-cb0b53f490a6-1024x574.jpeg" alt="" class="wp-image-1097"/></figure>
              - generic [ref=f8e1741]: <!-- /wp:image -->
              - generic [ref=f8e1742]: <!-- wp:paragraph -->
              - generic [ref=f8e1743]: <p>Koordinator GENAP Kota Depok, H. Ahmad Saifuddin menyampaikan bahwa GENAP merupakan gerakan nasional yang sudah berdiri di berbagai daerah. Sejumlah DPRD di daerah lain telah membuat Raperda Pelarangan LGBT, di antaranya Bekasi, Bogor, Cianjur, Tasikmalaya, Ciamis, Bandung, Garut, Cirebon, Solo Raya, Sragen, Surabaya, dan Gorontalo.</p>
              - generic [ref=f8e1744]: <!-- /wp:paragraph -->
              - generic [ref=f8e1745]: <!-- wp:paragraph -->
              - generic [ref=f8e1746]: <p>"Kami berharap Depok sebagai Kota Religius segera menyusul daerah-daerah lain dalam melindungi generasi muda dari bahaya penyimpangan seksual melalui regulasi yang jelas," ujarnya.</p>
              - generic [ref=f8e1747]: <!-- /wp:paragraph -->
              - generic [ref=f8e1748]: <!-- wp:paragraph -->
              - generic [ref=f8e1749]: <p>Menanggapi audiensi tersebut, Ketua DPRD Kota Depok Ade Supriyatna, ST, MAP menutup acara dengan memohon doa dari seluruh hadirin agar PERDA Pelarangan LGBT dapat segera terealisasi di Kota Depok.</p>
              - generic [ref=f8e1750]: <!-- /wp:paragraph -->
              - generic [ref=f8e1751]: <!-- wp:paragraph -->
              - generic [ref=f8e1752]: <p>Audiensi ini diharapkan menjadi awal lahirnya regulasi yang dapat melindungi nilai-nilai agama, moralitas, dan ketahanan keluarga di Kota Depok.</p>
              - generic [ref=f8e1753]: <!-- /wp:paragraph -->
              - generic [ref=f8e1754]: <!-- wp:paragraph -->
              - generic [ref=f8e1755]: <p><em>(</em>)*_</p>
