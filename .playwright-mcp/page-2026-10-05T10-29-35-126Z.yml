:12:\"scheduled_at\";i:13;s:11:\"views_count\";i:14;s:11:\"is_featured\";i:15;s:9:\"read_time\";i:16;s:10:\"word_count\";i:17;s:11:\"ai_provider\";i:18;s:9:\"seo_score\";}s:10:\"*guarded\";a:1:{i:0;s:1:\"*\";}s:16:\"*forceDeleting\";b:0;}i:19;O:18:\"App\\Models\\Article\":34:{s:13:\"*connection\";s:5:\"mysql\";s:8:\"*table\";s:8:\"articles\";s:13:\"*primaryKey\";s:2:\"id\";s:10:\"*keyType\";s:3:\"int\";s:12:\"incrementing\";b:1;s:7:\"*with\";a:0:{}s:12:\"*withCount\";a:0:{}s:19:\"preventsLazyLoading\";b:0;s:10:\"*perPage\";i:15;s:6:\"exists\";b:1;s:18:\"wasRecentlyCreated\";b:0;s:28:\"*escapeWhenCastingToString\";b:0;s:13:\"*attributes\";a:30:{s:2:\"id\";i:882;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:82:\"MT. Balai Wartawan Kota Depok Soroti Peran Pers hingga Isu Keluarga dan Pendidikan\";s:4:\"slug\";s:81:\"mt-balai-wartawan-kota-depok-soroti-peran-pers-hingga-isu-keluarga-dan-pendidikan\";s:7:\"excerpt\";s:0:\"\";s:7:\"content\";s:6550:\"<!-- wp:image {\"id\":1075,\"sizeSlug\":\"full\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e2272]: <figure class="wp-block-image size-full"><img src="https://margondatv.com/wp-content/uploads/2026/07/158d7323-045b-4bbd-95ad-3381e1ac36b8.jpeg" alt="" class="wp-image-1075"/></figure>
              - generic [ref=f8e2273]: <!-- /wp:image -->
              - generic [ref=f8e2274]: <!-- wp:paragraph -->
              - generic [ref=f8e2275]: <p>-BALAIKOTA, DEPOK- Dengan mengangkat tajuk 'Bangun Kebersamaan , Raih Keberkahan', Majelis Taklim Balai Wartawan Kota Depok kembali menggelar pengajian rutin bulanan di Balai Wartawan Kota Depok pada Kamis (23/7/2026). Kegiatan pengajian bulanan ini menjadi ajang mempererat silaturahmi sekaligus memperkuat nilai-nilai keagamaan di kalangan insan pers dan masyarakat.</p>
              - generic [ref=f8e2276]: <!-- /wp:paragraph -->
              - generic [ref=f8e2277]: <!-- wp:paragraph -->
              - generic [ref=f8e2278]: <p>Pengajian bulanan kali ini MT. Balai Wartawan Kota Depok diawali pembacaan tahlil dan tahmid oleh Ustadz Salwani,&nbsp; tausyiah agama disampaikan oleh Penyuluh Agama Islam KUA Pancoran Mas, Ustadz Dedi Samsul Bahri, SHI., sedangkan Narasumber menghadirkan Kepala Bidang Riset dan Inovasi Bapperida Kota Depok, Fathir Fajar Sidiq, Ph.D., dihadiri perwakilan DPD Forkabi Kota Depok, DPP Ikatan Keluarga Wartawan Indonesia (IKWI), serta pengurus dan anggota MT. Balai Wartawan Kota Depok.</p>
              - generic [ref=f8e2279]: <!-- /wp:paragraph -->
              - generic [ref=f8e2280]: <!-- wp:paragraph -->
              - generic [ref=f8e2281]: <p>Ketua MT Balai Wartawan Kota Depok, Adie Rakasiwi, menyampaikan apresiasi kepada seluruh jamaah yang hadir serta support dan dukungannya untuk kegiatan rutinitas pengajian bulanan.</p>
              - generic [ref=f8e2282]: <!-- /wp:paragraph -->
              - generic [ref=f8e2283]: <!-- wp:paragraph -->
              - generic [ref=f8e2284]: <p>Adie menjelaskan, bahwa selain rutin menggelar pengajian, MT. Balai Wartawan Kota Depok juga aktif mengadakan berbagai kegiatan yang memadukan nilai spiritual dengan kebersamaan. Salah satunya adalah Camping Drone atau Tadabur Alam yang belum lama ini dilaksanakan di kawasan Cibodas, Jawa Barat dan melibatkan komunitas Mural Kota Depok serta DPD Forkabi Kota Depok sebagai bentuk kolaborasi lintas komunitas.</p>
              - generic [ref=f8e2285]: <!-- /wp:paragraph -->
              - generic [ref=f8e2286]: <!-- wp:paragraph -->
              - generic [ref=f8e2287]: <p>Ia juga mengajak seluruh anggota MT. Balai Wartawan Kota Depok untuk terus menjalankan fungsi pers secara bertanggung jawab, termasuk mengangkat berbagai isu sosial yang berkembang di tengah masyarakat, salah satunya mengenai persoalan LGBTQ yang saat ini menjadi perhatian publik di Kota Depok.</p>
              - generic [ref=f8e2288]: <!-- /wp:paragraph -->
              - generic [ref=f8e2289]: <!-- wp:paragraph -->
              - generic [ref=f8e2290]: <p>"Sebagai insan pers yang tergabung di MT. Balai Wartawan Kota Depok, kita harus peka dan peduli bila mendengar dan melihat hal penyimpangan terhadap prilaku yang kini tengah ramai diperbincangkan, yaitu Normalisasi LGBTQ. Saya mengajak seluruh pengurus dan jamaah melalui tulisan dimedianya masing-masing untuk menolak keras LGBTQ. kemunculan LGBTQ di Kota Depok yang tentunya telah membuat keresahan dimasyarakat, jika hal tersebut dibiarkan berlarut-larut tanpa tindakan, dikhawatirkan nilai-nilai luhur Kota Depok ini akan tergerus," ujarnya.</p>
              - generic [ref=f8e2291]: <!-- /wp:paragraph -->
              - generic [ref=f8e2292]: <!-- wp:paragraph -->
              - generic [ref=f8e2293]: <p>Sementara itu, Kepala Bidang Riset dan Inovasi Bapperida Kota Depok, Fathir Fajar Sidiq, Ph.D., berharap seluruh peserta pengajian memperoleh keberkahan dari Allah SWT.</p>
              - generic [ref=f8e2294]: <!-- /wp:paragraph -->
              - generic [ref=f8e2295]: <!-- wp:paragraph -->
              - generic [ref=f8e2296]: <p>Dalam paparannya, Fathir menegaskan bahwa pers memiliki posisi strategis sebagai pilar keempat demokrasi yang berperan menjaga keseimbangan kehidupan berbangsa dan bernegara bersama unsur eksekutif, legislatif, dan yudikatif.</p>
              - generic [ref=f8e2297]: <!-- /wp:paragraph -->
              - generic [ref=f8e2298]: <!-- wp:paragraph -->
              - generic [ref=f8e2299]: <p>"Pers harus tetap ramah, solid, profesional, dan menjaga netralitas. Senjata wartawan adalah lensa, pena, dan video. Melalui karya jurnalistik yang berkualitas, pers mampu memberikan pengaruh besar dalam membangun peradaban dan mengubah cara pandang masyarakat," kata Fathir.</p>
              - generic [ref=f8e2300]: <!-- /wp:paragraph -->
              - generic [ref=f8e2301]: <!-- wp:paragraph -->
              - generic [ref=f8e2302]: <p>Ia juga menyoroti tantangan dunia saat ini yang dikenal dengan konsep BANI (Brittle, Anxious, Nonlinear, Incomprehensible), yakni kondisi global yang penuh ketidakpastian dan perubahan cepat. "Dalam situasi tersebut, menurutnya, media memiliki tanggung jawab besar menghadirkan informasi yang akurat, edukatif, dan mencerahkan," jelasnya.</p>
              - generic [ref=f8e2303]: <!-- /wp:paragraph -->
              - generic [ref=f8e2304]: <!-- wp:paragraph -->
              - generic [ref=f8e2305]: <p>Fathir turut menyampaikan perkembangan sektor pendidikan di Kota Depok. Ia menjelaskan bahwa Pemerintah Kota Depok terus mengawal program pendidikan, termasuk keberadaan puluhan sekolah dalam program RSSG. Ia mengimbau masyarakat tidak khawatir apabila tidak diterima di sekolah negeri karena masih tersedia sekolah swasta yang dapat diakses secara gratis melalui program pemerintah.</p>
              - generic [ref=f8e2306]: <!-- /wp:paragraph -->
              - generic [ref=f8e2307]: <!-- wp:paragraph -->
              - generic [ref=f8e2308]: <p>Selain itu, ia mengungkapkan bahwa program Beasiswa Manusia Unggulan (MAUNG) masih dalam proses administrasi dan ditargetkan mulai berjalan dengan kuota sekitar 200 penerima dari keluarga kategori desil 1 hingga 5.</p>
              - generic [ref=f8e2309]: <!-- /wp:paragraph -->
              - generic [ref=f8e2310]: <!-- wp:paragraph -->
              - generic [ref=f8e2311]: <p>Sedangkang Penyuluh Agama Islam KUA Kecamatan Pancoran Mas, Ustadz Dedi Samsul Bahri, SHI., dalam tausyiahnya mengangkat berbagai persoalan sosial yang kini banyak terjadi di masyarakat, mulai dari meningkatnya angka perceraian hingga menurunnya pengawasan orang tua terhadap anak. Dirinya juga mengingatkan pentingnya peran keluarga dalam membina akhlak generasi muda.</p>
              - generic [ref=f8e2312]: <!-- /wp:paragraph -->
              - generic [ref=f8e2313]: <!-- wp:paragraph -->
              - generic [ref=f8e2314]: <p>"Fenomena remaja yang masih berkeliaran hingga larut malam, berpakaian tidak pantas, hingga perilaku yang menyimpang dari norma menjadi perhatian bersama yang harus disikapi dengan pembinaan dan pengawasan orang tua," ungkapnya.</p>
              - generic [ref=f8e2315]: <!-- /wp:paragraph -->
              - generic [ref=f8e2316]: <!-- wp:paragraph -->
              - generic [ref=f8e2317]: <p>Ustadz Dedi juga mengajak masyarakat untuk terus memperkuat pendidikan agama melalui majelis taklim sebagai benteng moral di tengah derasnya arus perubahan zaman.</p>
              - generic [ref=f8e2318]: <!-- /wp:paragraph -->
              - generic [ref=f8e2319]: <!-- wp:paragraph -->
              - generic [ref=f8e2320]: <p>"Saat ini masih banyak majelis taklim di Kota Depok yang perlu mendapat pembinaan agar semakin berkembang dan memberikan manfaat bagi masyarakat. Selain itu majelis taklim disarankan untuk mendaftar dan memiliki Surat Keterangan Terdaftar (SKT) diwilayahnya masing-masing," pungkasnya.</p>
              - generic [ref=f8e2321]: <!-- /wp:paragraph -->
              - generic [ref=f8e2322]: <!-- wp:paragraph -->
              - generic [ref=f8e2323]: <p>Rangkaian kegiatan berlangsung dalam suasana penuh keakraban dan kekeluargaan. Acara yang diawali dengan pembacaan tahlil dan tahmid oleh Ustadz Salwani, ditutup dengan doa bersama yang dipimpin Ustadz Syahruddin El Fikri, sebagai harapan agar MT. Balai Wartawan Kota Depok terus menjadi wadah yang mempererat ukhuwah, memperkuat nilai keislaman, serta memberikan kontribusi positif bagi masyarakat dan dunia jurnalistik. (**)</p>
