              - generic [ref=f8e412]: <!-- /wp:paragraph -->
              - generic [ref=f8e413]: <!-- wp:paragraph -->
              - generic [ref=f8e414]: <p>Ketua DPRD Kota Depok, Ade Supriyatna memberikan apresiasi atas terselenggaranya kegiatan Maulid Nabi dan santunan tersebut. Dirinya menyatakan dukungannya terhadap berbagai kegiatan positif yang dilakukan masyarakat, khususnya kegiatan yang mendorong penguatan nilai keagamaan dan kepedulian sosial.</p>
              - generic [ref=f8e415]: <!-- /wp:paragraph -->
              - generic [ref=f8e416]: <!-- wp:paragraph -->
              - generic [ref=f8e417]: <p>Ade juga mengajak seluruh elemen masyarakat bersama-sama menjaga Kota Depok dari berbagai bentuk kemaksiatan.</p>
              - generic [ref=f8e418]: <!-- /wp:paragraph -->
              - generic [ref=f8e419]: <!-- wp:paragraph -->
              - generic [ref=f8e420]: <p>"Jauhkan Depok dari kemaksiatan," pesannya.</p>
              - generic [ref=f8e421]: <!-- /wp:paragraph -->
              - generic [ref=f8e422]: <!-- wp:paragraph -->
              - generic [ref=f8e423]: <p>Dikatakan Ade, kegiatan keagamaan seperti Maulid Nabi yang dilaksanakan oleh Majelis Taklim Balai Wartawan Kota Depok dapat menjadi salah satu sarana memperkuat akhlak dan membangun lingkungan masyarakat yang lebih baik.</p>
              - generic [ref=f8e424]: <!-- /wp:paragraph -->
              - generic [ref=f8e425]: <!-- wp:paragraph -->
              - generic [ref=f8e426]: <p>"Apresiasi buat para wartawan yang tergabung di Majelis Taklim Balai Wartawan Kota Depok yang terus tanpa henti melakukan syiar kebaikan baik dalam tindakan maupun tulisan," katanya.</p>
              - generic [ref=f8e427]: <!-- /wp:paragraph -->
              - generic [ref=f8e428]: <!-- wp:paragraph -->
              - generic [ref=f8e429]: <p>Sementara itu, Ketua Majelis Taklim Balai Wartawan Kota Depok, Adie Rakasiwi mengatakan, majelis taklim menjadi salah satu wadah bagi keluarga wartawan untuk turut mengambil bagian dalam dakwah Islam.</p>
              - generic [ref=f8e430]: <!-- /wp:paragraph -->
              - generic [ref=f8e431]: <!-- wp:paragraph -->
              - generic [ref=f8e432]: <p>Menurutnya, profesi wartawan tidak hanya berkaitan dengan aktivitas jurnalistik. Wartawan juga dapat berkontribusi melalui kegiatan sosial dan keagamaan yang memberikan manfaat langsung kepada masyarakat.</p>
              - generic [ref=f8e433]: <!-- /wp:paragraph -->
              - generic [ref=f8e434]: <!-- wp:paragraph -->
              - generic [ref=f8e435]: <p>"Kami akan terus memperbaiki diri dan melakukan syiar dakwah yang positif," ujar Adie Rakasiwi.</p>
              - generic [ref=f8e436]: <!-- /wp:paragraph -->
              - generic [ref=f8e437]: <!-- wp:paragraph -->
              - generic [ref=f8e438]: <p>Ia menyampaikan terima kasih kepada seluruh jamaah yang hadir, Pemkot Kota Depok, Stakeholder serta para donatur, yang telah berpartisipasi mendukung terselenggaranya Maulid Nabi dan santunan tersebut.</p>
              - generic [ref=f8e439]: <!-- /wp:paragraph -->
              - generic [ref=f8e440]: <!-- wp:paragraph -->
              - generic [ref=f8e441]: <p>"Terima kasih untuk semuanya yang mensupport serta berpartisipasi pada kegiatan Maulid Nabi dan Santunan Anak Yatim serta Dhuafa sebanyak 68 orang yang disantuni," jelasnya.</p>
              - generic [ref=f8e442]: <!-- /wp:paragraph -->
              - generic [ref=f8e443]: <!-- wp:paragraph -->
              - generic [ref=f8e444]: <p>Sedangkan Kepala Dinas Komunikasi dan Informatika (Diskominfo) Kota Depok, Manto memberikan apresiasi terhadap kegiatan yang diselenggarakan Majelis Taklim Balai Wartawan Kota Depok, menurutnya, Pemerintah Kota Depok mendorong setiap lembaga untuk terus bersemangat dalam mensyiarkan dakwah Islam di tengah masyarakat.</p>
              - generic [ref=f8e445]: <!-- /wp:paragraph -->
              - generic [ref=f8e446]: <!-- wp:paragraph -->
              - generic [ref=f8e447]: <p>"Termasuk kalangan wartawan, memiliki ruang untuk ikut menyampaikan pesan-pesan kebaikan dan membangun masyarakat," katanya menyampaikan pesan dari Wali Kota Depok, Supian Suri.</p>
              - generic [ref=f8e448]: <!-- /wp:paragraph -->
              - generic [ref=f8e449]: <!-- wp:paragraph -->
              - generic [ref=f8e450]: <p>Manto juga menilai momentum Maulid Nabi dapat menjadi ruang untuk melakukan evaluasi diri sekaligus meningkatkan persatuan dan kebersamaan.</p>
              - generic [ref=f8e451]: <!-- /wp:paragraph -->
              - generic [ref=f8e452]: <!-- wp:paragraph -->
              - generic [ref=f8e453]: <p>"Mari kita jaga persatuan dan kebersamaan ditengah kemajemukan yang ada dengan terus menebar syiar kebaikan," terangnya.</p>
              - generic [ref=f8e454]: <!-- /wp:paragraph -->
              - generic [ref=f8e455]: <!-- wp:paragraph -->
              - generic [ref=f8e456]: <p>Penceramah KH. Fatkhuri Wahmad yang juga pengasuh Padepokan Islam Nusantara (PIN) Al Bahrain, Cipayung, mengingatkan jamaah, bahwa Nabi Muhammad SAW merupakan teladan utama bagi umat Islam.</p>
              - generic [ref=f8e457]: <!-- /wp:paragraph -->
              - generic [ref=f8e458]: <!-- wp:paragraph -->
              - generic [ref=f8e459]: <p>Ia mengajak jamaah untuk melakukan yang terbaik dalam kehidupan serta menjauhi perbuatan yang dapat membuat Rasulullah SAW malu terhadap perilaku umatnya.</p>
              - generic [ref=f8e460]: <!-- /wp:paragraph -->
              - generic [ref=f8e461]: <!-- wp:paragraph -->
              - generic [ref=f8e462]: <p>"Perbanyak shalawat Nabi dan jadilah umat terbaik," ucapnya.</p>
              - generic [ref=f8e463]: <!-- /wp:paragraph -->
              - generic [ref=f8e464]: <!-- wp:paragraph -->
              - generic [ref=f8e465]: <p>Ia menekankan, kecintaan kepada Rasulullah SAW tidak cukup hanya diungkapkan melalui peringatan Maulid. Kecintaan tersebut perlu diwujudkan dengan meneladani akhlak Nabi dalam kehidupan sehari-hari.</p>
              - generic [ref=f8e466]: <!-- /wp:paragraph -->
              - generic [ref=f8e467]: <!-- wp:paragraph -->
              - generic [ref=f8e468]: <p>"Kegiatan keagamaan seperti Maulid Nabi yang diadakan oleh Majelis Taklim Balai Wartawan Kota Depok dapat menjadi salah satu sarana memperkuat akhlak dan membangun lingkungan masyarakat yang lebih baik," pungkasnya.</p>
              - generic [ref=f8e469]: <!-- /wp:paragraph -->
              - generic [ref=f8e470]: <!-- wp:paragraph -->
              - generic [ref=f8e471]: <p>Melalui kegiatan tersebut, Majelis Taklim Balai Wartawan Kota Depok menegaskan komitmennya untuk menjadikan majelis taklim sebagai ruang silaturahmi, dakwah, dan kepedulian sosial.</p>
              - generic [ref=f8e472]: <!-- /wp:paragraph -->
              - generic [ref=f8e473]: <!-- wp:paragraph -->
              - generic [ref=f8e474]: <p>Semangat Maulid Nabi diharapkan tidak berhenti pada seremoni, tetapi berlanjut dalam kehidupan melalui keteladanan akhlak Rasulullah SAW, kepedulian terhadap sesama, dan upaya merajut persatuan. </p>
              - generic [ref=f8e475]: "<!-- /wp:paragraph -->\";s:14:\"featured_image\";s:100:\"https://margondatv.com/wp-content/uploads/2026/09/483cdd6b-9dc1-420a-a69e-7fb50209a88a-1024x768.jpeg\";s:10:\"meta_title\";s:65:\"TAK HANYA MENULIS BERITA WARTAWAN DEPOK GELAR MAULID DAN SANTUNAN\";s:16:\"meta_description\";s:0:\"\";s:11:\"schema_type\";s:7:\"Article\";s:6:\"status\";s:9:\"published\";s:12:\"published_at\";s:19:\"2026-09-25 00:00:00\";s:12:\"scheduled_at\";N;s:11:\"views_count\";i:58;s:9:\"read_time\";i:4;s:10:\"word_count\";i:637;s:11:\"ai_provider\";N;s:9:\"seo_score\";i:0;s:11:\"is_featured\";i:0;s:11:\"is_breaking\";i:0;s:11:\"is_headline\";i:0;s:4:\"tags\";N;s:8:\"location\";N;s:11:\"series_name\";N;s:12:\"series_order\";N;s:10:\"deleted_at\";N;s:10:\"created_at\";s:19:\"2026-10-02 07:07:11\";s:10:\"updated_at\";s:19:\"2026-10-05 08:38:08\";}s:10:\"*changes\";a:0:{}s:11:\"*previous\";a:0:{}s:8:\"*casts\";a:7:{s:12:\"published_at\";s:8:\"datetime\";s:12:\"scheduled_at\";s:8:\"datetime\";s:11:\"is_featured\";s:7:\"boolean\";s:9:\"read_time\";s:7:\"integer\";s:10:\"word_count\";s:7:\"integer\";s:9:\"seo_score\";s:7:\"integer\";s:10:\"deleted_at\";s:8:\"datetime\";}s:17:\"*classCastCache\";a:0:{}s:21:\"*attributeCastCache\";a:0:{}s:13:\"*dateFormat\";N;s:10:\"*appends\";a:4:{i:0;s:3:\"url\";i:1;s:5:\"image\";i:2;s:4:\"date\";i:3;s:6:\"author\";}s:19:\"*dispatchesEvents\";a:0:{}s:14:\"*observables\";a:0:{}s:12:\"*relations\";a:2:{s:8:\"category\";O:19:\"App\\Models\\Category\":33:{s:13:\"*connection\";s:5:\"mysql\";s:8:\"*table\";s:10:\"categories\";s:13:\"*primaryKey\";s:2:\"id\";s:10:\"*keyType\";s:3:\"int\";s:12:\"incrementing\";b:1;s:7:\"*with\";a:0:{}s:12:\"*withCount\";a:0:{}s:19:\"preventsLazyLoading\";b:0;s:10:\"*perPage\";i:15;s:6:\"exists\";b:1;s:18:\"wasRecentlyCreated\";b:0;s:28:\"*escapeWhenCastingToString\";b:0;s:13:\"*attributes\";a:3:{s:2:\"id\";i:27;s:4:\"name\";s:8:\"Warganet\";s:4:\"slug\";s:8:\"warganet\";}s:11:\"*original\";a:3:{s:2:\