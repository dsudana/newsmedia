ssword\";i:1;s:14:\"remember_token\";}s:10:\"*visible\";a:0:{}s:11:\"*fillable\";a:7:{i:0;s:4:\"name\";i:1;s:5:\"email\";i:2;s:8:\"password\";i:3;s:3:\"bio\";i:4;s:6:\"avatar\";i:5;s:12:\"social_links\";i:6;s:9:\"is_active\";}s:10:\"*guarded\";a:1:{i:0;s:1:\"*\";}s:19:\"*authPasswordName\";s:8:\"password\";s:20:\"*rememberTokenName\";s:14:\"remember_token\";}}s:10:\"*touches\";a:0:{}s:27:\"*relationAutoloadCallback\";N;s:26:\"*relationAutoloadContext\";N;s:10:\"timestamps\";b:1;s:13:\"usesUniqueIds\";b:0;s:9:\"*hidden\";a:0:{}s:10:\"*visible\";a:0:{}s:11:\"*fillable\";a:19:{i:0;s:7:\"user_id\";i:1;s:11:\"category_id\";i:2;s:5:\"title\";i:3;s:4:\"slug\";i:4;s:7:\"excerpt\";i:5;s:7:\"content\";i:6;s:14:\"featured_image\";i:7;s:10:\"meta_title\";i:8;s:16:\"meta_description\";i:9;s:11:\"schema_type\";i:10;s:6:\"status\";i:11;s:12:\"published_at\";i:12;s:12:\"scheduled_at\";i:13;s:11:\"views_count\";i:14;s:11:\"is_featured\";i:15;s:9:\"read_time\";i:16;s:10:\"word_count\";i:17;s:11:\"ai_provider\";i:18;s:9:\"seo_score\";}s:10:\"*guarded\";a:1:{i:0;s:1:\"*\";}s:16:\"*forceDeleting\";b:0;}i:1;O:18:\"App\\Models\\Article\":34:{s:13:\"*connection\";s:5:\"mysql\";s:8:\"*table\";s:8:\"articles\";s:13:\"*primaryKey\";s:2:\"id\";s:10:\"*keyType\";s:3:\"int\";s:12:\"incrementing\";b:1;s:7:\"*with\";a:0:{}s:12:\"*withCount\";a:0:{}s:19:\"preventsLazyLoading\";b:0;s:10:\"*perPage\";i:15;s:6:\"exists\";b:1;s:18:\"wasRecentlyCreated\";b:0;s:28:\"*escapeWhenCastingToString\";b:0;s:13:\"*attributes\";a:30:{s:2:\"id\";i:900;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:108:\"Tangis Pecah di TPU Mutiara, Syekh Iqbal Khan Turun Langsung ke Liang Lahat Antar Kepergian Menantu Tercinta\";s:4:\"slug\";s:107:\"tangis-pecah-di-tpu-mutiara-syekh-iqbal-khan-turun-langsung-ke-liang-lahat-antar-kepergian-menantu-tercinta\";s:7:\"excerpt\";s:249:\"Suasana haru menyelimuti prosesi pemakaman Almarhum Muhammad Nasir bin Mustafa, menantu dari Syekh Iqbal Khan (Wantim MUI / Dewan Mustasyar DMI Kota Depok) di TPU Mutiara Mampang, Pancoran Mas (Belakang Polsek Pancoran Mas), Sabtu 19 September 2026.\";s:7:\"content\";s:5214:\"<?xml encoding=\"UTF-8\"><!-- wp:image {\"id\":1161,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} --><!-- /wp:image --><!-- wp:paragraph --><p><em>DEPOK, <a href=\"http://MargondaTV.com\" target=\"_blank\" class=\"grabbit-linkified\" style=\"text-decoration: underline;\">http://MargondaTV.com</a> -</em> Suasana haru menyelimuti prosesi pemakaman <em>Almarhum Muhammad Nasir bin Mustafa</em>, menantu dari <em>Syekh Iqbal Khan (Wantim MUI / Dewan Mustasyar DMI Kota Depok)</em> di <em>TPU Mutiara Mampang, Pancoran Mas (Belakang Polsek Pancoran Mas)</em>, Sabtu 19 September 2026.</p>"
              - generic [ref=f8e476]: <!-- /wp:paragraph -->
              - generic [ref=f8e477]: <!-- wp:paragraph -->
              - generic [ref=f8e478]: <p>Almarhum yang wafat pada Sabtu, 19 September 2026 Pkl 13.30 WIB di RS Pulmonary Hospital Bogor, disholatkan terlebih dahulu di <em>Majelis Ta'lim Syekh Iqbal Khan, Jl. Dahlia No 07 Margonda Ba'da Dzuhur.</em></p>
              - generic [ref=f8e479]: <!-- /wp:paragraph -->
              - generic [ref=f8e480]: "<!-- wp:image {\"id\":1165,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e481]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/WhatsApp-Image-2026-09-23-at-08.53.28-1024x768.jpeg" alt="" class="wp-image-1165"></figure>
              - generic [ref=f8e482]: <!-- /wp:image -->
              - generic [ref=f8e483]: <!-- wp:paragraph -->
              - generic [ref=f8e484]: <p>Pantauan MargondaTV, jenazah disemayamkan di rumah duka Jl. Dahlia No 07 Margonda Samping Polres Depok dengan karangan bunga dari tokoh lokal dan internasional yang mengelilingi kediaman beliau.</p>
              - generic [ref=f8e485]: <!-- /wp:paragraph -->
              - generic [ref=f8e486]: <!-- wp:paragraph -->
              - generic [ref=f8e487]: <p>Prosesi Pemakaman:<br>Keranda hijau bertuliskan kalimat tauhid diusung putra-putra almarhum dan keluarga besar. Talqin dipimpin Habib Faiz Al Hadad di atas pusara yang telah ditaburi bunga mawar merah putih.</p>
              - generic [ref=f8e488]: <!-- /wp:paragraph -->
              - generic [ref=f8e489]: <!-- wp:paragraph -->
              - generic [ref=f8e490]: <p>Momen paling mengharukan, <em>Syekh Iqbal Khan sendiri turun langsung ke dalam liang lahat</em> untuk menata kepergian menantu tercinta, disaksikan ratusan pelayat yang mendoakan.</p>
              - generic [ref=f8e491]: <!-- /wp:paragraph -->
              - generic [ref=f8e492]: "<!-- wp:image {\"id\":1164,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e493]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/WhatsApp-Image-2026-09-22-at-20.49.49-1024x768.jpeg" alt="" class="wp-image-1164"></figure>
              - generic [ref=f8e494]: <!-- /wp:image -->
              - generic [ref=f8e495]: <!-- wp:paragraph -->
              - generic [ref=f8e496]: <p><em>Pernyataan Belasungkawa Ulama Kota Depok</em></p>
              - generic [ref=f8e497]: <!-- /wp:paragraph -->
              - generic [ref=f8e498]: <!-- wp:paragraph -->
              - generic [ref=f8e499]: <p><em>Dr. KH. Ahmad Dimyati Badruzzaman, MA - Pimpinan Ponpes Darush Sholihin Sawangan</em><br><em>(Statement di lokasi TPU Mutiara Mampang)</em></p>
              - generic [ref=f8e500]: <!-- /wp:paragraph -->
              - generic [ref=f8e501]: <!-- wp:paragraph -->
              - generic [ref=f8e502]: <p>Dalam wawancara eksklusif MargondaTV di area pemakaman, beliau menyampaikan duka mendalam atas wafatnya Almarhum Muhammad Nasir. Beliau mendoakan agar almarhum husnul khotimah dan keluarga besar Syekh Iqbal Khan diberi ketabahan.</p>
              - generic [ref=f8e503]: <!-- /wp:paragraph -->
              - generic [ref=f8e504]: <!-- wp:paragraph -->
              - generic [ref=f8e505]: <p>Satu per satu tokoh ulama Jabodetabek hadir memberikan penghormatan terakhir untuk Almarhum H. Muhammad Nasir bin Ghulam Mustafa, menantu Syekh Iqbal Khan.</p>
              - generic [ref=f8e506]: <!-- /wp:paragraph -->
              - generic [ref=f8e507]: <!-- wp:paragraph -->
              - generic [ref=f8e508]: <p>Setelah DR. KH. Ahmad Dimyati Badruzzaman (Ponpes Darush Sholihin Sawangan) dilanjutkan KH. Muhammad Syukur Yusuf (Majlis Az-Zikra Sentul Bogor),yang menyampaikan duka. "Innalillahi wa inna ilaihi raji'un. Kita semua milik Allah dan kembali kepada Allah. Insya Allah orang baik, Bang Haji Muhammad Nasir bin Ghulam Mustafa, putra menantu dari Syekh Iqbal telah kembali kepada Tuhan Yang Maha Baik. Insya Allah orang baik kembali kepada Yang Maha Baik untuk menikmati hasil dari kebaikannya di dunia. Allah rahmati, Allah ampuni, Allah sayangi, kuburnya jadi taman surga. Keluarga Syekh Iqbal dan seluruh keluarga besarnya diberikan ketabahan dan kesabaran."</p>
              - generic [ref=f8e509]: <!-- /wp:paragraph -->
              - generic [ref=f8e510]: <!-- wp:paragraph -->
              - generic [ref=f8e511]: <p>Statement ini disampaikan langsung di area TPU Mutiara Mampang usai pemakaman kepada tim MargondaTV.</p>
              - generic [ref=f8e512]: <!-- /wp:paragraph -->
              - generic [ref=f8e513]: <!-- wp:paragraph -->
              - generic [ref=f8e514]: <p>Tidak Ketinggalan KH. Ahmad Muslim Farid SQ - Pimp. Ponpes Tahfizh Binaul Ummah Depok menyampaikan Ungkapan Duka</p>
              - generic [ref=f8e515]: <!-- /wp:paragraph -->
              - generic [ref=f8e516]: <!-- wp:paragraph -->
              - generic [ref=f8e517]: <p>"Innalillahi wa inna ilaihi raji'un. Kami keluarga besar Pondok Pesantren Tahfizh Al-Qur'an Depok mengucapkan turut berduka cita yang sedalam-dalamnya atas wafatnya abangku fillah, abangku Haji Nasir. Semoga Allah ampuni seluruh dosa kesalahannya, Allah terima seluruh amal ibadahnya, dan Allah jadikan kuburnya taman-taman surganya. Ya Allah bahagiakan beliau sebagaimana bahagianya beliau saat ruku' sujud kepada-Mu, Ya Allah bahagiakan sebagaimana bahagianya beliau saat memenuhi undangan panggilan-Mu Ya Rabb." </p>
              - generic [ref=f8e518]: <!-- /wp:paragraph -->
              - generic [ref=f8e519]: <!-- wp:paragraph -->
              - generic [ref=f8e520]: <p>Prosesi dilanjutkan dengan doa bersama dan tabur bunga di atas pusara oleh keluarga, dipimpin langsung oleh Syekh Iqbal Khan</p>
              - generic [ref=f8e521]: <!-- /wp:paragraph -->
              - generic [ref=f8e522]: <!-- wp:paragraph -->
              - generic [ref=f8e523]: "<p>Segenap Redaksi <a href=\"http://MargondaTV.com\" target=\"_blank\" class=\"grabbit-linkified\" style=\"text-decoration: underline;\">http://MargondaTV.com</a> turut berduka cita.</p>"
              - generic [ref=f8e524]: <!-- /wp:paragraph -->
              - generic [ref=f8e525]: <!-- wp:paragraph -->
              - generic [ref=f8e526]: "<p><em>Laporan: Tim MargondaTV</em> Bang Monank<br><em>Lokasi: TPU Mutiara Mampang &amp; Rumah Duka Jl Dahlia Margonda</em></p>"
              - generic [ref=f8e527]: "<!-- /wp:paragraph -->\";s:14:\"featured_image\";s:101:\"https://margondatv.com/wp-content/uploads/2026/09/WhatsApp-Image-2026-09-23-at-08.53.28-1024x768.jpeg\";s:10:\"meta_title\";s:108:\"Tangis Pecah di TPU Mutiara, Syekh Iqbal Khan Turun Langsung ke Liang Lahat Antar Kepergian Menantu Tercinta\";s:16:\"meta_description\";s:0:\"\";s:11:\"schema_type\";s:7:\"Article\";s:6:\"status\";s:9:\"published\";s:12:\"published_at\";s:19:\"2026-09-23 00:00:00\";s:12:\"scheduled_at\";N;s:11:\"views_count\";i:65;s:9:\"read_time\";i:1;s:10:\"word_count\";i:0;s:11:\"ai_provider\";N;s:9:\"seo_score\";i:0;s:11:\"is_featured\";i:0;s:11:\"is_breaking\";i:0;s:11:\"is_headline\";i:0;s:4:\"tags\";N;s:8:\"location\";N;s:11:\"series_name\";N;s:12:\"series_order\";N;s:10:\"deleted_at\";N;s:10:\"created_at\";s:19:\"2026-10-02 07:07:10\";s:10:\"updated_at\";s:19:\"2026-10-05 09:00:33\";}s:11:\"*original\";a:30:{s:2:\"id\";i:900;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:108:\"Tangis Pecah di TPU Mutiara, Syekh Iqbal Khan Turun Langsung ke Liang Lahat Antar Kepergian Menantu Tercinta\";s:4:\"slug\";s:107:\"tangis-pecah-di-tpu-mutiara-syekh-iqbal-khan-turun-langsung-ke-liang-lahat-antar-kepergian-menantu-tercinta\";s:7:\"excerpt\";s:249:\"Suasana haru menyelimuti prosesi pemakaman Almarhum Muhammad Nasir bin Mustafa, menantu dari Syekh Iqbal Khan (Wantim MUI / Dewan Mustasyar DMI Kota Depok) di TPU Mutiara Mampang, Pancoran Mas (Belakang Polsek Pancoran Mas), Sabtu 19 September 2026.\";s:7:\"content\";s:5214:\"<?xml encoding=\"UTF-8\"><!-- wp:image {\"id\":1161,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} --><!-- /wp:image --><!-- wp:paragraph --><p><em>DEPOK, <a href=\"http://MargondaTV.com\" target=\"_blank\" class=\"grabbit-linkified\" style=\"text-decoration: underline;\">http://MargondaTV.com</a> -</em> Suasana haru menyelimuti prosesi pemakaman <em>Almarhum Muhammad Nasir bin Mustafa</em>, menantu dari <em>Syekh Iqbal Khan (Wantim MUI / Dewan Mustasyar DMI Kota Depok)</em> di <em>TPU Mutiara Mampang, Pancoran Mas (Belakang Polsek Pancoran Mas)</em>, Sabtu 19 September 2026.</p>"
              - generic [ref=f8e528]: <!-- /wp:paragraph -->
              - generic [ref=f8e529]: <!-- wp:paragraph -->
              - generic [ref=f8e530]: <p>Almarhum yang wafat pada Sabtu, 19 September 2026 Pkl 13.30 WIB di RS Pulmonary Hospital Bogor, disholatkan terlebih dahulu di <em>Majelis Ta'lim Syekh Iqbal Khan, Jl. Dahlia No 07 Margonda Ba'da Dzuhur.</em></p>
              - generic [ref=f8e531]: <!-- /wp:paragraph -->
              - generic [ref=f8e532]: "<!-- wp:image {\"id\":1165,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e533]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/WhatsApp-Image-2026-09-23-at-08.53.28-1024x768.jpeg" alt="" class="wp-image-1165"></figure>
              - generic [ref=f8e534]: <!-- /wp:image -->
              - generic [ref=f8e535]: <!-- wp:paragraph -->
              - generic [ref=f8e536]: <p>Pantauan MargondaTV, jenazah disemayamkan di rumah duka Jl. Dahlia No 07 Margonda Samping Polres Depok dengan karangan bunga dari tokoh lokal dan internasional yang mengelilingi kediaman beliau.</p>
              - generic [ref=f8e537]: <!-- /wp:paragraph -->
              - generic [ref=f8e538]: <!-- wp:paragraph -->
              - generic [ref=f8e539]: <p>Prosesi Pemakaman:<br>Keranda hijau bertuliskan kalimat tauhid diusung putra-putra almarhum dan keluarga besar. Talqin dipimpin Habib Faiz Al Hadad di atas pusara yang telah ditaburi bunga mawar merah putih.</p>
              - generic [ref=f8e540]: <!-- /wp:paragraph -->
              - generic [ref=f8e541]: <!-- wp:paragraph -->
              - generic [ref=f8e542]: <p>Momen paling mengharukan, <em>Syekh Iqbal Khan sendiri turun langsung ke dalam liang lahat</em> untuk menata kepergian menantu tercinta, disaksikan ratusan pelayat yang mendoakan.</p>
              - generic [ref=f8e543]: <!-- /wp:paragraph -->
              - generic [ref=f8e544]: "<!-- wp:image {\"id\":1164,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e545]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/WhatsApp-Image-2026-09-22-at-20.49.49-1024x768.jpeg" alt="" class="wp-image-1164"></figure>
              - generic [ref=f8e546]: <!-- /wp:image -->
              - generic [ref=f8e547]: <!-- wp:paragraph -->
              - generic [ref=f8e548]: <p><em>Pernyataan Belasungkawa Ulama Kota Depok</em></p>
              - generic [ref=f8e549]: <!-- /wp:paragraph -->
              - generic [ref=f8e550]: <!-- wp:paragraph -->
              - generic [ref=f8e551]: <p><em>Dr. KH. Ahmad Dimyati Badruzzaman, MA - Pimpinan Ponpes Darush Sholihin Sawangan</em><br><em>(Statement di lokasi TPU Mutiara Mampang)</em></p>
              - generic [ref=f8e552]: <!-- /wp:paragraph -->
              - generic [ref=f8e553]: <!-- wp:paragraph -->
              - generic [ref=f8e554]: <p>Dalam wawancara eksklusif MargondaTV di area pemakaman, beliau menyampaikan duka mendalam atas wafatnya Almarhum Muhammad Nasir. Beliau mendoakan agar almarhum husnul khotimah dan keluarga besar Syekh Iqbal Khan diberi ketabahan.</p>
              - generic [ref=f8e555]: <!-- /wp:paragraph -->
              - generic [ref=f8e556]: <!-- wp:paragraph -->
              - generic [ref=f8e557]: <p>Satu per satu tokoh ulama Jabodetabek hadir memberikan penghormatan terakhir untuk Almarhum H. Muhammad Nasir bin Ghulam Mustafa, menantu Syekh Iqbal Khan.</p>
              - generic [ref=f8e558]: <!-- /wp:paragraph -->
              - generic [ref=f8e559]: <!-- wp:paragraph -->
              - generic [ref=f8e560]: <p>Setelah DR. KH. Ahmad Dimyati Badruzzaman (Ponpes Darush Sholihin Sawangan) dilanjutkan KH. Muhammad Syukur Yusuf (Majlis Az-Zikra Sentul Bogor),yang menyampaikan duka. "Innalillahi wa inna ilaihi raji'un. Kita semua milik Allah dan kembali kepada Allah. Insya Allah orang baik, Bang Haji Muhammad Nasir bin Ghulam Mustafa, putra menantu dari Syekh Iqbal telah kembali kepada Tuhan Yang Maha Baik. Insya Allah orang baik kembali kepada Yang Maha Baik untuk menikmati hasil dari kebaikannya di dunia. Allah rahmati, Allah ampuni, Allah sayangi, kuburnya jadi taman surga. Keluarga Syekh Iqbal dan seluruh keluarga besarnya diberikan ketabahan dan kesabaran."</p>
              - generic [ref=f8e561]: <!-- /wp:paragraph -->
              - generic [ref=f8e562]: <!-- wp:paragraph -->
              - generic [ref=f8e563]: <p>Statement ini disampaikan langsung di area TPU Mutiara Mampang usai pemakaman kepada tim MargondaTV.</p>
              - generic [ref=f8e564]: <!-- /wp:paragraph -->
              - generic [ref=f8e565]: <!-- wp:paragraph -->
              - generic [ref=f8e566]: <p>Tidak Ketinggalan KH. Ahmad Muslim Farid SQ - Pimp. Ponpes Tahfizh Binaul Ummah Depok menyampaikan Ungkapan Duka</p>
              - generic [ref=f8e567]: <!-- /wp:paragraph -->
              - generic [ref=f8e568]: <!-- wp:paragraph -->
              - generic [ref=f8e569]: <p>"Innalillahi wa inna ilaihi raji'un. Kami keluarga besar Pondok Pesantren Tahfizh Al-Qur'an Depok mengucapkan turut berduka cita yang sedalam-dalamnya atas wafatnya abangku fillah, abangku Haji Nasir. Semoga Allah ampuni seluruh dosa kesalahannya, Allah terima seluruh amal ibadahnya, dan Allah jadikan kuburnya taman-taman surganya. Ya Allah bahagiakan beliau sebagaimana bahagianya beliau saat ruku' sujud kepada-Mu, Ya Allah bahagiakan sebagaimana bahagianya beliau saat memenuhi undangan panggilan-Mu Ya Rabb." </p>
              - generic [ref=f8e570]: <!-- /wp:paragraph -->
              - generic [ref=f8e571]: <!-- wp:paragraph -->
              - generic [ref=f8e572]: <p>Prosesi dilanjutkan dengan doa bersama dan tabur bunga di atas pusara oleh keluarga, dipimpin langsung oleh Syekh Iqbal Khan</p>
              - generic [ref=f8e573]: <!-- /wp:paragraph -->
              - generic [ref=f8e574]: <!-- wp:paragraph -->
              - generic [ref=f8e575]: "<p>Segenap Redaksi <a href=\"http://MargondaTV.com\" target=\"_blank\" class=\"grabbit-linkified\" style=\"text-decoration: underline;\">http://MargondaTV.com</a> turut berduka cita.</p>"
