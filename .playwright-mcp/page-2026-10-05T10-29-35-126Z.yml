;s:6:\"status\";i:11;s:12:\"published_at\";i:12;s:12:\"scheduled_at\";i:13;s:11:\"views_count\";i:14;s:11:\"is_featured\";i:15;s:9:\"read_time\";i:16;s:10:\"word_count\";i:17;s:11:\"ai_provider\";i:18;s:9:\"seo_score\";}s:10:\"*guarded\";a:1:{i:0;s:1:\"*\";}s:16:\"*forceDeleting\";b:0;}i:2;O:18:\"App\\Models\\Article\":34:{s:13:\"*connection\";s:5:\"mysql\";s:8:\"*table\";s:8:\"articles\";s:13:\"*primaryKey\";s:2:\"id\";s:10:\"*keyType\";s:3:\"int\";s:12:\"incrementing\";b:1;s:7:\"*with\";a:0:{}s:12:\"*withCount\";a:0:{}s:19:\"preventsLazyLoading\";b:0;s:10:\"*perPage\";i:15;s:6:\"exists\";b:1;s:18:\"wasRecentlyCreated\";b:0;s:28:\"*escapeWhenCastingToString\";b:0;s:13:\"*attributes\";a:30:{s:2:\"id\";i:899;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:80:\"LAHIRKAN KADER MUFASSIR MODERN, TAKHASUS TAFSIR PKU MUI KOTA DEPOK RESMI DITUTUP\";s:4:\"slug\";s:79:\"lahirkan-kader-mufassir-modern-takhasus-tafsir-pku-mui-kota-depok-resmi-ditutup\";s:7:\"excerpt\";s:273:\"Rangkaian Program *Takhassus Tafsir dan Ilmu Tafsir Pendidikan Kader Ulama MUI Kota Depok* resmi ditutup pada Kamis, 17 September 2026 di Gedung Dakwah MUI Kota Depok. Kegiatan yang disiarkan langsung di Channel YouTube MUI Depok TV ini berlangsung khidmat dan penuh makna.\";s:7:\"content\";s:5036:\"<?xml encoding=\"UTF-8\"><!-- wp:image {\"id\":1151,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} --><figure class=\"wp-block-image size-large\"><img src=\"https://margondatv.com/wp-content/uploads/2026/09/IMG_5047-1024x768.jpeg\" alt=\"\" class=\"wp-image-1151\"></figure>"
              - generic [ref=f8e580]: <!-- /wp:image -->
              - generic [ref=f8e581]: <!-- wp:paragraph -->
              - generic [ref=f8e582]: <p>Rangkaian Program *Takhassus Tafsir dan Ilmu Tafsir Pendidikan Kader Ulama MUI Kota Depok* resmi ditutup pada <em>Kamis, 17 September 2026</em> di <em>Gedung Dakwah MUI Kota Depok</em>. Kegiatan yang disiarkan langsung di Channel YouTube <em>MUI Depok TV</em> ini berlangsung khidmat dan penuh makna.</p>
              - generic [ref=f8e583]: <!-- /wp:paragraph -->
              - generic [ref=f8e584]: <!-- wp:paragraph -->
              - generic [ref=f8e585]: <p>Penutupan ini menjadi puncak dari 4 hari intensif kajian tafsir bersama para pakar nasional dan internasional.</p>
              - generic [ref=f8e586]: <!-- /wp:paragraph -->
              - generic [ref=f8e587]: <!-- wp:paragraph -->
              - generic [ref=f8e588]: <p><em>Rangkaian Sesi Penutupan Kamis, 17 September 2026</em></p>
              - generic [ref=f8e589]: <!-- /wp:paragraph -->
              - generic [ref=f8e590]: <!-- wp:paragraph -->
              - generic [ref=f8e591]: <p><em>1. Sesi Pagi - Kontribusi Ulama Nusantara</em><br><em>Narasumber:</em> <em>Dr. KH. Mohamad Ulin Nuha</em> Dekan Fakultas Ushuluddin IIQ Jakarta<br><em>Pendamping:</em> <em>KH. Arif Rahman Hakim</em> Komisi PKU MUI Depok<br><em>Tema:</em> <em>Kontribusi Ulama Tafsir Nusantara; Ma&rsquo;alim wa Namadhij</em></p>
              - generic [ref=f8e592]: <!-- /wp:paragraph -->
              - generic [ref=f8e593]: "<!-- wp:image {\"id\":1152,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e594]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_5020-1024x768.jpeg" alt="" class="wp-image-1152"></figure>
              - generic [ref=f8e595]: <!-- /wp:image -->
              - generic [ref=f8e596]: <!-- wp:paragraph -->
              - generic [ref=f8e597]: <p>Membedah karya dan kontribusi monumental mufassir Nusantara seperti Syaikh Mahfudz al-Tarmasi, Buya Hamka, Prof. Quraish Shihab, KH. Bisri Mustofa, dan lainnya. Menganalisis karakteristik, corak lokalitas, serta pengaruh sosio-politik karya tafsir Nusantara dalam mengawal dinamika kebangsaan dan keislaman di Indonesia.</p>
              - generic [ref=f8e598]: <!-- /wp:paragraph -->
              - generic [ref=f8e599]: <!-- wp:paragraph -->
              - generic [ref=f8e600]: <p><em>2. Sesi Mudzakarah Artikel Ilmiah</em><br><em>Narasumber:</em> <em>Dr. KH. Nurwahidin, MA</em><br><em>Pendamping:</em> <em>KH. Ahmad Sahal</em> PKU MUI Depok<br><em>Tema:</em> <em>Mudzakarah dan Persiapan Menulis Artikel</em></p>
              - generic [ref=f8e601]: <!-- /wp:paragraph -->
              - generic [ref=f8e602]: <!-- wp:paragraph -->
              - generic [ref=f8e603]: <p>Sesi pembekalan intensif untuk penulisan karya ilmiah tafsir sebagai luaran utama dari program Takhassus ini.</p>
              - generic [ref=f8e604]: <!-- /wp:paragraph -->
              - generic [ref=f8e605]: "<!-- wp:image {\"id\":1153,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e606]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_5024-1024x768.jpeg" alt="" class="wp-image-1153"></figure>
              - generic [ref=f8e607]: <!-- /wp:image -->
              - generic [ref=f8e608]: <!-- wp:paragraph -->
              - generic [ref=f8e609]: <p><em>3. Sesi Siang - Tafsir Fiqhi</em><br><em>Narasumber:</em> <em>Dr. KH. M. Shofin Sugito</em> didampingi Novery Dwi<br>Rachmat, S.Pd selaku ketua PKU X MUI Kota Depok<br><em>Tema:</em> <em>Al-Tafsir al-Fiqhi (Tafsir Hukum)</em></p>
              - generic [ref=f8e610]: <!-- /wp:paragraph -->
              - generic [ref=f8e611]: <!-- wp:paragraph -->
              - generic [ref=f8e612]: <p>Kajian metodologis Ayat al-Ahkam. Menganalisis bagaimana para fuqaha lintas madzhab Hanafi, Maliki, Syafi'i, Hanbali melakukan istinbath hukum dari Al-Qur'an serta objektivitas penafsirannya dalam konteks kekinian.</p>
              - generic [ref=f8e613]: <!-- /wp:paragraph -->
              - generic [ref=f8e614]: "<!-- wp:image {\"id\":1154,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e615]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_5028-1024x768.jpeg" alt="" class="wp-image-1154"></figure>
              - generic [ref=f8e616]: <!-- /wp:image -->
              - generic [ref=f8e617]: <!-- wp:paragraph -->
              - generic [ref=f8e618]: <p><em>4. Sidang Karya &amp; Penutupan Resmi</em><br><em>Narasumber:</em> <em>Dr. KH. Achmad Solechan, M.Si</em> Ketua MUI Kota Depok<br><em>Pendamping:</em> <em>Drs. H. Yayat Ruhiat, MM</em> Sekretaris MUI Kota Depok<br><em>Tema:</em> <em>Sidang Karya, Rencana Tindak Lanjut &amp; Penutupan</em></p>
              - generic [ref=f8e619]: <!-- /wp:paragraph -->
              - generic [ref=f8e620]: "<!-- wp:image {\"id\":1155,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e621]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_5034-1024x768.jpeg" alt="" class="wp-image-1155"></figure>
              - generic [ref=f8e622]: <!-- /wp:image -->
              - generic [ref=f8e623]: <!-- wp:paragraph -->
              - generic [ref=f8e624]: <p>Pada sesi penutupan, peserta mempresentasikan ringkas draf artikel tafsir maudhu'i yang disusun secara mandiri. Dilanjutkan dengan perumusan Rencana Tindak Lanjut (RTL) aksi dakwah melalui tulisan dan mimbar, post-test, evaluasi program, dan prosesi kelulusan resmi peserta Takhassus Tafsir.<br>Rangkaian Acara ini Ditutup oleh KH. Syihabuddin Ahmad selaku Ketua Umum MUI Kota Depok yang Didampingi Pengurus Harian lainnya<br>Dengan ditutupnya program ini, MUI Kota Depok berharap para alumni Takhassus Tafsir PKU mampu menjadi kader ulama yang ahli di bidang tafsir, produktif menulis, dan siap menjadi rujukan umat dalam memahami Al-Qur'an secara moderat, komprehensif, dan kontekstual.</p>
              - generic [ref=f8e625]: <!-- /wp:paragraph -->
              - generic [ref=f8e626]: <!-- wp:paragraph -->
              - generic [ref=f8e627]: <p>Seluruh rangkaian kegiatan Takhassus Tafsir PKU MUI Kota Depok selama 4 hari (14-17 September 2026) dapat disaksikan ulang di YouTube MUI Depok TV.</p>
              - generic [ref=f8e628]: "<!-- /wp:paragraph -->\";s:14:\"featured_image\";s:72:\"https://margondatv.com/wp-content/uploads/2026/09/IMG_5047-1024x768.jpeg\";s:10:\"meta_title\";s:80:\"LAHIRKAN KADER MUFASSIR MODERN, TAKHASUS TAFSIR PKU MUI KOTA DEPOK RESMI DITUTUP\";s:16:\"meta_description\";s:0:\"\";s:11:\"schema_type\";s:7:\"Article\";s:6:\"status\";s:9:\"published\";s:12:\"published_at\";s:19:\"2026-09-17 00:00:00\";s:12:\"scheduled_at\";N;s:11:\"views_count\";i:7;s:9:\"read_time\";i:1;s:10:\"word_count\";i:0;s:11:\"ai_provider\";N;s:9:\"seo_score\";i:0;s:11:\"is_featured\";i:0;s:11:\"is_breaking\";i:0;s:11:\"is_headline\";i:0;s:4:\"tags\";N;s:8:\"location\";N;s:11:\"series_name\";N;s:12:\"series_order\";N;s:10:\"deleted_at\";N;s:10:\"created_at\";s:19:\"2026-10-02 07:07:09\";s:10:\"updated_at\";s:19:\"2026-10-05 05:29:17\";}s:11:\"*original\";a:30:{s:2:\"id\";i:899;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:80:\"LAHIRKAN KADER MUFASSIR MODERN, TAKHASUS TAFSIR PKU MUI KOTA DEPOK RESMI DITUTUP\";s:4:\"slug\";s:79:\"lahirkan-kader-mufassir-modern-takhasus-tafsir-pku-mui-kota-depok-resmi-ditutup\";s:7:\"excerpt\";s:273:\"Rangkaian Program *Takhassus Tafsir dan Ilmu Tafsir Pendidikan Kader Ulama MUI Kota Depok* resmi ditutup pada Kamis, 17 September 2026 di Gedung Dakwah MUI Kota Depok. Kegiatan yang disiarkan langsung di Channel YouTube MUI Depok TV ini berlangsung khidmat dan penuh makna.\";s:7:\"content\";s:5036:\"<?xml encoding=\"UTF-8\"><!-- wp:image {\"id\":1151,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} --><figure class=\"wp-block-image size-large\"><img src=\"https://margondatv.com/wp-content/uploads/2026/09/IMG_5047-1024x768.jpeg\" alt=\"\" class=\"wp-image-1151\"></figure>"
              - generic [ref=f8e629]: <!-- /wp:image -->
              - generic [ref=f8e630]: <!-- wp:paragraph -->
              - generic [ref=f8e631]: <p>Rangkaian Program *Takhassus Tafsir dan Ilmu Tafsir Pendidikan Kader Ulama MUI Kota Depok* resmi ditutup pada <em>Kamis, 17 September 2026</em> di <em>Gedung Dakwah MUI Kota Depok</em>. Kegiatan yang disiarkan langsung di Channel YouTube <em>MUI Depok TV</em> ini berlangsung khidmat dan penuh makna.</p>
              - generic [ref=f8e632]: <!-- /wp:paragraph -->
              - generic [ref=f8e633]: <!-- wp:paragraph -->
              - generic [ref=f8e634]: <p>Penutupan ini menjadi puncak dari 4 hari intensif kajian tafsir bersama para pakar nasional dan internasional.</p>
              - generic [ref=f8e635]: <!-- /wp:paragraph -->
              - generic [ref=f8e636]: <!-- wp:paragraph -->
              - generic [ref=f8e637]: <p><em>Rangkaian Sesi Penutupan Kamis, 17 September 2026</em></p>
              - generic [ref=f8e638]: <!-- /wp:paragraph -->
              - generic [ref=f8e639]: <!-- wp:paragraph -->
              - generic [ref=f8e640]: <p><em>1. Sesi Pagi - Kontribusi Ulama Nusantara</em><br><em>Narasumber:</em> <em>Dr. KH. Mohamad Ulin Nuha</em> Dekan Fakultas Ushuluddin IIQ Jakarta<br><em>Pendamping:</em> <em>KH. Arif Rahman Hakim</em> Komisi PKU MUI Depok<br><em>Tema:</em> <em>Kontribusi Ulama Tafsir Nusantara; Ma&rsquo;alim wa Namadhij</em></p>
              - generic [ref=f8e641]: <!-- /wp:paragraph -->
              - generic [ref=f8e642]: "<!-- wp:image {\"id\":1152,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e643]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_5020-1024x768.jpeg" alt="" class="wp-image-1152"></figure>
              - generic [ref=f8e644]: <!-- /wp:image -->
              - generic [ref=f8e645]: <!-- wp:paragraph -->
              - generic [ref=f8e646]: <p>Membedah karya dan kontribusi monumental mufassir Nusantara seperti Syaikh Mahfudz al-Tarmasi, Buya Hamka, Prof. Quraish Shihab, KH. Bisri Mustofa, dan lainnya. Menganalisis karakteristik, corak lokalitas, serta pengaruh sosio-politik karya tafsir Nusantara dalam mengawal dinamika kebangsaan dan keislaman di Indonesia.</p>
              - generic [ref=f8e647]: <!-- /wp:paragraph -->
              - generic [ref=f8e648]: <!-- wp:paragraph -->
              - generic [ref=f8e649]: <p><em>2. Sesi Mudzakarah Artikel Ilmiah</em><br><em>Narasumber:</em> <em>Dr. KH. Nurwahidin, MA</em><br><em>Pendamping:</em> <em>KH. Ahmad Sahal</em> PKU MUI Depok<br><em>Tema:</em> <em>Mudzakarah dan Persiapan Menulis Artikel</em></p>
              - generic [ref=f8e650]: <!-- /wp:paragraph -->
              - generic [ref=f8e651]: <!-- wp:paragraph -->
              - generic [ref=f8e652]: <p>Sesi pembekalan intensif untuk penulisan karya ilmiah tafsir sebagai luaran utama dari program Takhassus ini.</p>
              - generic [ref=f8e653]: <!-- /wp:paragraph -->
              - generic [ref=f8e654]: "<!-- wp:image {\"id\":1153,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e655]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_5024-1024x768.jpeg" alt="" class="wp-image-1153"></figure>
              - generic [ref=f8e656]: <!-- /wp:image -->
              - generic [ref=f8e657]: <!-- wp:paragraph -->
              - generic [ref=f8e658]: <p><em>3. Sesi Siang - Tafsir Fiqhi</em><br><em>Narasumber:</em> <em>Dr. KH. M. Shofin Sugito</em> didampingi Novery Dwi<br>Rachmat, S.Pd selaku ketua PKU X MUI Kota Depok<br><em>Tema:</em> <em>Al-Tafsir al-Fiqhi (Tafsir Hukum)</em></p>
              - generic [ref=f8e659]: <!-- /wp:paragraph -->
              - generic [ref=f8e660]: <!-- wp:paragraph -->
              - generic [ref=f8e661]: <p>Kajian metodologis Ayat al-Ahkam. Menganalisis bagaimana para fuqaha lintas madzhab Hanafi, Maliki, Syafi'i, Hanbali melakukan istinbath hukum dari Al-Qur'an serta objektivitas penafsirannya dalam konteks kekinian.</p>
              - generic [ref=f8e662]: <!-- /wp:paragraph -->
              - generic [ref=f8e663]: "<!-- wp:image {\"id\":1154,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e664]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_5028-1024x768.jpeg" alt="" class="wp-image-1154"></figure>
              - generic [ref=f8e665]: <!-- /wp:image -->
              - generic [ref=f8e666]: <!-- wp:paragraph -->
              - generic [ref=f8e667]: <p><em>4. Sidang Karya &amp; Penutupan Resmi</em><br><em>Narasumber:</em> <em>Dr. KH. Achmad Solechan, M.Si</em> Ketua MUI Kota Depok<br><em>Pendamping:</em> <em>Drs. H. Yayat Ruhiat, MM</em> Sekretaris MUI Kota Depok<br><em>Tema:</em> <em>Sidang Karya, Rencana Tindak Lanjut &amp; Penutupan</em></p>
              - generic [ref=f8e668]: <!-- /wp:paragraph -->
              - generic [ref=f8e669]: "<!-- wp:image {\"id\":1155,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e670]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_5034-1024x768.jpeg" alt="" class="wp-image-1155"></figure>
              - generic [ref=f8e671]: <!-- /wp:image -->
              - generic [ref=f8e672]: <!-- wp:paragraph -->
              - generic [ref=f8e673]: <p>Pada sesi penutupan, peserta mempresentasikan ringkas draf artikel tafsir maudhu'i yang disusun secara mandiri. Dilanjutkan dengan perumusan Rencana Tindak Lanjut (RTL) aksi dakwah melalui tulisan dan mimbar, post-test, evaluasi program, dan prosesi kelulusan resmi peserta Takhassus Tafsir.<br>Rangkaian Acara ini Ditutup oleh KH. Syihabuddin Ahmad selaku Ketua Umum MUI Kota Depok yang Didampingi Pengurus Harian lainnya<br>Dengan ditutupnya program ini, MUI Kota Depok berharap para alumni Takhassus Tafsir PKU mampu menjadi kader ulama yang ahli di bidang tafsir, produktif menulis, dan siap menjadi rujukan umat dalam memahami Al-Qur'an secara moderat, komprehensif, dan kontekstual.</p>
              - generic [ref=f8e674]: <!-- /wp:paragraph -->
              - generic [ref=f8e675]: <!-- wp:paragraph -->
              - generic [ref=f8e676]: <p>Seluruh rangkaian kegiatan Takhassus Tafsir PKU MUI Kota Depok selama 4 hari (14-17 September 2026) dapat disaksikan ulang di YouTube MUI Depok TV.</p>
