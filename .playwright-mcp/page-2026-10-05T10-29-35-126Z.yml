              - generic [ref=f8e1334]: "<!-- wp:image {\"id\":1112,\"sizeSlug\":\"full\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e1335]: <figure class="wp-block-image size-full"><img src="https://margondatv.com/wp-content/uploads/2026/08/29f1f783-2d6d-4db3-ba6c-1ca1837e10a5.jpeg" alt="" class="wp-image-1112"/></figure>
              - generic [ref=f8e1336]: "<!-- /wp:image -->\";s:14:\"featured_image\";s:102:\"articles/kolaborasi-ulama-wartawan-dan-pemerintah-warnai-maulid-pin-al-bahrain-cipayung-1790924824.jpg\";s:10:\"meta_title\";s:79:\"Kolaborasi Ulama, Wartawan dan Pemerintah Warnai Maulid PIN Al Bahrain Cipayung\";s:16:\"meta_description\";s:0:\"\";s:11:\"schema_type\";s:7:\"Article\";s:6:\"status\";s:9:\"published\";s:12:\"published_at\";s:19:\"2026-08-26 07:43:33\";s:12:\"scheduled_at\";N;s:11:\"views_count\";i:3;s:9:\"read_time\";i:4;s:10:\"word_count\";i:779;s:11:\"ai_provider\";N;s:9:\"seo_score\";i:0;s:11:\"is_featured\";i:0;s:11:\"is_breaking\";i:0;s:11:\"is_headline\";i:0;s:4:\"tags\";N;s:8:\"location\";N;s:11:\"series_name\";N;s:12:\"series_order\";N;s:10:\"deleted_at\";N;s:10:\"created_at\";s:19:\"2026-10-02 07:07:04\";s:10:\"updated_at\";s:19:\"2026-10-05 09:26:43\";}s:11:\"*original\";a:30:{s:2:\"id\";i:892;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:79:\"Kolaborasi Ulama, Wartawan dan Pemerintah Warnai Maulid PIN Al Bahrain Cipayung\";s:4:\"slug\";s:78:\"kolaborasi-ulama-wartawan-dan-pemerintah-warnai-maulid-pin-al-bahrain-cipayung\";s:7:\"excerpt\";s:0:\"\";s:7:\"content\";s:7486:\"<!-- wp:paragraph -->"
              - generic [ref=f8e1337]: <p>DEBAR.COM.-PONDOKJAYA, DEPOK- Padepokan Islam Nusantara (PIN) Al-Bahrain&nbsp;Kota Depok menggelar Peringatan Maulid Nabi Muhammad SAW 1448 Hijirah yang mengangkat tema 'Meneladani Akhlak Rasulullah, Mewujudkan Pribadi Penuh Cinta dan Manfaat' berlangsung di Markaz PIN Al Bahrain Jl. KH. Abdurahman No.15 RT001/001 Kelurahan Pondok Jaya, Kecamatan Cipayung, Depok, Selasa (25/08/2026) malam.</p>
              - generic [ref=f8e1338]: <!-- /wp:paragraph -->
              - generic [ref=f8e1339]: <!-- wp:paragraph -->
              - generic [ref=f8e1340]: <p>Kegiatan yang menjadi momentum untuk memperkuat kecintaan kepada Rasulullah SAW sekaligus mempererat tali silaturahmi antarjemaah dan masyarakat dihadiri Pengasuh Markaz PIN Al Bahrain, KH. Fatkhuri Wahmad. MA, H. Bibit Hariyadi (Anugerah Jaya Mandiri), Penanggungjawab Acara, H. Erik Saputra Slamet, KH. Ahmad Buchori (Mbah Mad), KH. Bahrudin Toyib, KH. Harir, KH. Ahmad Furqon, KH. Nurcholis, KH. Samwari, KH. Raden Salamun, KH. Rais, KH. Abd. Mujib, Camat Cipayung, Muhammad Fahmi, Lurah Cipayung Jaya, Marbawi, Sekel Bojong Pondok Terong, Penanggungjawab acara, H. Erik Saputra Slamet, Pengurus/Jamaah MT. Balai Wartawan Kota Depok, para Ketua RT/RW, Tokoh Masyarakat setempat dan 300 jamaah turut hadir memadati halaman PIN Al Bahrain. Sedangkan untuk Tausyiah disampaikan oleh Ustadz Ahmad Kamaluddin (Ustadz Galau).</p>
              - generic [ref=f8e1341]: <!-- /wp:paragraph -->
              - generic [ref=f8e1342]: <!-- wp:paragraph -->
              - generic [ref=f8e1343]: <p>Penanggungjawab yang juga Direktur Operasional Adeem Tour, H. Erik Saputra Slamet mengungkapkan rasa syukur atas terselenggaranya kegiatan tersebut. Menurutnya, persiapan Maulid tahun ini terbilang singkat karena sebelumnya pihak panitia juga baru selesai menggelar kegiatan santunan.</p>
              - generic [ref=f8e1344]: <!-- /wp:paragraph -->
              - generic [ref=f8e1345]: <!-- wp:paragraph -->
              - generic [ref=f8e1346]: <p>"Alhamdulillah, pelaksanaan Maulid tahun ini memang waktunya agak sedikit mepet karena sebelumnya kami habis mengadakan santunan. Kami hanya memiliki waktu kurang lebih tiga minggu untuk melakukan persiapan. Tetapi, dengan kebersamaan dan kekompakan, Alhamdulillah semuanya dapat berjalan dengan lancar dan penuh keberkahan," ujar H. Erik didampingi Pengasuh Markaz PIN Al Bahrain, KH. Fatkhuri Wahmad. MA.</p>
              - generic [ref=f8e1347]: <!-- /wp:paragraph -->
              - generic [ref=f8e1348]: <!-- wp:paragraph -->
              - generic [ref=f8e1349]: <p>Ia menjelaskan, peringatan Maulid Nabi tersebut melibatkan berbagai majelis taklim dan elemen masyarakat yang selama ini mendapatkan pembinaan di lingkungan Markaz PIN Al Bahrain. Di antaranya Majelis Taklim Al Bahrain, Majelis Taklim Nur, majelis-majelis taklim RNU di Kelurahan Cipayung, majelis taklim masjid di sekitar kediaman kiai, serta masyarakat di sejumlah lingkungan RT.</p>
              - generic [ref=f8e1350]: <!-- /wp:paragraph -->
              - generic [ref=f8e1351]: <!-- wp:paragraph -->
              - generic [ref=f8e1352]: <p>Menurut Erik, kegiatan Maulid Nabi bukan sekadar seremoni tahunan, melainkan menjadi sarana untuk mengenal dan meneladani Rasulullah SAW lebih dalam melalui introspeksi atau muhasabah.</p>
              - generic [ref=f8e1353]: <!-- /wp:paragraph -->
              - generic [ref=f8e1354]: <!-- wp:paragraph -->
              - generic [ref=f8e1355]: <p>"Yang utama adalah bagaimana kita semakin mengenal dan melakukan muhasabah kepada Rasulullah SAW. Selain itu, kegiatan ini juga menjadi media silaturahmi yang sangat penting," jelasnya.</p>
              - generic [ref=f8e1356]: <!-- /wp:paragraph -->
              - generic [ref=f8e1357]: <!-- wp:paragraph -->
              - generic [ref=f8e1358]: <p>Ia juga menyinggung hubungan baik antara Markaz PIN Al Bahrain dengan berbagai elemen masyarakat dan organisasi di Kota Depok, termasuk dengan Majelis Taklim Balai Wartawan Kota Depok.</p>
