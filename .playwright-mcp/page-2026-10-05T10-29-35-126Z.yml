              - generic [ref=f8e2373]: <p>"Saat ini masih banyak majelis taklim di Kota Depok yang perlu mendapat pembinaan agar semakin berkembang dan memberikan manfaat bagi masyarakat. Selain itu majelis taklim disarankan untuk mendaftar dan memiliki Surat Keterangan Terdaftar (SKT) diwilayahnya masing-masing," pungkasnya.</p>
              - generic [ref=f8e2374]: <!-- /wp:paragraph -->
              - generic [ref=f8e2375]: <!-- wp:paragraph -->
              - generic [ref=f8e2376]: <p>Rangkaian kegiatan berlangsung dalam suasana penuh keakraban dan kekeluargaan. Acara yang diawali dengan pembacaan tahlil dan tahmid oleh Ustadz Salwani, ditutup dengan doa bersama yang dipimpin Ustadz Syahruddin El Fikri, sebagai harapan agar MT. Balai Wartawan Kota Depok terus menjadi wadah yang mempererat ukhuwah, memperkuat nilai keislaman, serta memberikan kontribusi positif bagi masyarakat dan dunia jurnalistik. (**)</p>
