1;s:12:\"published_at\";i:12;s:12:\"scheduled_at\";i:13;s:11:\"views_count\";i:14;s:11:\"is_featured\";i:15;s:9:\"read_time\";i:16;s:10:\"word_count\";i:17;s:11:\"ai_provider\";i:18;s:9:\"seo_score\";}s:10:\"*guarded\";a:1:{i:0;s:1:\"*\";}s:16:\"*forceDeleting\";b:0;}i:16;O:18:\"App\\Models\\Article\":34:{s:13:\"*connection\";s:5:\"mysql\";s:8:\"*table\";s:8:\"articles\";s:13:\"*primaryKey\";s:2:\"id\";s:10:\"*keyType\";s:3:\"int\";s:12:\"incrementing\";b:1;s:7:\"*with\";a:0:{}s:12:\"*withCount\";a:0:{}s:19:\"preventsLazyLoading\";b:0;s:10:\"*perPage\";i:15;s:6:\"exists\";b:1;s:18:\"wasRecentlyCreated\";b:0;s:28:\"*escapeWhenCastingToString\";b:0;s:13:\"*attributes\";a:30:{s:2:\"id\";i:885;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:96:\"”JANGAN DIAM” MT Balai Wartawan Kota Depok Ajak semua Unsur Di Depok Tolak Normalisasi LGBTQ\";s:4:\"slug\";s:90:\"jangan-diam-mt-balai-wartawan-kota-depok-ajak-semua-unsur-di-depok-tolak-normalisasi-lgbtq\";s:7:\"excerpt\";s:0:\"\";s:7:\"content\";s:6004:\"<!-- wp:paragraph -->"
              - generic [ref=f8e1956]: <p>-DEPOK- Majelis Taklim (MT) Balai Wartawan Kota Depok menyoroti dan prihatin terhadap semakin terbukanya kampanye dan upaya normalisasi perilaku LGBTQ (Lesbian, Gay, Biseksual, Transgender, Queer) di berbagai ruang publik, termasuk yang berpotensi mempengaruhi generasi muda. Terlebih prilaku seks menyimpang yang belakangan ini viral di Kota Depok tersebut mulai tak terdengar lagi penolakan LGBTQ dari berbagai unsur.</p>
              - generic [ref=f8e1957]: <!-- /wp:paragraph -->
              - generic [ref=f8e1958]: <!-- wp:paragraph -->
              - generic [ref=f8e1959]: <p>"Depok dikenal sebagai Kota Religius dan Pendidikan, aktifitas penyebaran prilaku seks penyimpangan harus dicegah dan ditolak keras dalam bentuk apapun penyebarannya. Jangan sampai merambah masuk ke Kota Depok, ini dapat mempengaruhi generasi muda bahkan mengancam persatuan dan kesatuan wilayah NKRI," ujar Ketua MT. Balai Wartawan Kota Depok, Adie Rakasiwi, Selasa (11/08/2026).</p>
              - generic [ref=f8e1960]: <!-- /wp:paragraph -->
              - generic [ref=f8e1961]: <!-- wp:paragraph -->
              - generic [ref=f8e1962]: <p>Adie juga mengatakan, semua unsur di Kota Depok jangan diam, bergerak lakukan berbagai gerakan sosialisasi dan penolakan LGBTQ. Dirinya juga mengajak syiarkan dan beritakan penolakan penyebaran kampanye dalam bentuk apapun yang akan merusak generasi muda Depok.</p>
              - generic [ref=f8e1963]: <!-- /wp:paragraph -->
              - generic [ref=f8e1964]: <!-- wp:paragraph -->
              - generic [ref=f8e1965]: <p>"Kami MT. Balai Wartawan Kota Depok mengajak semua unsur dari mulai Pemkot, Kepolisian, TNI, Organisasi Keagamaan, Kepemudaan dan Masyarakat di Kota Depok untuk melakukan tindakan nyata dengan melarang dan penolakan LGBTQ, kami siap memberikan ruang pemberitaan agar masyarakat Kota Depok dapat mencegah bila mengetahui prilaku penyimpangan," tegasnya.</p>
              - generic [ref=f8e1966]: <!-- /wp:paragraph -->
              - generic [ref=f8e1967]: <!-- wp:paragraph -->
              - generic [ref=f8e1968]: <p>Sementara itu, Pengasuh MT. Balai Wartawan Kota Depok, Ustadz H. Syahruddin El Fikri menuturkan Islam mengajarkan penghormatan terhadap setiap manusia sebagai makhluk ciptaan Allah SWT. Karena itu, tidak dibenarkan adanya tindakan perundungan, penghinaan, maupun kekerasan terhadap siapa pun. Namun, dalam aspek ajaran dan hukum syariat, Islam memiliki pandangan yang tegas terkait perilaku seksual yang menyimpang dari fitrah.</p>
              - generic [ref=f8e1969]: <!-- /wp:paragraph -->
              - generic [ref=f8e1970]: <!-- wp:paragraph -->
              - generic [ref=f8e1971]: <p>"Islam memuliakan manusia, tetapi pada saat yang sama juga memberikan batasan-batasan moral dan syariat. Perilaku homoseksual dan hubungan sesama jenis tidak dibenarkan dalam ajaran Islam. Sikap kita adalah mengedepankan dakwah, edukasi, dan pembinaan, bukan kebencian atau tindakan anarkis," kata Ustadz Syahruddin.</p>
              - generic [ref=f8e1972]: <!-- /wp:paragraph -->
              - generic [ref=f8e1973]: <!-- wp:paragraph -->
              - generic [ref=f8e1974]: <p>Ia menjelaskan, Al-Qur'an mengabadikan kisah Nabi Luth AS sebagai pelajaran bagi umat manusia. Kaum Nabi Luth dikenal melakukan hubungan sesama jenis secara terang-terangan dan menolak seruan Nabi Luth untuk kembali kepada fitrah.</p>
              - generic [ref=f8e1975]: <!-- /wp:paragraph -->
              - generic [ref=f8e1976]: <!-- wp:paragraph -->
              - generic [ref=f8e1977]: <p>Allah SWT berfirman:</p>
              - generic [ref=f8e1978]: <!-- /wp:paragraph -->
              - generic [ref=f8e1979]: <!-- wp:paragraph -->
              - generic [ref=f8e1980]: <p>أَتَأْتُونَ الْفَاحِشَةَ مَا سَبَقَكُمْ بِهَا مِنْ أَحَدٍ مِنَ الْعَالَمِينَ ۝ إِنَّكُمْ لَتَأْتُونَ الرِّجَالَ شَهْوَةً مِنْ دُونِ النِّسَاءِ ۚ بَلْ أَنْتُمْ قَوْمٌ مُسْرِفُونَ</p>
              - generic [ref=f8e1981]: <!-- /wp:paragraph -->
              - generic [ref=f8e1982]: <!-- wp:paragraph -->
              - generic [ref=f8e1983]: "<p>\"Mengapa kamu mengerjakan perbuatan fahisyah itu, yang belum pernah dikerjakan oleh seorang pun sebelum kamu di dunia ini? Sesungguhnya kamu mendatangi laki-laki untuk melepaskan nafsumu, bukan kepada perempuan, malah kamu ini adalah kaum yang melampaui batas.\" (QS. Al-A'raf: 80-81).</p>"
              - generic [ref=f8e1984]: <!-- /wp:paragraph -->
              - generic [ref=f8e1985]: <!-- wp:paragraph -->
              - generic [ref=f8e1986]: <p>Ketika Nabi Luth AS terus menyeru mereka agar bertobat dan kembali kepada ajaran Allah, kaumnya justru mengejek dan mengusir beliau serta para pengikutnya. Bahkan, saat para malaikat datang dalam rupa lelaki tampan, kaum Nabi Luth mendatangi rumah beliau dengan niat berbuat keji.</p>
              - generic [ref=f8e1987]: <!-- /wp:paragraph -->
              - generic [ref=f8e1988]: <!-- wp:paragraph -->
              - generic [ref=f8e1989]: <p>Karena keingkaran dan pembangkangan tersebut, kata Ustadz Syahruddin, Allah SWT kemudian menurunkan azab yang sangat dahsyat kepada mereka. Negeri mereka dibalikkan dan dihujani batu dari tanah yang terbakar, sebagaimana dijelaskan dalam beberapa ayat Al-Qur'an, di antaranya QS. Hud ayat 82-83 dan QS. Al-Hijr ayat 73-74.</p>
              - generic [ref=f8e1990]: <!-- /wp:paragraph -->
              - generic [ref=f8e1991]: <!-- wp:paragraph -->
              - generic [ref=f8e1992]: <p>"Peristiwa kaum Nabi Luth bukan sekadar kisah sejarah, tetapi menjadi pelajaran bagi umat manusia agar menjaga fitrah, moralitas, dan ketahanan keluarga. Islam memandang keluarga yang dibangun atas dasar pernikahan antara laki-laki dan perempuan sebagai fondasi utama peradaban," tegasnya.</p>
              - generic [ref=f8e1993]: <!-- /wp:paragraph -->
              - generic [ref=f8e1994]: <!-- wp:paragraph -->
              - generic [ref=f8e1995]: <p>Menurut Ust. Syahruddin, normalisasi perilaku LGBTQ dapat menimbulkan berbagai dampak sosial, di antaranya melemahnya nilai-nilai agama, munculnya kebingungan identitas pada generasi muda, serta berpotensi menggerus ketahanan institusi keluarga.</p>
              - generic [ref=f8e1996]: <!-- /wp:paragraph -->
              - generic [ref=f8e1997]: <!-- wp:paragraph -->
              - generic [ref=f8e1998]: <p>Karena itu, ia mengajak para orang tua, pendidik, tokoh agama, dan media untuk memperkuat pendidikan akhlak dan agama sejak dini.</p>
              - generic [ref=f8e1999]: <!-- /wp:paragraph -->
              - generic [ref=f8e2000]: <!-- wp:paragraph -->
              - generic [ref=f8e2001]: <p>"Kita perlu memperkuat benteng keluarga, memperbanyak pendidikan keagamaan, serta menghadirkan lingkungan yang sehat bagi anak-anak dan generasi muda. Dakwah harus dilakukan dengan hikmah, kasih sayang, dan tetap berpegang teguh pada prinsip-prinsip ajaran Islam," pungkasnya. (**)</p>
              - generic [ref=f8e2002]: <!-- /wp:paragraph -->
              - generic [ref=f8e2003]: "<!-- wp:image {\"id\":1085,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
