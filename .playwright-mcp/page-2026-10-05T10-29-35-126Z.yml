mage\";i:7;s:10:\"meta_title\";i:8;s:16:\"meta_description\";i:9;s:11:\"schema_type\";i:10;s:6:\"status\";i:11;s:12:\"published_at\";i:12;s:12:\"scheduled_at\";i:13;s:11:\"views_count\";i:14;s:11:\"is_featured\";i:15;s:9:\"read_time\";i:16;s:10:\"word_count\";i:17;s:11:\"ai_provider\";i:18;s:9:\"seo_score\";}s:10:\"*guarded\";a:1:{i:0;s:1:\"*\";}s:16:\"*forceDeleting\";b:0;}i:4;O:18:\"App\\Models\\Article\":34:{s:13:\"*connection\";s:5:\"mysql\";s:8:\"*table\";s:8:\"articles\";s:13:\"*primaryKey\";s:2:\"id\";s:10:\"*keyType\";s:3:\"int\";s:12:\"incrementing\";b:1;s:7:\"*with\";a:0:{}s:12:\"*withCount\";a:0:{}s:19:\"preventsLazyLoading\";b:0;s:10:\"*perPage\";i:15;s:6:\"exists\";b:1;s:18:\"wasRecentlyCreated\";b:0;s:28:\"*escapeWhenCastingToString\";b:0;s:13:\"*attributes\";a:30:{s:2:\"id\";i:897;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:105:\"HARI KETIGA SEMAKIN BERGENGSI, TGB ZAINUL MAJDI HADIR JADI NARASUMBER TAKHASSUS TAFSIR PKU MUI KOTA DEPOK\";s:4:\"slug\";s:104:\"hari-ketiga-semakin-bergengsi-tgb-zainul-majdi-hadir-jadi-narasumber-takhassus-tafsir-pku-mui-kota-depok\";s:7:\"excerpt\";s:0:\"\";s:7:\"content\";s:3566:\"<!-- wp:image {\"id\":1138,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e852]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_4956-1024x768.jpeg" alt="" class="wp-image-1138"/></figure>
              - generic [ref=f8e853]: <!-- /wp:image -->
              - generic [ref=f8e854]: <!-- wp:paragraph -->
              - generic [ref=f8e855]: <p>*DEPOK,— Program *Takhassus Tafsir dan Ilmu Tafsir Pendidikan Kader Ulama MUI Kota Depok* memasuki hari ketiga dan semakin bergengsi. Kegiatan yang digelar pada <em>Rabu, 16 September 2026</em> ini menghadirkan tokoh nasional sebagai narasumber.</p>
              - generic [ref=f8e856]: <!-- /wp:paragraph -->
              - generic [ref=f8e857]: <!-- wp:paragraph -->
              - generic [ref=f8e858]: <p>Hadir sebagai pemateri utama yakni <em>Mantan Gubernur NTB, TGB Tuan Guru Bajang Dr. TGB. Muhammad Zainul Majdi</em>, Ketua Alumni Al-Azhar Indonesia dan Rektor Institut Agama Islam Hamzanwadi NW.</p>
              - generic [ref=f8e859]: <!-- /wp:paragraph -->
              - generic [ref=f8e860]: <!-- wp:paragraph -->
              - generic [ref=f8e861]: <p>Kegiatan yang dimoderatori oleh <em>Dr. KH. Sya'roni Rofi'i</em>, Komisi PKU MUI Kota Depok yang juga Alumni PhD Marmara University Turkiye, ini diikuti dengan antusiasme tinggi oleh seluruh peserta PKU.</p>
              - generic [ref=f8e862]: <!-- /wp:paragraph -->
              - generic [ref=f8e863]: <!-- wp:paragraph -->
              - generic [ref=f8e864]: <p><em>Bedah Epistemologi Ilmu Tafsir</em></p>
              - generic [ref=f8e865]: <!-- /wp:paragraph -->
              - generic [ref=f8e866]: <!-- wp:paragraph -->
              - generic [ref=f8e867]: <p>Pada hari ketiga ini, TGB membawakan pokok bahasan strategis:<br><em>"Ilmu Tafsir; Lingkupnya (Kriteria/Kaidah) dan Hubungannya dengan Ilmu-ilmu Humaniora Modern"</em></p>
              - generic [ref=f8e868]: <!-- /wp:paragraph -->
              - generic [ref=f8e869]: <!-- wp:paragraph -->
              - generic [ref=f8e870]: <p>Materi ini membedah secara mendalam:</p>
              - generic [ref=f8e871]: <!-- /wp:paragraph -->
              - generic [ref=f8e872]: "<!-- wp:image {\"id\":1139} -->"
              - generic [ref=f8e873]: <figure class="wp-block-image"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_5004-scaled.jpeg" alt="" class="wp-image-1139"/></figure>
              - generic [ref=f8e874]: <!-- /wp:image -->
              - generic [ref=f8e875]: "<!-- wp:image {\"id\":1140} -->"
              - generic [ref=f8e876]: <figure class="wp-block-image"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_5007-scaled.jpeg" alt="" class="wp-image-1140"/></figure>
              - generic [ref=f8e877]: <!-- /wp:image -->
              - generic [ref=f8e878]: <!-- wp:paragraph -->
              - generic [ref=f8e879]: <p><em>1. Epistemologi Ilmu Tafsir <code>Dhawabit al-Mufassir</code></em>, yaitu kaidah-kaidah dan kriteria baku dalam ilmu tafsir.</p>
              - generic [ref=f8e880]: <!-- /wp:paragraph -->
              - generic [ref=f8e881]: <!-- wp:paragraph -->
              - generic [ref=f8e882]: <p><em>2. Syarat-syarat Legalitas Penafsiran <code>Syurut al-Mufassir</code></em>, tentang siapa yang berhak dan layak menafsirkan Al-Qur'an.</p>
              - generic [ref=f8e883]: <!-- /wp:paragraph -->
              - generic [ref=f8e884]: <!-- wp:paragraph -->
              - generic [ref=f8e885]: <p><em>3. Demarkasi Ilmiah</em>, batas tegas yang membedakan antara tafsir ilmiah yang valid dengan <em>al-istinbath al-murtajal</em> yaitu penafsiran reaktif, serampangan, dan tanpa kaidah.</p>
              - generic [ref=f8e886]: <!-- /wp:paragraph -->
              - generic [ref=f8e887]: <!-- wp:paragraph -->
              - generic [ref=f8e888]: <p>Lebih jauh, TGB juga mengeksplorasi titik temu dan integrasi metodologis antara ilmu turats <code>Ulum Al-Qur'an</code> dengan pendekatan ilmu-ilmu humaniora modern seperti sosiologi, antropologi, dan linguistik.</p>
              - generic [ref=f8e889]: <!-- /wp:paragraph -->
              - generic [ref=f8e890]: <!-- wp:paragraph -->
              - generic [ref=f8e891]: <p>Integrasi ini bertujuan untuk membaca dan menjawab problematika masyarakat urban yang kompleks, tanpa mengorbankan asas keotentikan teks Al-Qur'an itu sendiri.</p>
              - generic [ref=f8e892]: <!-- /wp:paragraph -->
              - generic [ref=f8e893]: <!-- wp:paragraph -->
              - generic [ref=f8e894]: <p>Kehadiran TGB sebagai tokoh nasional yang merupakan lulusan Al-Azhar Mesir dinilai memberikan warna tersendiri dan meningkatkan bobot keilmuan dalam program Takhassus Tafsir yang digagas MUI Kota Depok ini.</p>
              - generic [ref=f8e895]: <!-- /wp:paragraph -->
              - generic [ref=f8e896]: <!-- wp:paragraph -->
              - generic [ref=f8e897]: <p>Program Takhassus Tafsir dan Ilmu Tafsir ini diharapkan mampu melahirkan kader-kader ulama yang tidak hanya menguasai khazanah turats klasik, tetapi juga mampu berdialog dengan pendekatan keilmuan modern untuk kemaslahatan umat.</p>
              - generic [ref=f8e898]: <!-- /wp:paragraph -->
              - generic [ref=f8e899]: <!-- wp:paragraph -->
              - generic [ref=f8e900]: <p></p>
              - generic [ref=f8e901]: "<!-- /wp:paragraph -->\";s:14:\"featured_image\";s:128:\"articles/hari-ketiga-semakin-bergengsi-tgb-zainul-majdi-hadir-jadi-narasumber-takhassus-tafsir-pku-mui-kota-depok-1790924828.jpg\";s:10:\"meta_title\";s:105:\"HARI KETIGA SEMAKIN BERGENGSI, TGB ZAINUL MAJDI HADIR JADI NARASUMBER TAKHASSUS TAFSIR PKU MUI KOTA DEPOK\";s:16:\"meta_description\";s:0:\"\";s:11:\"schema_type\";s:7:\"Article\";s:6:\"status\";s:9:\"published\";s:12:\"published_at\";s:19:\"2026-09-16 17:40:09\";s:12:\"scheduled_at\";N;s:11:\"views_count\";i:19;s:9:\"read_time\";i:2;s:10:\"word_count\";i:267;s:11:\"ai_provider\";N;s:9:\"seo_score\";i:0;s:11:\"is_featured\";i:0;s:11:\"is_breaking\";i:0;s:11:\"is_headline\";i:0;s:4:\"tags\";N;s:8:\"location\";N;s:11:\"series_name\";N;s:12:\"series_order\";N;s:10:\"deleted_at\";N;s:10:\"created_at\";s:19:\"2026-10-02 07:07:08\";s:10:\"updated_at\";s:19:\"2026-10-04 23:59:27\";}s:11:\"*original\";a:30:{s:2:\"id\";i:897;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:105:\"HARI KETIGA SEMAKIN BERGENGSI, TGB ZAINUL MAJDI HADIR JADI NARASUMBER TAKHASSUS TAFSIR PKU MUI KOTA DEPOK\";s:4:\"slug\";s:104:\"hari-ketiga-semakin-bergengsi-tgb-zainul-majdi-hadir-jadi-narasumber-takhassus-tafsir-pku-mui-kota-depok\";s:7:\"excerpt\";s:0:\"\";s:7:\"content\";s:3566:\"<!-- wp:image {\"id\":1138,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e902]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_4956-1024x768.jpeg" alt="" class="wp-image-1138"/></figure>
              - generic [ref=f8e903]: <!-- /wp:image -->
              - generic [ref=f8e904]: <!-- wp:paragraph -->
              - generic [ref=f8e905]: <p>*DEPOK,— Program *Takhassus Tafsir dan Ilmu Tafsir Pendidikan Kader Ulama MUI Kota Depok* memasuki hari ketiga dan semakin bergengsi. Kegiatan yang digelar pada <em>Rabu, 16 September 2026</em> ini menghadirkan tokoh nasional sebagai narasumber.</p>
              - generic [ref=f8e906]: <!-- /wp:paragraph -->
              - generic [ref=f8e907]: <!-- wp:paragraph -->
              - generic [ref=f8e908]: <p>Hadir sebagai pemateri utama yakni <em>Mantan Gubernur NTB, TGB Tuan Guru Bajang Dr. TGB. Muhammad Zainul Majdi</em>, Ketua Alumni Al-Azhar Indonesia dan Rektor Institut Agama Islam Hamzanwadi NW.</p>
              - generic [ref=f8e909]: <!-- /wp:paragraph -->
              - generic [ref=f8e910]: <!-- wp:paragraph -->
              - generic [ref=f8e911]: <p>Kegiatan yang dimoderatori oleh <em>Dr. KH. Sya'roni Rofi'i</em>, Komisi PKU MUI Kota Depok yang juga Alumni PhD Marmara University Turkiye, ini diikuti dengan antusiasme tinggi oleh seluruh peserta PKU.</p>
              - generic [ref=f8e912]: <!-- /wp:paragraph -->
              - generic [ref=f8e913]: <!-- wp:paragraph -->
              - generic [ref=f8e914]: <p><em>Bedah Epistemologi Ilmu Tafsir</em></p>
              - generic [ref=f8e915]: <!-- /wp:paragraph -->
              - generic [ref=f8e916]: <!-- wp:paragraph -->
              - generic [ref=f8e917]: <p>Pada hari ketiga ini, TGB membawakan pokok bahasan strategis:<br><em>"Ilmu Tafsir; Lingkupnya (Kriteria/Kaidah) dan Hubungannya dengan Ilmu-ilmu Humaniora Modern"</em></p>
              - generic [ref=f8e918]: <!-- /wp:paragraph -->
              - generic [ref=f8e919]: <!-- wp:paragraph -->
              - generic [ref=f8e920]: <p>Materi ini membedah secara mendalam:</p>
              - generic [ref=f8e921]: <!-- /wp:paragraph -->
              - generic [ref=f8e922]: "<!-- wp:image {\"id\":1139} -->"
              - generic [ref=f8e923]: <figure class="wp-block-image"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_5004-scaled.jpeg" alt="" class="wp-image-1139"/></figure>
              - generic [ref=f8e924]: <!-- /wp:image -->
              - generic [ref=f8e925]: "<!-- wp:image {\"id\":1140} -->"
              - generic [ref=f8e926]: <figure class="wp-block-image"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_5007-scaled.jpeg" alt="" class="wp-image-1140"/></figure>
              - generic [ref=f8e927]: <!-- /wp:image -->
              - generic [ref=f8e928]: <!-- wp:paragraph -->
              - generic [ref=f8e929]: <p><em>1. Epistemologi Ilmu Tafsir <code>Dhawabit al-Mufassir</code></em>, yaitu kaidah-kaidah dan kriteria baku dalam ilmu tafsir.</p>
              - generic [ref=f8e930]: <!-- /wp:paragraph -->
              - generic [ref=f8e931]: <!-- wp:paragraph -->
              - generic [ref=f8e932]: <p><em>2. Syarat-syarat Legalitas Penafsiran <code>Syurut al-Mufassir</code></em>, tentang siapa yang berhak dan layak menafsirkan Al-Qur'an.</p>
              - generic [ref=f8e933]: <!-- /wp:paragraph -->
              - generic [ref=f8e934]: <!-- wp:paragraph -->
              - generic [ref=f8e935]: <p><em>3. Demarkasi Ilmiah</em>, batas tegas yang membedakan antara tafsir ilmiah yang valid dengan <em>al-istinbath al-murtajal</em> yaitu penafsiran reaktif, serampangan, dan tanpa kaidah.</p>
              - generic [ref=f8e936]: <!-- /wp:paragraph -->
              - generic [ref=f8e937]: <!-- wp:paragraph -->
              - generic [ref=f8e938]: <p>Lebih jauh, TGB juga mengeksplorasi titik temu dan integrasi metodologis antara ilmu turats <code>Ulum Al-Qur'an</code> dengan pendekatan ilmu-ilmu humaniora modern seperti sosiologi, antropologi, dan linguistik.</p>
              - generic [ref=f8e939]: <!-- /wp:paragraph -->
              - generic [ref=f8e940]: <!-- wp:paragraph -->
              - generic [ref=f8e941]: <p>Integrasi ini bertujuan untuk membaca dan menjawab problematika masyarakat urban yang kompleks, tanpa mengorbankan asas keotentikan teks Al-Qur'an itu sendiri.</p>
              - generic [ref=f8e942]: <!-- /wp:paragraph -->
              - generic [ref=f8e943]: <!-- wp:paragraph -->
              - generic [ref=f8e944]: <p>Kehadiran TGB sebagai tokoh nasional yang merupakan lulusan Al-Azhar Mesir dinilai memberikan warna tersendiri dan meningkatkan bobot keilmuan dalam program Takhassus Tafsir yang digagas MUI Kota Depok ini.</p>
              - generic [ref=f8e945]: <!-- /wp:paragraph -->
              - generic [ref=f8e946]: <!-- wp:paragraph -->
              - generic [ref=f8e947]: <p>Program Takhassus Tafsir dan Ilmu Tafsir ini diharapkan mampu melahirkan kader-kader ulama yang tidak hanya menguasai khazanah turats klasik, tetapi juga mampu berdialog dengan pendekatan keilmuan modern untuk kemaslahatan umat.</p>
              - generic [ref=f8e948]: <!-- /wp:paragraph -->
              - generic [ref=f8e949]: <!-- wp:paragraph -->
              - generic [ref=f8e950]: <p></p>
