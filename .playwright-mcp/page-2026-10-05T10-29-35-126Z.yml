;s:11:\"schema_type\";i:10;s:6:\"status\";i:11;s:12:\"published_at\";i:12;s:12:\"scheduled_at\";i:13;s:11:\"views_count\";i:14;s:11:\"is_featured\";i:15;s:9:\"read_time\";i:16;s:10:\"word_count\";i:17;s:11:\"ai_provider\";i:18;s:9:\"seo_score\";}s:10:\"*guarded\";a:1:{i:0;s:1:\"*\";}s:16:\"*forceDeleting\";b:0;}i:5;O:18:\"App\\Models\\Article\":34:{s:13:\"*connection\";s:5:\"mysql\";s:8:\"*table\";s:8:\"articles\";s:13:\"*primaryKey\";s:2:\"id\";s:10:\"*keyType\";s:3:\"int\";s:12:\"incrementing\";b:1;s:7:\"*with\";a:0:{}s:12:\"*withCount\";a:0:{}s:19:\"preventsLazyLoading\";b:0;s:10:\"*perPage\";i:15;s:6:\"exists\";b:1;s:18:\"wasRecentlyCreated\";b:0;s:28:\"*escapeWhenCastingToString\";b:0;s:13:\"*attributes\";a:30:{s:2:\"id\";i:896;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:82:\"Tanpa Pesaing “Barok dan Ade Suwardi Nahkodai Forkabi Kota Depok 5 Tahun Kedepan\";s:4:\"slug\";s:79:\"tanpa-pesaing-barok-dan-ade-suwardi-nahkodai-forkabi-kota-depok-5-tahun-kedepan\";s:7:\"excerpt\";s:0:\"\";s:7:\"content\";s:3518:\"<!-- wp:paragraph -->"
              - generic [ref=f8e952]: <p>-DEPOK- Sudah dapat dipastikan bahwa Edi Dadang Chandra (Barok) sebagai Ketua terpilih DPD dan Ade Suwardi (Dede) sebagai Ketua terpilih MPOD Forkabi Kota Depok periode 2026-2031 pada Musyawarah Daerah (Musda) VI Forkabi Kota Depok secara Aklamasi. Meskipun pelaksanaan Musda nya baru akan dilaksanakan pada Sabtu, 19 September 2026 di Balai Rakyat Depok Utara, Beji.</p>
              - generic [ref=f8e953]: <!-- /wp:paragraph -->
              - generic [ref=f8e954]: "<!-- wp:image {\"id\":1135,\"sizeSlug\":\"full\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e955]: <figure class="wp-block-image size-full"><img src="https://margondatv.com/wp-content/uploads/2026/09/78ed6555-1454-4a72-96df-1294c50be4b5.jpeg" alt="" class="wp-image-1135"/></figure>
              - generic [ref=f8e956]: <!-- /wp:image -->
              - generic [ref=f8e957]: <!-- wp:paragraph -->
              - generic [ref=f8e958]: <p>Hal tersebut dikatakan Ketua Organizing Commite (OC), Marwaji, kenapa dapat dikatakan sebagai ketua terpilih secara aklamasi, karena tunggal tidak ada lagi calon lain yang mendaftarkan diri sebagai calon Ketua DPD dan MPOD hingga pendaftaran yang dibuka sejak tanggal, 14 hingga 16 September 2026 yang ditutup pada pukul 21.00.Wib.</p>
              - generic [ref=f8e959]: <!-- /wp:paragraph -->
              - generic [ref=f8e960]: <!-- wp:paragraph -->
              - generic [ref=f8e961]: <p>"Bang Barok dan Bang Ade Suwardi yang datang didampingi para Ketua DPC dan DPRt mendaftarkan diri sebagai calon Ketua DPD dan MPOD Forkabi Kota Depok, tepat di pukul 17.00.Wib. Semua persyaratan dan administrasi lengkap tidak ada kekurangan satupun," ujar Waji sapaan akrabnya, Rabu, (16/09/2026) sore.</p>
              - generic [ref=f8e962]: <!-- /wp:paragraph -->
              - generic [ref=f8e963]: <!-- wp:paragraph -->
              - generic [ref=f8e964]: <p>Waji juga mengatakan semoga kegiatan pendaftaran calon ketua DPD dan MPOD Musda VI Forkabi Kota Depok yang akan dilaksanakan pada Sabtu, 19 September 2026 dapat menjadi bagian dari kontestasi dalam berdemokrasi yang ada di DPD Forkabi Kota Depok.</p>
              - generic [ref=f8e965]: <!-- /wp:paragraph -->
              - generic [ref=f8e966]: <!-- wp:paragraph -->
              - generic [ref=f8e967]: <p>"Hingga sekarang ini pukul 21.00.Wib tidak ada lagi calon Ketua DPD dan MPOD yang mendaftarkan diri, secara resmi pendaftaran Calon Ketua DPD dan MPOD Forkabi Kota Depok ditutup," tegasnya.</p>
              - generic [ref=f8e968]: <!-- /wp:paragraph -->
              - generic [ref=f8e969]: <!-- wp:paragraph -->
              - generic [ref=f8e970]: <p>Sementara itu, salah satu tokoh di Forkabi Kota Depok yang juga Ketua DPC Forkabi Cinere, H. Samali.HS mengucapkan rasa syukur alhamdulillah karena pada sore ini dapat dilaksanakan pendaftaran Calon Ketua DDP Bang Edi Dadang Chandra dan Calon Ketua MPOD Bang Ade Suwardi, mudah-mudahan Forkabi Kota Depok yang sudah berjalan baik bersinergi dengan Pemerintah Kota (Pemkot) Depok akan lebih baik untuk periode 2026-2031.</p>
              - generic [ref=f8e971]: <!-- /wp:paragraph -->
              - generic [ref=f8e972]: <!-- wp:paragraph -->
              - generic [ref=f8e973]: <p>"Ini semua hasil kerjasama yang baik dan kebersamaan DPC Forkabi yang ada di Kota Depok, siapapun yang menjadi Ketua DPD dan MPOD, mari kita bersinergi dan bangkit bersama-bersama baguskan Kota Depok ini menjadi Kota yang kuat bersama Ormas Forkabi," jelas H. Samali.HS.</p>
              - generic [ref=f8e974]: <!-- /wp:paragraph -->
              - generic [ref=f8e975]: <!-- wp:paragraph -->
              - generic [ref=f8e976]: <p>Ia juga berharap, bila memang Bang Barok terpilih kembali sebagai Ketua DPD, Forkabi Kota Depok yang sudah bagus ini, kedepan lima tahun kedepan ini mudah-mudahan 11 DPC Forkabi tetap solid untuk menjalankan kerjasamanya diwilayah Depok</p>
              - generic [ref=f8e977]: <!-- /wp:paragraph -->
              - generic [ref=f8e978]: <!-- wp:paragraph -->
              - generic [ref=f8e979]: <p>"Mari kita dukung dan sukseskan kegiatan Musda VI Forkabi Kota Depok berjalan lancar dan sukses, makin maju dalam menjaga adat dan budaya Betawi," pungkasnya.</p>
              - generic [ref=f8e980]: <!-- /wp:paragraph -->
              - generic [ref=f8e981]: <!-- wp:paragraph -->
              - generic [ref=f8e982]: <p>Untuk diketahui, hingga pukul 21.00.wib malam ini, tercatat di kepanitian yang resmi mendaftarkan diri sebagai calon Ketua DPD dan Ketua MPOD, hanya Edi Dadang Chandra dan Ade Suwardi. </p>
              - generic [ref=f8e983]: "<!-- /wp:paragraph -->\";s:14:\"featured_image\";s:103:\"articles/tanpa-pesaing-barok-dan-ade-suwardi-nahkodai-forkabi-kota-depok-5-tahun-kedepan-1790924827.jpg\";s:10:\"meta_title\";s:82:\"Tanpa Pesaing “Barok dan Ade Suwardi Nahkodai Forkabi Kota Depok 5 Tahun Kedepan\";s:16:\"meta_description\";s:0:\"\";s:11:\"schema_type\";s:7:\"Article\";s:6:\"status\";s:9:\"published\";s:12:\"published_at\";s:19:\"2026-09-16 16:37:05\";s:12:\"scheduled_at\";N;s:11:\"views_count\";i:3;s:9:\"read_time\";i:2;s:10:\"word_count\";i:398;s:11:\"ai_provider\";N;s:9:\"seo_score\";i:0;s:11:\"is_featured\";i:0;s:11:\"is_breaking\";i:0;s:11:\"is_headline\";i:0;s:4:\"tags\";N;s:8:\"location\";N;s:11:\"series_name\";N;s:12:\"series_order\";N;s:10:\"deleted_at\";N;s:10:\"created_at\";s:19:\"2026-10-02 07:07:07\";s:10:\"updated_at\";s:19:\"2026-10-05 08:26:05\";}s:11:\"*original\";a:30:{s:2:\"id\";i:896;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:82:\"Tanpa Pesaing “Barok dan Ade Suwardi Nahkodai Forkabi Kota Depok 5 Tahun Kedepan\";s:4:\"slug\";s:79:\"tanpa-pesaing-barok-dan-ade-suwardi-nahkodai-forkabi-kota-depok-5-tahun-kedepan\";s:7:\"excerpt\";s:0:\"\";s:7:\"content\";s:3518:\"<!-- wp:paragraph -->"
