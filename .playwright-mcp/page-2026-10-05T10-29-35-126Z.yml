";i:11;s:12:\"published_at\";i:12;s:12:\"scheduled_at\";i:13;s:11:\"views_count\";i:14;s:11:\"is_featured\";i:15;s:9:\"read_time\";i:16;s:10:\"word_count\";i:17;s:11:\"ai_provider\";i:18;s:9:\"seo_score\";}s:10:\"*guarded\";a:1:{i:0;s:1:\"*\";}s:16:\"*forceDeleting\";b:0;}i:14;O:18:\"App\\Models\\Article\":34:{s:13:\"*connection\";s:5:\"mysql\";s:8:\"*table\";s:8:\"articles\";s:13:\"*primaryKey\";s:2:\"id\";s:10:\"*keyType\";s:3:\"int\";s:12:\"incrementing\";b:1;s:7:\"*with\";a:0:{}s:12:\"*withCount\";a:0:{}s:19:\"preventsLazyLoading\";b:0;s:10:\"*perPage\";i:15;s:6:\"exists\";b:1;s:18:\"wasRecentlyCreated\";b:0;s:28:\"*escapeWhenCastingToString\";b:0;s:13:\"*attributes\";a:30:{s:2:\"id\";i:887;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:95:\"Eratkan Komunikasi,MT Balwan Kota Depok Silaturahim ke Kantor Imigrasi, Buka Peluang Kolaborasi\";s:4:\"slug\";s:93:\"eratkan-komunikasimt-balwan-kota-depok-silaturahim-ke-kantor-imigrasi-buka-peluang-kolaborasi\";s:7:\"excerpt\";s:0:\"\";s:7:\"content\";s:4152:\"<!-- wp:paragraph -->"
              - generic [ref=f8e1760]: <p>-DEPOK- Untuk lebih mempererat komunikasi dan membuka peluang kolaborasi, Majelis Taklim (MT) Balai Wartawan (Balwan) Kota Depok melakukan kunjungan silaturahmi ke Kantor Imigrasi Kelas I Non TPI Depok, Selasa (18/08/2026).</p>
              - generic [ref=f8e1761]: <!-- /wp:paragraph -->
              - generic [ref=f8e1762]: <!-- wp:paragraph -->
              - generic [ref=f8e1763]: <p>Kedatangan Pengurus dan jamaah MT. Balai Wartawan Kota Depok diterima langsung oleh Kepala Subseksi Komunikasi Keimigrasian, Herlina Azis yang mewakili Pimpinan Kantor Imigrasi Kelas I Non TPI Depok.</p>
              - generic [ref=f8e1764]: <!-- /wp:paragraph -->
              - generic [ref=f8e1765]: <!-- wp:paragraph -->
              - generic [ref=f8e1766]: <p>Ketua MT. Balwan Kota Depok, Adie Rakasiwi menyampaikan apresiasi dan terima kasih atas sambutan yang diberikan jajaran Imigrasi Depok. Ia menjelaskan bahwa kunjungan tersebut tidak hanya bertujuan mempererat tali silaturahmi, tetapi juga membangun komunikasi yang lebih baik ke depannya.</p>
              - generic [ref=f8e1767]: <!-- /wp:paragraph -->
              - generic [ref=f8e1768]: <!-- wp:paragraph -->
              - generic [ref=f8e1769]: <p>"Silaturahmi ini menjadi langkah awal untuk membangun sinergi. Kami berharap ke depan dapat berkolaborasi, terutama dalam penyampaian pemberitaan maupun informasi kegiatan Kantor Imigrasi Depok kepada masyarakat," ujar Adie Rakasiwi.</p>
              - generic [ref=f8e1770]: <!-- /wp:paragraph -->
              - generic [ref=f8e1771]: <!-- wp:paragraph -->
              - generic [ref=f8e1772]: <p>Dikatakan Adie, komunikasi yang terjalin dengan baik antara insan pers, organisasi kemasyarakatan, dan instansi pemerintah sangat penting untuk mendukung penyebarluasan informasi yang akurat kepada masyarakat.</p>
              - generic [ref=f8e1773]: <!-- /wp:paragraph -->
              - generic [ref=f8e1774]: <!-- wp:paragraph -->
              - generic [ref=f8e1775]: <p>"Selain terjalinnya komunikasi yang baik melalui silaturahmi, tentunya dapat menciptaka&nbsp; sinergitas antara MT. Balwan dan Imigrasi Depok dalam penyebarluasan informasi yang akurat kepada masyarakat hal pemberitaan," jelasnya.</p>
              - generic [ref=f8e1776]: <!-- /wp:paragraph -->
              - generic [ref=f8e1777]: <!-- wp:paragraph -->
              - generic [ref=f8e1778]: <p>Sementara itu, Herlina Azis menyambut positif kedatangan MT. Balwan Kota Depok. Ia mengaku baru mengetahui keberadaan MT. Balwan Kota Depok dan berharap hubungan baik yang telah terbangun dapat terus dipelihara.</p>
              - generic [ref=f8e1779]: <!-- /wp:paragraph -->
              - generic [ref=f8e1780]: <!-- wp:paragraph -->
              - generic [ref=f8e1781]: <p>"Kami berharap silaturahmi antara Kantor Imigrasi Depok dengan MT. Balwan Kota Depok tetap terjaga dan semakin baik ke depannya,” kata Herlina.</p>
              - generic [ref=f8e1782]: <!-- /wp:paragraph -->
              - generic [ref=f8e1783]: <!-- wp:paragraph -->
              - generic [ref=f8e1784]: <p>Herlina juga membuka ruang kolaborasi dalam berbagai kegiatan. Ia menyampaikan bahwa MT. Balwan Kota Depok dapat dilibatkan dalam komunikasi terkait informasi dan kegiatan keimigrasian, sementara pihak Imigrasi Depok juga siap mendukung kegiatan keagamaan yang diselenggarakan MT. Balwan Kota Depok.</p>
              - generic [ref=f8e1785]: <!-- /wp:paragraph -->
              - generic [ref=f8e1786]: <!-- wp:paragraph -->
              - generic [ref=f8e1787]: <p>"Kalau ada kegiatan keagamaan MT. Balwan Kota Depok, insyaallah kami akan undang. Kami juga akan menyampaikan atau membagikan informasi kegiatan maupun pemberitaan terkait kegiatan Imigrasi Depok kepada MT Balwan," tuturnya.</p>
              - generic [ref=f8e1788]: <!-- /wp:paragraph -->
              - generic [ref=f8e1789]: <!-- wp:paragraph -->
              - generic [ref=f8e1790]: <p>Tak hanya itu, Herlina menyatakan pihak Imigrasi Depok berupaya untuk menghadiri kegiatan pengajian rutin yang diselenggarakan MT. Balwan Kota Depok apabila terdapat kesempatan.</p>
              - generic [ref=f8e1791]: <!-- /wp:paragraph -->
              - generic [ref=f8e1792]: <!-- wp:paragraph -->
              - generic [ref=f8e1793]: <p>"Insyaallah kalau ada waktu, kami dari Imigrasi Depok, baik kepala maupun perwakilan, akan menghadiri pengajian rutin MT. Balwan Kota Depok. Kantor Imigrasi Depok juga siap berkolaborasi," ungkapnya.</p>
              - generic [ref=f8e1794]: <!-- /wp:paragraph -->
              - generic [ref=f8e1795]: <!-- wp:paragraph -->
              - generic [ref=f8e1796]: <p>Pertemuan tersebut diharapkan menjadi awal terbangunnya sinergi yang lebih erat antara MT. Balwan Kota Depok dan Kantor Imigrasi Kelas I Non TPI Depok, baik dalam bidang komunikasi publik, penyebaran informasi, maupun kegiatan sosial dan keagamaan.</p>
              - generic [ref=f8e1797]: <!-- /wp:paragraph -->
              - generic [ref=f8e1798]: <!-- wp:paragraph -->
              - generic [ref=f8e1799]: <p>Dengan komunikasi yang semakin terbuka, kedua pihak diharapkan dapat memberikan kontribusi positif bagi masyarakat Kota Depok melalui informasi yang edukatif, kegiatan yang bermanfaat, serta kolaborasi yang berkelanjutan.<br></p>
              - generic [ref=f8e1800]: <!-- /wp:paragraph -->
              - generic [ref=f8e1801]: "<!-- wp:image {\"id\":1092,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
