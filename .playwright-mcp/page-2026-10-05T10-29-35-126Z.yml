              - generic [ref=f8e1840]: <p>Pertemuan tersebut diharapkan menjadi awal terbangunnya sinergi yang lebih erat antara MT. Balwan Kota Depok dan Kantor Imigrasi Kelas I Non TPI Depok, baik dalam bidang komunikasi publik, penyebaran informasi, maupun kegiatan sosial dan keagamaan.</p>
              - generic [ref=f8e1841]: <!-- /wp:paragraph -->
              - generic [ref=f8e1842]: <!-- wp:paragraph -->
              - generic [ref=f8e1843]: <p>Dengan komunikasi yang semakin terbuka, kedua pihak diharapkan dapat memberikan kontribusi positif bagi masyarakat Kota Depok melalui informasi yang edukatif, kegiatan yang bermanfaat, serta kolaborasi yang berkelanjutan.<br></p>
              - generic [ref=f8e1844]: <!-- /wp:paragraph -->
              - generic [ref=f8e1845]: "<!-- wp:image {\"id\":1092,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
