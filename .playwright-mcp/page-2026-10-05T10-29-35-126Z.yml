            - code [ref=f8e328]:
              - generic [ref=f8e329]: "insert into `cache` (`expiration`, `key`, `value`) values (1791199751, 'newsmedia-cache-homepage_latest_articles', 'O:39:\"Illuminate\\Database\\Eloquent\\Collection\":2:{s:8:\"*items\";a:20:{i:0;O:18:\"App\\Models\\Article\":34:{s:13:\"*connection\";s:5:\"mysql\";s:8:\"*table\";s:8:\"articles\";s:13:\"*primaryKey\";s:2:\"id\";s:10:\"*keyType\";s:3:\"int\";s:12:\"incrementing\";b:1;s:7:\"*with\";a:0:{}s:12:\"*withCount\";a:0:{}s:19:\"preventsLazyLoading\";b:0;s:10:\"*perPage\";i:15;s:6:\"exists\";b:1;s:18:\"wasRecentlyCreated\";b:0;s:28:\"*escapeWhenCastingToString\";b:0;s:13:\"*attributes\";a:30:{s:2:\"id\";i:901;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:65:\"TAK HANYA MENULIS BERITA WARTAWAN DEPOK GELAR MAULID DAN SANTUNAN\";s:4:\"slug\";s:65:\"tak-hanya-menulis-berita-wartawan-depok-gelar-maulid-dan-santunan\";s:7:\"excerpt\";s:411:\"Dengan Mengusung tema 'Meneladani Akhlak Rasulullah SAW dalam Merajut Persatuan dan Kesatuan', Majelis Taklim Balai Wartawan Kota Depok menggelar peringatan Maulid Nabi Muhammad SAW dan santunan yatim serta dhuafa, kegiatan tersebut menjadi semangat ruang dalam menyampaikan informasi para waratawan yang tergabung di MT. Balai Wartawan Kota Depok untuk ikut menebarkan nilai-nilai kebaikan di tengah masyarakat\";s:7:\"content\";s:6539:\"<?xml encoding=\"UTF-8\"><?xml encoding=\"UTF-8\"><!-- wp:paragraph --><p>-PANMAS, DEPOK- Dengan Mengusung tema 'Meneladani Akhlak Rasulullah SAW dalam Merajut Persatuan dan Kesatuan', Majelis Taklim Balai Wartawan Kota Depok menggelar peringatan Maulid Nabi Muhammad SAW dan santunan yatim serta dhuafa, kegiatan tersebut menjadi semangat ruang dalam menyampaikan informasi para waratawan yang tergabung di MT. Balai Wartawan Kota Depok untuk ikut menebarkan nilai-nilai kebaikan di tengah masyarakat</p>"
              - generic [ref=f8e330]: <!-- /wp:paragraph -->
              - generic [ref=f8e331]: "<!-- wp:image {\"id\":1168,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e332]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/483cdd6b-9dc1-420a-a69e-7fb50209a88a-1024x768.jpeg" alt="" class="wp-image-1168"></figure>
              - generic [ref=f8e333]: <!-- /wp:image -->
              - generic [ref=f8e334]: <!-- wp:paragraph -->
              - generic [ref=f8e335]: <p>Kegiatan yang berlangsung di Balai Rakyat Depok 1, pada Kamis (24/09/2026) dihadiri oleh Sejumlah tokoh agama dan masyarakat turut hadir, Ketua DPRD Kota Depok, Ade Supriyatna, Kadiskominfo Kota Depok, Manto, Wakil Ketua Umum MUI Kota Depok KH. Nurwahidin, Ketua MUI Pancoran Mas KH. Arief Rahman Hakim, dan Ketua MUI Beji KH. Hafiduddin.</p>
              - generic [ref=f8e336]: <!-- /wp:paragraph -->
              - generic [ref=f8e337]: <!-- wp:paragraph -->
              - generic [ref=f8e338]: <p>Hadir pula Direktur Operasional Adeem Tours Haji Erik Saputra, Polsek Pancoran Mas, Kodim 0508 Depok, KONI Kota Depok, Kantor Imigrasi Depok,&nbsp; Kecamatan Pancoran Mas, Kecamatan Beji, Lurah Depok, Lurah Depok Jaya, Ketua PWI Kota Depok, Rusdy Nurdiansyah, Ketua DPD Forkabi Depok Edi Dadang Chandra (Barok) dan ratusan jamaah dari berbagai Majelis Taklim serta para wartawan.</p>
              - generic [ref=f8e339]: <!-- /wp:paragraph -->
              - generic [ref=f8e340]: <!-- wp:paragraph -->
              - generic [ref=f8e341]: <p>Ketua DPRD Kota Depok, Ade Supriyatna memberikan apresiasi atas terselenggaranya kegiatan Maulid Nabi dan santunan tersebut. Dirinya menyatakan dukungannya terhadap berbagai kegiatan positif yang dilakukan masyarakat, khususnya kegiatan yang mendorong penguatan nilai keagamaan dan kepedulian sosial.</p>
              - generic [ref=f8e342]: <!-- /wp:paragraph -->
              - generic [ref=f8e343]: <!-- wp:paragraph -->
              - generic [ref=f8e344]: <p>Ade juga mengajak seluruh elemen masyarakat bersama-sama menjaga Kota Depok dari berbagai bentuk kemaksiatan.</p>
              - generic [ref=f8e345]: <!-- /wp:paragraph -->
              - generic [ref=f8e346]: <!-- wp:paragraph -->
              - generic [ref=f8e347]: <p>"Jauhkan Depok dari kemaksiatan," pesannya.</p>
              - generic [ref=f8e348]: <!-- /wp:paragraph -->
              - generic [ref=f8e349]: <!-- wp:paragraph -->
              - generic [ref=f8e350]: <p>Dikatakan Ade, kegiatan keagamaan seperti Maulid Nabi yang dilaksanakan oleh Majelis Taklim Balai Wartawan Kota Depok dapat menjadi salah satu sarana memperkuat akhlak dan membangun lingkungan masyarakat yang lebih baik.</p>
              - generic [ref=f8e351]: <!-- /wp:paragraph -->
              - generic [ref=f8e352]: <!-- wp:paragraph -->
              - generic [ref=f8e353]: <p>"Apresiasi buat para wartawan yang tergabung di Majelis Taklim Balai Wartawan Kota Depok yang terus tanpa henti melakukan syiar kebaikan baik dalam tindakan maupun tulisan," katanya.</p>
              - generic [ref=f8e354]: <!-- /wp:paragraph -->
              - generic [ref=f8e355]: <!-- wp:paragraph -->
              - generic [ref=f8e356]: <p>Sementara itu, Ketua Majelis Taklim Balai Wartawan Kota Depok, Adie Rakasiwi mengatakan, majelis taklim menjadi salah satu wadah bagi keluarga wartawan untuk turut mengambil bagian dalam dakwah Islam.</p>
              - generic [ref=f8e357]: <!-- /wp:paragraph -->
              - generic [ref=f8e358]: <!-- wp:paragraph -->
              - generic [ref=f8e359]: <p>Menurutnya, profesi wartawan tidak hanya berkaitan dengan aktivitas jurnalistik. Wartawan juga dapat berkontribusi melalui kegiatan sosial dan keagamaan yang memberikan manfaat langsung kepada masyarakat.</p>
              - generic [ref=f8e360]: <!-- /wp:paragraph -->
              - generic [ref=f8e361]: <!-- wp:paragraph -->
              - generic [ref=f8e362]: <p>"Kami akan terus memperbaiki diri dan melakukan syiar dakwah yang positif," ujar Adie Rakasiwi.</p>
              - generic [ref=f8e363]: <!-- /wp:paragraph -->
              - generic [ref=f8e364]: <!-- wp:paragraph -->
              - generic [ref=f8e365]: <p>Ia menyampaikan terima kasih kepada seluruh jamaah yang hadir, Pemkot Kota Depok, Stakeholder serta para donatur, yang telah berpartisipasi mendukung terselenggaranya Maulid Nabi dan santunan tersebut.</p>
              - generic [ref=f8e366]: <!-- /wp:paragraph -->
              - generic [ref=f8e367]: <!-- wp:paragraph -->
              - generic [ref=f8e368]: <p>"Terima kasih untuk semuanya yang mensupport serta berpartisipasi pada kegiatan Maulid Nabi dan Santunan Anak Yatim serta Dhuafa sebanyak 68 orang yang disantuni," jelasnya.</p>
              - generic [ref=f8e369]: <!-- /wp:paragraph -->
              - generic [ref=f8e370]: <!-- wp:paragraph -->
              - generic [ref=f8e371]: <p>Sedangkan Kepala Dinas Komunikasi dan Informatika (Diskominfo) Kota Depok, Manto memberikan apresiasi terhadap kegiatan yang diselenggarakan Majelis Taklim Balai Wartawan Kota Depok, menurutnya, Pemerintah Kota Depok mendorong setiap lembaga untuk terus bersemangat dalam mensyiarkan dakwah Islam di tengah masyarakat.</p>
              - generic [ref=f8e372]: <!-- /wp:paragraph -->
              - generic [ref=f8e373]: <!-- wp:paragraph -->
              - generic [ref=f8e374]: <p>"Termasuk kalangan wartawan, memiliki ruang untuk ikut menyampaikan pesan-pesan kebaikan dan membangun masyarakat," katanya menyampaikan pesan dari Wali Kota Depok, Supian Suri.</p>
              - generic [ref=f8e375]: <!-- /wp:paragraph -->
              - generic [ref=f8e376]: <!-- wp:paragraph -->
              - generic [ref=f8e377]: <p>Manto juga menilai momentum Maulid Nabi dapat menjadi ruang untuk melakukan evaluasi diri sekaligus meningkatkan persatuan dan kebersamaan.</p>
              - generic [ref=f8e378]: <!-- /wp:paragraph -->
              - generic [ref=f8e379]: <!-- wp:paragraph -->
              - generic [ref=f8e380]: <p>"Mari kita jaga persatuan dan kebersamaan ditengah kemajemukan yang ada dengan terus menebar syiar kebaikan," terangnya.</p>
              - generic [ref=f8e381]: <!-- /wp:paragraph -->
              - generic [ref=f8e382]: <!-- wp:paragraph -->
              - generic [ref=f8e383]: <p>Penceramah KH. Fatkhuri Wahmad yang juga pengasuh Padepokan Islam Nusantara (PIN) Al Bahrain, Cipayung, mengingatkan jamaah, bahwa Nabi Muhammad SAW merupakan teladan utama bagi umat Islam.</p>
              - generic [ref=f8e384]: <!-- /wp:paragraph -->
              - generic [ref=f8e385]: <!-- wp:paragraph -->
              - generic [ref=f8e386]: <p>Ia mengajak jamaah untuk melakukan yang terbaik dalam kehidupan serta menjauhi perbuatan yang dapat membuat Rasulullah SAW malu terhadap perilaku umatnya.</p>
              - generic [ref=f8e387]: <!-- /wp:paragraph -->
              - generic [ref=f8e388]: <!-- wp:paragraph -->
              - generic [ref=f8e389]: <p>"Perbanyak shalawat Nabi dan jadilah umat terbaik," ucapnya.</p>
              - generic [ref=f8e390]: <!-- /wp:paragraph -->
              - generic [ref=f8e391]: <!-- wp:paragraph -->
              - generic [ref=f8e392]: <p>Ia menekankan, kecintaan kepada Rasulullah SAW tidak cukup hanya diungkapkan melalui peringatan Maulid. Kecintaan tersebut perlu diwujudkan dengan meneladani akhlak Nabi dalam kehidupan sehari-hari.</p>
              - generic [ref=f8e393]: <!-- /wp:paragraph -->
              - generic [ref=f8e394]: <!-- wp:paragraph -->
              - generic [ref=f8e395]: <p>"Kegiatan keagamaan seperti Maulid Nabi yang diadakan oleh Majelis Taklim Balai Wartawan Kota Depok dapat menjadi salah satu sarana memperkuat akhlak dan membangun lingkungan masyarakat yang lebih baik," pungkasnya.</p>
              - generic [ref=f8e396]: <!-- /wp:paragraph -->
              - generic [ref=f8e397]: <!-- wp:paragraph -->
              - generic [ref=f8e398]: <p>Melalui kegiatan tersebut, Majelis Taklim Balai Wartawan Kota Depok menegaskan komitmennya untuk menjadikan majelis taklim sebagai ruang silaturahmi, dakwah, dan kepedulian sosial.</p>
              - generic [ref=f8e399]: <!-- /wp:paragraph -->
              - generic [ref=f8e400]: <!-- wp:paragraph -->
              - generic [ref=f8e401]: <p>Semangat Maulid Nabi diharapkan tidak berhenti pada seremoni, tetapi berlanjut dalam kehidupan melalui keteladanan akhlak Rasulullah SAW, kepedulian terhadap sesama, dan upaya merajut persatuan. </p>
