              - generic [ref=f8e1138]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_4891-1024x768.jpeg" alt="" class="wp-image-1122"/></figure>
              - generic [ref=f8e1139]: <!-- /wp:image -->
              - generic [ref=f8e1140]: <!-- wp:paragraph -->
              - generic [ref=f8e1141]: <p>*Depok, Program *Takhassus Tafsir dan Ilmu Tafsir Pendidikan Kader Ulama MUI Kota Depok* resmi dibuka pada <em>Senin, 14 September 2026</em> bertempat di <em>Gedung Dakwah MUI Kota Depok</em>.</p>
              - generic [ref=f8e1142]: <!-- /wp:paragraph -->
              - generic [ref=f8e1143]: <!-- wp:paragraph -->
              - generic [ref=f8e1144]: <p>Acara pembukaan dipimpin langsung oleh <em>KH. Syihabuddin Ahmad</em> selaku Ketua Umum MUI Kota Depok, didampingi oleh <em>Syahroni Rofii</em> selaku Ketua Komisi PKU Pendidikan Kader Ulama MUI Kota Depok.</p>
              - generic [ref=f8e1145]: <!-- /wp:paragraph -->
              - generic [ref=f8e1146]: <!-- wp:paragraph -->
              - generic [ref=f8e1147]: <p>Kegiatan ini disiarkan langsung melalui <em>Akun YouTube MUI Depok TV</em> sehingga dapat diikuti oleh masyarakat luas.</p>
              - generic [ref=f8e1148]: <!-- /wp:paragraph -->
              - generic [ref=f8e1149]: <!-- wp:paragraph -->
              - generic [ref=f8e1150]: <p><em>Materi Inti Hari Pertama</em> yaitu Visi dan Misi MUI Depok serta Peran Mufassir dalam Kehidupan Keislaman di Depok</p>
              - generic [ref=f8e1151]: <!-- /wp:paragraph -->
              - generic [ref=f8e1152]: <!-- wp:paragraph -->
              - generic [ref=f8e1153]: "<p>Materi Kedua*<br>Disampaikan oleh <em>KH. Dr. Ahmad Dimyathi Badruzzaman, M.A.</em> Wakil Ketua Dewan Pertimbangan MUI Kota Depok, didampingi <em>KH. Lutfi</em> Alumni PKU MUI Depok.<br><em>Tema</em>: <em>“Urgensi Tafsir, Syarat-syarat dan Adab-adab Mufassir”</em></p>"
              - generic [ref=f8e1154]: <!-- /wp:paragraph -->
              - generic [ref=f8e1155]: "<!-- wp:image {\"id\":1123,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e1156]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/8D0BF856-C0D1-4027-91C3-A0523759DEE8-1024x576.jpeg" alt="" class="wp-image-1123"/></figure>
              - generic [ref=f8e1157]: <!-- /wp:image -->
              - generic [ref=f8e1158]: "<!-- wp:image {\"id\":1124,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e1159]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_4906-1024x768.jpeg" alt="" class="wp-image-1124"/></figure>
              - generic [ref=f8e1160]: <!-- /wp:image -->
              - generic [ref=f8e1161]: <!-- wp:paragraph -->
              - generic [ref=f8e1162]: "<p>Materi Ketiga PKU Takhassus Tafsir &amp; Ilmu Tafsir*<br>Disampaikan oleh <em>Dr. Mahmoud Ali Ghomaa Afifi</em> Dosen UIII asal Mesir, Alumni PhD University of Leicester UK, didampingi <em>Dr. KH. Mughzi Abdillah</em> Alumni Ankara University Turkiye.<br><em>Tema</em>: <em>مذاهب التفسير في مصر؛ السنة، الشيعة، المعتزلة، السلفية، الوهابية</em><br><em>“Madzhahib At-Tafsir fi Mishr: As-Sunnah, Asy-Syi’ah, Al-Mu’tazilah, As-Salafiyah, Al-Wahhabiyah”</em><br>Lalu Materi Keempat*<br>Disampaikan oleh <em>Dr. K.H. Encep Hidayat, M.A.</em>, didampingi <em>Kostia Permana, S.E.</em> Sekretaris MUI Kota Depok.<br><em>Tema</em>: <em>“Tafsir Maqasidi; Batasan-batasannya dan Penerapannya dalam Isu-isu Kontemporer”</em><br><em>اﻟﺘﻔﺴﯿﺮ اﻟﻤﻘﺎﺻﺪي؛ ﺿﻮاﺑﻄﮫ وﺗﻄﺒﯿﻘﺎﺗﮫ ﻓﻲ ﻗﻀﺎﯾﺎ ﻣﻌﺎﺻﺮة</em></p>"
              - generic [ref=f8e1163]: <!-- /wp:paragraph -->
              - generic [ref=f8e1164]: <!-- wp:paragraph -->
              - generic [ref=f8e1165]: <p>Program Takhassus ini merupakan bagian dari upaya MUI Kota Depok dalam mencetak kader ulama yang kompeten di bidang tafsir dan ilmu tafsir, untuk menjawab tantangan keumatan dan isu-isu kontemporer dengan landasan Al-Qur’an.</p>
              - generic [ref=f8e1166]: <!-- /wp:paragraph -->
              - generic [ref=f8e1167]: "<!-- wp:image {\"id\":1125,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e1168]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_4897-1024x473.png" alt="" class="wp-image-1125"/></figure>
              - generic [ref=f8e1169]: <!-- /wp:image -->
              - generic [ref=f8e1170]: <!-- wp:paragraph -->
              - generic [ref=f8e1171]: <p>Acara berlangsung khidmat dan dihadiri oleh para peserta PKU, pengurus MUI Kota Depok, serta pemirsa daring melalui siaran langsung MUI Depok TV.</p>
