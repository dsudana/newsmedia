uled_at\";i:13;s:11:\"views_count\";i:14;s:11:\"is_featured\";i:15;s:9:\"read_time\";i:16;s:10:\"word_count\";i:17;s:11:\"ai_provider\";i:18;s:9:\"seo_score\";}s:10:\"*guarded\";a:1:{i:0;s:1:\"*\";}s:16:\"*forceDeleting\";b:0;}i:3;O:18:\"App\\Models\\Article\":34:{s:13:\"*connection\";s:5:\"mysql\";s:8:\"*table\";s:8:\"articles\";s:13:\"*primaryKey\";s:2:\"id\";s:10:\"*keyType\";s:3:\"int\";s:12:\"incrementing\";b:1;s:7:\"*with\";a:0:{}s:12:\"*withCount\";a:0:{}s:19:\"preventsLazyLoading\";b:0;s:10:\"*perPage\";i:15;s:6:\"exists\";b:1;s:18:\"wasRecentlyCreated\";b:0;s:28:\"*escapeWhenCastingToString\";b:0;s:13:\"*attributes\";a:30:{s:2:\"id\";i:898;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:140:\"HARI KE-3 TAKHASSUS TAFSIR PKU MUI KOTA DEPOK MAKIN BERGENGSI, HADIRKAN TGB ZAINUL MAJDI HINGGA BAHAS TAFSIR ILMIAH &amp; PENTASHIHAN MUSHAF\";s:4:\"slug\";s:133:\"hari-ke-3-takhassus-tafsir-pku-mui-kota-depok-makin-bergengsi-hadirkan-tgb-zainul-majdi-hingga-bahas-tafsir-ilmiah-pentashihan-mushaf\";s:7:\"excerpt\";s:0:\"\";s:7:\"content\";s:5536:\"<!-- wp:paragraph -->"
              - generic [ref=f8e678]: <p><em>DEPOK, Takhassus Tafsir dan Ilmu Tafsir Pendidikan Kader Ulama (PKU) MUI Kota Depok</em> yang digelar pada <em>Rabu, 16 September 2026</em> berlangsung meriah dan penuh antusiasme. Memasuki hari ketiga, program ini semakin bergengsi dengan hadirnya narasumber tokoh nasional.</p>
              - generic [ref=f8e679]: <!-- /wp:paragraph -->
              - generic [ref=f8e680]: <!-- wp:paragraph -->
              - generic [ref=f8e681]: <p>Kegiatan yang dipusatkan di Gedung Dakwah MUI Kota Depok ini dimoderatori oleh <em>Dr. KH. Sya’roni Rofi’i</em>, Komisi PKU MUI Kota Depok, Alumni PhD Marmara University Turkiye.</p>
              - generic [ref=f8e682]: <!-- /wp:paragraph -->
              - generic [ref=f8e683]: "<!-- wp:image {\"id\":1138,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e684]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_4956-1024x768.jpeg" alt="" class="wp-image-1138"/></figure>
              - generic [ref=f8e685]: <!-- /wp:image -->
              - generic [ref=f8e686]: <!-- wp:paragraph -->
              - generic [ref=f8e687]: "<p><em>SESI UTAMA: Tokoh Nasional TGB Zainul Majdi</em></p>"
              - generic [ref=f8e688]: <!-- /wp:paragraph -->
              - generic [ref=f8e689]: <!-- wp:paragraph -->
              - generic [ref=f8e690]: <p>Sesi utama menghadirkan <em>Mantan Gubernur NTB, TGB Tuan Guru Bajang Dr. TGB. Muhammad Zainul Majdi</em>, Ketua Alumni Al-Azhar Indonesia, Rektor Institut Agama Islam Hamzanwadi.</p>
              - generic [ref=f8e691]: <!-- /wp:paragraph -->
              - generic [ref=f8e692]: <!-- wp:paragraph -->
              - generic [ref=f8e693]: <p><em>Tema:</em> <em>Ilmu Tafsir; Lingkupnya (Kriteria/Kaidah) dan Hubungannya dengan Ilmu-ilmu Humaniora Modern</em></p>
              - generic [ref=f8e694]: <!-- /wp:paragraph -->
              - generic [ref=f8e695]: <!-- wp:paragraph -->
              - generic [ref=f8e696]: <p>TGB membedah secara tuntas:</p>
              - generic [ref=f8e697]: <!-- /wp:paragraph -->
              - generic [ref=f8e698]: <!-- wp:list -->
              - generic [ref=f8e699]: <ul class="wp-block-list"><!-- wp:list-item -->
              - generic [ref=f8e700]: <li><em>Epistemologi Ilmu Tafsir (<code>Dhawabit al-Mufassir</code>):</em> Kaidah-kaidah baku yang menjadi pondasi penafsiran.</li>
              - generic [ref=f8e701]: <!-- /wp:list-item -->
              - generic [ref=f8e702]: <!-- wp:list-item -->
              - generic [ref=f8e703]: <li><em>Syarat Legalitas Mufassir (<code>Syurut al-Mufassir</code>):</em> Kriteria ketat siapa yang layak menafsirkan Al-Qur'an.</li>
              - generic [ref=f8e704]: <!-- /wp:list-item -->
              - generic [ref=f8e705]: <!-- wp:list-item -->
              - generic [ref=f8e706]: <li><em>Demarkasi Ilmiah:</em> Batas tegas antara tafsir ilmiah yang valid dengan <em>al-istinbath al-murtajal</em> (penafsiran reaktif / tanpa kaidah).</li>
              - generic [ref=f8e707]: <!-- /wp:list-item --></ul>
              - generic [ref=f8e708]: <!-- /wp:list -->
              - generic [ref=f8e709]: <!-- wp:paragraph -->
              - generic [ref=f8e710]: <p>Lebih dari itu, materi mengeksplorasi titik temu dan integrasi metodologis antara ilmu turats (<code>Ulum al-Qur'an</code>) dengan pendekatan ilmu-ilmu humaniora modern seperti sosiologi, antropologi, dan linguistik, guna membaca problematika masyarakat urban tanpa mengorbankan keotentikan teks.</p>
              - generic [ref=f8e711]: <!-- /wp:paragraph -->
              - generic [ref=f8e712]: <!-- wp:paragraph -->
              - generic [ref=f8e713]: "<p><em>SESI LANJUTAN 1: Tafsir Ilmiah - Bedah Kasus Kekinian</em></p>"
              - generic [ref=f8e714]: <!-- /wp:paragraph -->
              - generic [ref=f8e715]: <!-- wp:paragraph -->
              - generic [ref=f8e716]: <p>Agenda berikutnya disampaikan oleh <em>Dr. KH. Ahmad Fikhri, Lc., MA</em> Sekretaris Umum MUI Kota Depok, didampingi <em>KH. Ahmad Jalaludin Kamal</em> Komisi PKU MUI Depok.</p>
              - generic [ref=f8e717]: <!-- /wp:paragraph -->
              - generic [ref=f8e718]: "<!-- wp:image {\"id\":1139,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e719]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_5004-1024x768.jpeg" alt="" class="wp-image-1139"/></figure>
              - generic [ref=f8e720]: <!-- /wp:image -->
              - generic [ref=f8e721]: <!-- wp:paragraph -->
              - generic [ref=f8e722]: <p><em>Tema:</em> <em>Tafsir Ilmiah antara Pendukung dan Pengkritiknya; Metodologi dan Contoh Kasus</em></p>
              - generic [ref=f8e723]: <!-- /wp:paragraph -->
              - generic [ref=f8e724]: <!-- wp:paragraph -->
              - generic [ref=f8e725]: <p>Pada sesi ini, peserta dibagi menjadi beberapa kelompok studi kasus untuk membedah ayat secara ilmiah:</p>
              - generic [ref=f8e726]: <!-- /wp:paragraph -->
              - generic [ref=f8e727]: "<!-- wp:list {\"ordered\":true} -->"
              - generic [ref=f8e728]: <ol class="wp-block-list"><!-- wp:list-item -->
              - generic [ref=f8e729]: "<li><em>Sidik Jari Manusia &amp; Identitas Seseorang</em> [QS. Al-Qiyamah: 1-4]</li>"
              - generic [ref=f8e730]: <!-- /wp:list-item -->
              - generic [ref=f8e731]: <!-- wp:list-item -->
              - generic [ref=f8e732]: "<li><em>Proses Penciptaan Manusia</em> <em>Nuthfah, Alaqah, Mudhghah</em> [QS. Al-Mu'minun: 12-14]</li>"
              - generic [ref=f8e733]: <!-- /wp:list-item -->
              - generic [ref=f8e734]: <!-- wp:list-item -->
              - generic [ref=f8e735]: "<li><em>Teori Big Bang dan Langit yang Mengembang</em> [QS. Adz-Dzariyat: 47]</li>"
              - generic [ref=f8e736]: <!-- /wp:list-item -->
              - generic [ref=f8e737]: <!-- wp:list-item -->
              - generic [ref=f8e738]: "<li><em>Larangan Menikahi Saudara Sepersusuan</em> [QS. An-Nisa: 23]</li>"
              - generic [ref=f8e739]: <!-- /wp:list-item -->
              - generic [ref=f8e740]: <!-- wp:list-item -->
              - generic [ref=f8e741]: "<li><em>Diharamkannya Darah</em> [QS. Al-Baqarah: 173]</li>"
              - generic [ref=f8e742]: <!-- /wp:list-item --></ol>
              - generic [ref=f8e743]: <!-- /wp:list -->
              - generic [ref=f8e744]: <!-- wp:paragraph -->
              - generic [ref=f8e745]: <p>Metode diskusi kelompok ini membuat peserta aktif menganalisis hubungan antara nash Al-Qur'an dengan temuan sains modern.</p>
              - generic [ref=f8e746]: <!-- /wp:paragraph -->
              - generic [ref=f8e747]: <!-- wp:paragraph -->
              - generic [ref=f8e748]: "<p><em>SESI LANJUTAN: Pentashihan Mushaf Al-Qur'an</em></p>"
              - generic [ref=f8e749]: <!-- /wp:paragraph -->
              - generic [ref=f8e750]: <!-- wp:paragraph -->
              - generic [ref=f8e751]: <p>Sesi pamungkas hari ketiga disampaikan oleh <em>KH. Jazim Hamidi, MA</em> Ketua MUI Kota Depok, didampingi <em>KH. Abdul Muhyi</em> Ketua Wasilah PKU MUI Kota Depok.</p>
              - generic [ref=f8e752]: <!-- /wp:paragraph -->
              - generic [ref=f8e753]: <!-- wp:paragraph -->
              - generic [ref=f8e754]: <p><em>Tema:</em> <em>Pentashihan Mushaf Al-Qur'an dan Penerjemahannya</em></p>
              - generic [ref=f8e755]: <!-- /wp:paragraph -->
              - generic [ref=f8e756]: "<!-- wp:image {\"id\":1147,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e757]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_5007-4-1024x768.jpeg" alt="" class="wp-image-1147"/></figure>
              - generic [ref=f8e758]: <!-- /wp:image -->
              - generic [ref=f8e759]: <!-- wp:paragraph -->
              - generic [ref=f8e760]: <p>Substansi kajian mengulas kelembagaan dan metodologi pentashihan Mushaf Al-Qur'an di Indonesia. Dibahas secara detail regulasi, standar Rasm Utsmani, rincian proses standardisasi terjemahan Al-Qur'an Kementerian Agama, serta tantangan menjaga akurasi teks dan makna terjemahan di tengah perkembangan teknologi cetak dan digital.</p>
              - generic [ref=f8e761]: <!-- /wp:paragraph -->
              - generic [ref=f8e762]: <!-- wp:paragraph -->
              - generic [ref=f8e763]: <p>Dengan rangkaian materi yang semakin berbobot, Program Takhassus Tafsir PKU MUI Kota Depok diharapkan mampu mencetak kader ulama yang faqih, moderat, dan mampu menjawab tantangan zaman.</p>
              - generic [ref=f8e764]: "<!-- /wp:paragraph -->\";s:14:\"featured_image\";s:157:\"articles/hari-ke-3-takhassus-tafsir-pku-mui-kota-depok-makin-bergengsi-hadirkan-tgb-zainul-majdi-hingga-bahas-tafsir-ilmiah-pentashihan-mushaf-1790924829.jpg\";s:10:\"meta_title\";s:140:\"HARI KE-3 TAKHASSUS TAFSIR PKU MUI KOTA DEPOK MAKIN BERGENGSI, HADIRKAN TGB ZAINUL MAJDI HINGGA BAHAS TAFSIR ILMIAH &amp; PENTASHIHAN MUSHAF\";s:16:\"meta_description\";s:0:\"\";s:11:\"schema_type\";s:7:\"Article\";s:6:\"status\";s:9:\"published\";s:12:\"published_at\";s:19:\"2026-09-16 21:46:26\";s:12:\"scheduled_at\";N;s:11:\"views_count\";i:12;s:9:\"read_time\";i:2;s:10:\"word_count\";i:395;s:11:\"ai_provider\";N;s:9:\"seo_score\";i:0;s:11:\"is_featured\";i:0;s:11:\"is_breaking\";i:0;s:11:\"is_headline\";i:0;s:4:\"tags\";N;s:8:\"location\";N;s:11:\"series_name\";N;s:12:\"series_order\";N;s:10:\"deleted_at\";N;s:10:\"created_at\";s:19:\"2026-10-02 07:07:09\";s:10:\"updated_at\";s:19:\"2026-10-05 06:52:43\";}s:11:\"*original\";a:30:{s:2:\"id\";i:898;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:140:\"HARI KE-3 TAKHASSUS TAFSIR PKU MUI KOTA DEPOK MAKIN BERGENGSI, HADIRKAN TGB ZAINUL MAJDI HINGGA BAHAS TAFSIR ILMIAH &amp; PENTASHIHAN MUSHAF\";s:4:\"slug\";s:133:\"hari-ke-3-takhassus-tafsir-pku-mui-kota-depok-makin-bergengsi-hadirkan-tgb-zainul-majdi-hingga-bahas-tafsir-ilmiah-pentashihan-mushaf\";s:7:\"excerpt\";s:0:\"\";s:7:\"content\";s:5536:\"<!-- wp:paragraph -->"
              - generic [ref=f8e765]: <p><em>DEPOK, Takhassus Tafsir dan Ilmu Tafsir Pendidikan Kader Ulama (PKU) MUI Kota Depok</em> yang digelar pada <em>Rabu, 16 September 2026</em> berlangsung meriah dan penuh antusiasme. Memasuki hari ketiga, program ini semakin bergengsi dengan hadirnya narasumber tokoh nasional.</p>
              - generic [ref=f8e766]: <!-- /wp:paragraph -->
              - generic [ref=f8e767]: <!-- wp:paragraph -->
              - generic [ref=f8e768]: <p>Kegiatan yang dipusatkan di Gedung Dakwah MUI Kota Depok ini dimoderatori oleh <em>Dr. KH. Sya’roni Rofi’i</em>, Komisi PKU MUI Kota Depok, Alumni PhD Marmara University Turkiye.</p>
              - generic [ref=f8e769]: <!-- /wp:paragraph -->
              - generic [ref=f8e770]: "<!-- wp:image {\"id\":1138,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e771]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_4956-1024x768.jpeg" alt="" class="wp-image-1138"/></figure>
              - generic [ref=f8e772]: <!-- /wp:image -->
              - generic [ref=f8e773]: <!-- wp:paragraph -->
              - generic [ref=f8e774]: "<p><em>SESI UTAMA: Tokoh Nasional TGB Zainul Majdi</em></p>"
              - generic [ref=f8e775]: <!-- /wp:paragraph -->
              - generic [ref=f8e776]: <!-- wp:paragraph -->
              - generic [ref=f8e777]: <p>Sesi utama menghadirkan <em>Mantan Gubernur NTB, TGB Tuan Guru Bajang Dr. TGB. Muhammad Zainul Majdi</em>, Ketua Alumni Al-Azhar Indonesia, Rektor Institut Agama Islam Hamzanwadi.</p>
              - generic [ref=f8e778]: <!-- /wp:paragraph -->
              - generic [ref=f8e779]: <!-- wp:paragraph -->
              - generic [ref=f8e780]: <p><em>Tema:</em> <em>Ilmu Tafsir; Lingkupnya (Kriteria/Kaidah) dan Hubungannya dengan Ilmu-ilmu Humaniora Modern</em></p>
              - generic [ref=f8e781]: <!-- /wp:paragraph -->
              - generic [ref=f8e782]: <!-- wp:paragraph -->
              - generic [ref=f8e783]: <p>TGB membedah secara tuntas:</p>
              - generic [ref=f8e784]: <!-- /wp:paragraph -->
              - generic [ref=f8e785]: <!-- wp:list -->
              - generic [ref=f8e786]: <ul class="wp-block-list"><!-- wp:list-item -->
              - generic [ref=f8e787]: <li><em>Epistemologi Ilmu Tafsir (<code>Dhawabit al-Mufassir</code>):</em> Kaidah-kaidah baku yang menjadi pondasi penafsiran.</li>
              - generic [ref=f8e788]: <!-- /wp:list-item -->
              - generic [ref=f8e789]: <!-- wp:list-item -->
              - generic [ref=f8e790]: <li><em>Syarat Legalitas Mufassir (<code>Syurut al-Mufassir</code>):</em> Kriteria ketat siapa yang layak menafsirkan Al-Qur'an.</li>
              - generic [ref=f8e791]: <!-- /wp:list-item -->
              - generic [ref=f8e792]: <!-- wp:list-item -->
              - generic [ref=f8e793]: <li><em>Demarkasi Ilmiah:</em> Batas tegas antara tafsir ilmiah yang valid dengan <em>al-istinbath al-murtajal</em> (penafsiran reaktif / tanpa kaidah).</li>
              - generic [ref=f8e794]: <!-- /wp:list-item --></ul>
              - generic [ref=f8e795]: <!-- /wp:list -->
              - generic [ref=f8e796]: <!-- wp:paragraph -->
              - generic [ref=f8e797]: <p>Lebih dari itu, materi mengeksplorasi titik temu dan integrasi metodologis antara ilmu turats (<code>Ulum al-Qur'an</code>) dengan pendekatan ilmu-ilmu humaniora modern seperti sosiologi, antropologi, dan linguistik, guna membaca problematika masyarakat urban tanpa mengorbankan keotentikan teks.</p>
              - generic [ref=f8e798]: <!-- /wp:paragraph -->
              - generic [ref=f8e799]: <!-- wp:paragraph -->
              - generic [ref=f8e800]: "<p><em>SESI LANJUTAN 1: Tafsir Ilmiah - Bedah Kasus Kekinian</em></p>"
              - generic [ref=f8e801]: <!-- /wp:paragraph -->
              - generic [ref=f8e802]: <!-- wp:paragraph -->
              - generic [ref=f8e803]: <p>Agenda berikutnya disampaikan oleh <em>Dr. KH. Ahmad Fikhri, Lc., MA</em> Sekretaris Umum MUI Kota Depok, didampingi <em>KH. Ahmad Jalaludin Kamal</em> Komisi PKU MUI Depok.</p>
              - generic [ref=f8e804]: <!-- /wp:paragraph -->
              - generic [ref=f8e805]: "<!-- wp:image {\"id\":1139,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e806]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_5004-1024x768.jpeg" alt="" class="wp-image-1139"/></figure>
              - generic [ref=f8e807]: <!-- /wp:image -->
              - generic [ref=f8e808]: <!-- wp:paragraph -->
              - generic [ref=f8e809]: <p><em>Tema:</em> <em>Tafsir Ilmiah antara Pendukung dan Pengkritiknya; Metodologi dan Contoh Kasus</em></p>
              - generic [ref=f8e810]: <!-- /wp:paragraph -->
              - generic [ref=f8e811]: <!-- wp:paragraph -->
              - generic [ref=f8e812]: <p>Pada sesi ini, peserta dibagi menjadi beberapa kelompok studi kasus untuk membedah ayat secara ilmiah:</p>
              - generic [ref=f8e813]: <!-- /wp:paragraph -->
              - generic [ref=f8e814]: "<!-- wp:list {\"ordered\":true} -->"
              - generic [ref=f8e815]: <ol class="wp-block-list"><!-- wp:list-item -->
              - generic [ref=f8e816]: "<li><em>Sidik Jari Manusia &amp; Identitas Seseorang</em> [QS. Al-Qiyamah: 1-4]</li>"
              - generic [ref=f8e817]: <!-- /wp:list-item -->
              - generic [ref=f8e818]: <!-- wp:list-item -->
              - generic [ref=f8e819]: "<li><em>Proses Penciptaan Manusia</em> <em>Nuthfah, Alaqah, Mudhghah</em> [QS. Al-Mu'minun: 12-14]</li>"
              - generic [ref=f8e820]: <!-- /wp:list-item -->
              - generic [ref=f8e821]: <!-- wp:list-item -->
              - generic [ref=f8e822]: "<li><em>Teori Big Bang dan Langit yang Mengembang</em> [QS. Adz-Dzariyat: 47]</li>"
              - generic [ref=f8e823]: <!-- /wp:list-item -->
              - generic [ref=f8e824]: <!-- wp:list-item -->
              - generic [ref=f8e825]: "<li><em>Larangan Menikahi Saudara Sepersusuan</em> [QS. An-Nisa: 23]</li>"
              - generic [ref=f8e826]: <!-- /wp:list-item -->
              - generic [ref=f8e827]: <!-- wp:list-item -->
              - generic [ref=f8e828]: "<li><em>Diharamkannya Darah</em> [QS. Al-Baqarah: 173]</li>"
              - generic [ref=f8e829]: <!-- /wp:list-item --></ol>
              - generic [ref=f8e830]: <!-- /wp:list -->
              - generic [ref=f8e831]: <!-- wp:paragraph -->
              - generic [ref=f8e832]: <p>Metode diskusi kelompok ini membuat peserta aktif menganalisis hubungan antara nash Al-Qur'an dengan temuan sains modern.</p>
              - generic [ref=f8e833]: <!-- /wp:paragraph -->
              - generic [ref=f8e834]: <!-- wp:paragraph -->
              - generic [ref=f8e835]: "<p><em>SESI LANJUTAN: Pentashihan Mushaf Al-Qur'an</em></p>"
              - generic [ref=f8e836]: <!-- /wp:paragraph -->
              - generic [ref=f8e837]: <!-- wp:paragraph -->
              - generic [ref=f8e838]: <p>Sesi pamungkas hari ketiga disampaikan oleh <em>KH. Jazim Hamidi, MA</em> Ketua MUI Kota Depok, didampingi <em>KH. Abdul Muhyi</em> Ketua Wasilah PKU MUI Kota Depok.</p>
              - generic [ref=f8e839]: <!-- /wp:paragraph -->
              - generic [ref=f8e840]: <!-- wp:paragraph -->
              - generic [ref=f8e841]: <p><em>Tema:</em> <em>Pentashihan Mushaf Al-Qur'an dan Penerjemahannya</em></p>
              - generic [ref=f8e842]: <!-- /wp:paragraph -->
              - generic [ref=f8e843]: "<!-- wp:image {\"id\":1147,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e844]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/09/IMG_5007-4-1024x768.jpeg" alt="" class="wp-image-1147"/></figure>
              - generic [ref=f8e845]: <!-- /wp:image -->
              - generic [ref=f8e846]: <!-- wp:paragraph -->
              - generic [ref=f8e847]: <p>Substansi kajian mengulas kelembagaan dan metodologi pentashihan Mushaf Al-Qur'an di Indonesia. Dibahas secara detail regulasi, standar Rasm Utsmani, rincian proses standardisasi terjemahan Al-Qur'an Kementerian Agama, serta tantangan menjaga akurasi teks dan makna terjemahan di tengah perkembangan teknologi cetak dan digital.</p>
              - generic [ref=f8e848]: <!-- /wp:paragraph -->
              - generic [ref=f8e849]: <!-- wp:paragraph -->
              - generic [ref=f8e850]: <p>Dengan rangkaian materi yang semakin berbobot, Program Takhassus Tafsir PKU MUI Kota Depok diharapkan mampu mencetak kader ulama yang faqih, moderat, dan mampu menjawab tantangan zaman.</p>
