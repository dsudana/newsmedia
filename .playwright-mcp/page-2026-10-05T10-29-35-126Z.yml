lished_at\";i:12;s:12:\"scheduled_at\";i:13;s:11:\"views_count\";i:14;s:11:\"is_featured\";i:15;s:9:\"read_time\";i:16;s:10:\"word_count\";i:17;s:11:\"ai_provider\";i:18;s:9:\"seo_score\";}s:10:\"*guarded\";a:1:{i:0;s:1:\"*\";}s:16:\"*forceDeleting\";b:0;}i:10;O:18:\"App\\Models\\Article\":34:{s:13:\"*connection\";s:5:\"mysql\";s:8:\"*table\";s:8:\"articles\";s:13:\"*primaryKey\";s:2:\"id\";s:10:\"*keyType\";s:3:\"int\";s:12:\"incrementing\";b:1;s:7:\"*with\";a:0:{}s:12:\"*withCount\";a:0:{}s:19:\"preventsLazyLoading\";b:0;s:10:\"*perPage\";i:15;s:6:\"exists\";b:1;s:18:\"wasRecentlyCreated\";b:0;s:28:\"*escapeWhenCastingToString\";b:0;s:13:\"*attributes\";a:30:{s:2:\"id\";i:891;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:88:\"Kopi Tani: Ngopi Bareng Sembari Belajar Bertani, Digagas Kelompok Tani Lahan Hijau Depok\";s:4:\"slug\";s:86:\"kopi-tani-ngopi-bareng-sembari-belajar-bertani-digagas-kelompok-tani-lahan-hijau-depok\";s:7:\"excerpt\";s:0:\"\";s:7:\"content\";s:2072:\"<!-- wp:paragraph -->"
              - generic [ref=f8e1414]: "<p><br>Depok — Kelompok Tani Lahan Hijau (Rawa Geni Farm) menggagas program bertajuk “Kopi Tani”, sebuah kegiatan rutin yang memadukan aktivitas ngopi santai dengan edukasi pertanian bagi masyarakat umum. Program ini terbuka untuk siapa saja, mulai dari petani, pemuda, masyarakat umum, hingga para pecinta tanaman. (22/08/2026)<br>Turut hadir Dalam kegiatan ini Lurah Ratujaya Irwan Sejati, sekretaris Lurah Ratujaya Jayadih, Ketua RW 01 Jaelani, ketua Rt 08 Slamet, ketua Rt 04 Nawawih dan hadir juga ketua RW 03 Rio Fathurrahman serta Penyuluh Pertanian Syamsul Murod dalam kegiatan ini peserta diajak untuk ngopi sambil ngobrol santai seputar dunia pertanian, saling berbagi pengalaman dan solusi atas berbagai persoalan bertani. Selain itu, peserta juga akan mendapatkan materi belajar bertani, mulai dari teknik penyemaian, pemupukan, hingga pengendalian hama sampai masa panen. Tak hanya teori, program ini juga menghadirkan sesi praktik langsung di kebun bersama anggota kelompok tani dan narasumber yang berpengalaman.<br>Kegiatan ini dijadwalkan berlangsung rutin setiap malam Senin dan Rabu, pukul 20.00 WIB, dan yang menarik, seluruh rangkaian kegiatan ini digelar secara gratis tanpa biaya bagi para peserta dan mendapatkan bibit cabe Gratis pula.<br>Program Kopi Tani turut menggandeng Dinas Ketahanan Pangan, Pertanian dan Perikanan (DKP3) Kota Depok sebagai mitra kerja sama. Kegiatan ini diselenggarakan oleh Kelompok Tani Lahan Hijau yang berlokasi di Kp. Rawa Geni RT 04 RW 01, Kelurahan Ratu Jaya, Kota Depok.<br>Melalui program ini, penyelenggara berharap dapat menumbuhkan semangat bertani sekaligus mempererat kebersamaan warga, sejalan dengan semboyan yang mereka usung: “Dari secangkir kopi, tumbuh inspirasi, panen masa depan.”</p>"
