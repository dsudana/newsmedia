\"status\";i:11;s:12:\"published_at\";i:12;s:12:\"scheduled_at\";i:13;s:11:\"views_count\";i:14;s:11:\"is_featured\";i:15;s:9:\"read_time\";i:16;s:10:\"word_count\";i:17;s:11:\"ai_provider\";i:18;s:9:\"seo_score\";}s:10:\"*guarded\";a:1:{i:0;s:1:\"*\";}s:16:\"*forceDeleting\";b:0;}i:13;O:18:\"App\\Models\\Article\":34:{s:13:\"*connection\";s:5:\"mysql\";s:8:\"*table\";s:8:\"articles\";s:13:\"*primaryKey\";s:2:\"id\";s:10:\"*keyType\";s:3:\"int\";s:12:\"incrementing\";b:1;s:7:\"*with\";a:0:{}s:12:\"*withCount\";a:0:{}s:19:\"preventsLazyLoading\";b:0;s:10:\"*perPage\";i:15;s:6:\"exists\";b:1;s:18:\"wasRecentlyCreated\";b:0;s:28:\"*escapeWhenCastingToString\";b:0;s:13:\"*attributes\";a:30:{s:2:\"id\";i:888;s:7:\"user_id\";i:1;s:11:\"category_id\";i:27;s:11:\"district_id\";N;s:5:\"title\";s:85:\"GENAP DEPOK AUDIENSI KE DPRD KOTA DEPOK DESAK SEGERA SAHKAN PELARANGAN LGBT TAHUN INI\";s:4:\"slug\";s:85:\"genap-depok-audiensi-ke-dprd-kota-depok-desak-segera-sahkan-pelarangan-lgbt-tahun-ini\";s:7:\"excerpt\";s:0:\"\";s:7:\"content\";s:4516:\"<!-- wp:separator -->"
              - generic [ref=f8e1648]: <hr class="wp-block-separator has-alpha-channel-opacity"/>
              - generic [ref=f8e1649]: <!-- /wp:separator -->
              - generic [ref=f8e1650]: "<!-- wp:image {\"id\":1095,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e1651]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/08/fe31e75a-0994-4b20-a86a-f4cb8767452d-1024x574.jpeg" alt="" class="wp-image-1095"/></figure>
              - generic [ref=f8e1652]: <!-- /wp:image -->
              - generic [ref=f8e1653]: "<!-- wp:image {\"id\":1096,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e1654]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/08/b19f4873-127b-494a-9168-158ff2e54d78-1024x574.jpeg" alt="" class="wp-image-1096"/></figure>
              - generic [ref=f8e1655]: <!-- /wp:image -->
              - generic [ref=f8e1656]: <!-- wp:paragraph -->
              - generic [ref=f8e1657]: <p><em>DEPOK</em> – Gerakan Nasional Anti Penyimpangan Seksual (GENAP) Kota Depok melakukan audiensi ke Pimpinan DPRD Kota Depok, Rabu (19/08/2026). Audiensi ini menjadi langkah nyata mendesak DPRD Kota Depok segera mengeluarkan Peraturan Daerah (PERDA) tentang Pelarangan LGBT.</p>
              - generic [ref=f8e1658]: <!-- /wp:paragraph -->
              - generic [ref=f8e1659]: <!-- wp:paragraph -->
              - generic [ref=f8e1660]: <p>Rombongan GENAP Kota Depok yang dikoordinatori H. Ahmad Saifuddin diterima langsung oleh Ketua DPRD Kota Depok Ade Supriyatna, ST, MAP, Ketua Fraksi Partai Demokrat Hj. Endah Winarti, SH, dan Ketua Fraksi Partai PKS Hafid Nasir.</p>
              - generic [ref=f8e1661]: <!-- /wp:paragraph -->
              - generic [ref=f8e1662]: <!-- wp:paragraph -->
              - generic [ref=f8e1663]: <p>GENAP Kota Depok hadir bersama unsur Tokoh Alim Ulama, Habaib, Aktivis Dakwah, Pondok Pesantren, Majelis Taklim, Forum DKM Masjid Musholla, dan Ormas-ormas se-Kota Depok.</p>
              - generic [ref=f8e1664]: <!-- /wp:paragraph -->
              - generic [ref=f8e1665]: <!-- wp:paragraph -->
              - generic [ref=f8e1666]: <p>Dalam audiensi tersebut, GENAP Depok menyerahkan 2 bundel konsep dan materi terkait urgensi PERDA Pelarangan LGBT. Materi disampaikan langsung oleh 3 narasumber dari berbagai perspektif.</p>
              - generic [ref=f8e1667]: <!-- /wp:paragraph -->
              - generic [ref=f8e1668]: <!-- wp:paragraph -->
              - generic [ref=f8e1669]: <p><em>1. Prof. DR. KH. Ahmad Dimyathi Badruzzaman, MA</em><br>Menjelaskan bahaya LGBT dalam perspektif Agama Islam berdasarkan dalil Al-Qur'an, Hadits, dan Riwayat Ibnu Abbas dalam Kitab Al-Kabair karya Imam Adz-Dzahabi.</p>
              - generic [ref=f8e1670]: <!-- /wp:paragraph -->
              - generic [ref=f8e1671]: <!-- wp:paragraph -->
              - generic [ref=f8e1672]: <p><em>2. Dokter Fakhrurrozi</em><br>Memaparkan dampak LGBT dari perspektif Kedokteran dan kesehatan masyarakat.</p>
              - generic [ref=f8e1673]: <!-- /wp:paragraph -->
              - generic [ref=f8e1674]: <!-- wp:paragraph -->
              - generic [ref=f8e1675]: <p><em>3. H. Borisa Rezadi Bachtiar, SH</em><br>Menjelaskan aspek hukum pidana terkait perilaku penyimpangan seksual.</p>
              - generic [ref=f8e1676]: <!-- /wp:paragraph -->
              - generic [ref=f8e1677]: <!-- wp:paragraph -->
              - generic [ref=f8e1678]: <p>Penutupan acara diisi doa oleh Syech Ikbal Khan. Dalam penyampaiannya, ia menegaskan agar PERDA Pelarangan LGBT jangan ditunda hingga tahun depan.<br>"Di Kota Depok sudah terjadi kejadian pembunuhan mutilasi yang terindikasi sebagai LGBT. Ini harus jadi perhatian serius kita bersama," tegasnya.</p>
              - generic [ref=f8e1679]: <!-- /wp:paragraph -->
              - generic [ref=f8e1680]: <!-- wp:paragraph -->
              - generic [ref=f8e1681]: <p>Hadir pula Prof. DR. Pangeran Syarif Abdurahman Bahasyim selaku Sekretaris RA Rabithah Alawiyah Kota Depok, Ust. Hidayatulloh, http://S.Pd.I sebagai Tokoh Remaja Islam, dan Subagya selaku Ketua JARETA Jaringan Rakyat Jelata.</p>
              - generic [ref=f8e1682]: <!-- /wp:paragraph -->
              - generic [ref=f8e1683]: "<!-- wp:image {\"id\":1097,\"sizeSlug\":\"large\",\"linkDestination\":\"none\"} -->"
              - generic [ref=f8e1684]: <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2026/08/6750aa97-4643-46a6-93e5-cb0b53f490a6-1024x574.jpeg" alt="" class="wp-image-1097"/></figure>
              - generic [ref=f8e1685]: <!-- /wp:image -->
              - generic [ref=f8e1686]: <!-- wp:paragraph -->
              - generic [ref=f8e1687]: <p>Koordinator GENAP Kota Depok, H. Ahmad Saifuddin menyampaikan bahwa GENAP merupakan gerakan nasional yang sudah berdiri di berbagai daerah. Sejumlah DPRD di daerah lain telah membuat Raperda Pelarangan LGBT, di antaranya Bekasi, Bogor, Cianjur, Tasikmalaya, Ciamis, Bandung, Garut, Cirebon, Solo Raya, Sragen, Surabaya, dan Gorontalo.</p>
              - generic [ref=f8e1688]: <!-- /wp:paragraph -->
              - generic [ref=f8e1689]: <!-- wp:paragraph -->
              - generic [ref=f8e1690]: <p>"Kami berharap Depok sebagai Kota Religius segera menyusul daerah-daerah lain dalam melindungi generasi muda dari bahaya penyimpangan seksual melalui regulasi yang jelas," ujarnya.</p>
              - generic [ref=f8e1691]: <!-- /wp:paragraph -->
              - generic [ref=f8e1692]: <!-- wp:paragraph -->
              - generic [ref=f8e1693]: <p>Menanggapi audiensi tersebut, Ketua DPRD Kota Depok Ade Supriyatna, ST, MAP menutup acara dengan memohon doa dari seluruh hadirin agar PERDA Pelarangan LGBT dapat segera terealisasi di Kota Depok.</p>
              - generic [ref=f8e1694]: <!-- /wp:paragraph -->
              - generic [ref=f8e1695]: <!-- wp:paragraph -->
              - generic [ref=f8e1696]: <p>Audiensi ini diharapkan menjadi awal lahirnya regulasi yang dapat melindungi nilai-nilai agama, moralitas, dan ketahanan keluarga di Kota Depok.</p>
              - generic [ref=f8e1697]: <!-- /wp:paragraph -->
              - generic [ref=f8e1698]: <!-- wp:paragraph -->
              - generic [ref=f8e1699]: <p><em>(</em>)*_</p>
