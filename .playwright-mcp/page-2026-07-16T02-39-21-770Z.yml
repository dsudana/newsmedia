            - text: 23 views
        - generic [ref=f13e52]: Dalam rangka memberikan fasilitas akses pasar yang lebih luas, para pendamping program Wirausaha Baru (WUB) kota Depok membuat beberapa terobosan, salah satunya dengan hadirnya outlet "Kue Subuh JUARA". Kue Subuh JUARA yang buka setiap pagi...
        - generic [ref=f13e53]: <figure class="wp-block-gallery has-nested-images columns-default is-cropped"> <figure class="wp-block-image size-large"><img src="https://margondatv.com/wp-content/uploads/2024/11/WhatsApp-Image-2024-11-20-at-05.56.48-1024x611.jpeg" alt="" class="wp-image-552"/></figure> </figure> <p></p> <p>Dalam rangka memberikan fasilitas akses pasar yang lebih luas, para pendamping program Wirausaha Baru (WUB) kota Depok membuat beberapa terobosan, salah satunya dengan hadirnya outlet "Kue Subuh JUARA".</p> <p>Kue Subuh JUARA yang buka setiap pagi dan berada di Jl Asmawi Beji ini mengusung konsep yang berbeda dari kue subuh kebanyakan, dari sisi produk, branding, hingga supplier. Di bulan pertama berjalan, omsetnya sudah mencapai 4juta per harinya.</p> <p>"Produk yang dijual di Kue Subuh JUARA semuanya sudah melalui tahapan kurasi (seleksi) produk. Proses kurasinya meliputi keunikan produk, kualitas rasa, kemasan, harga, dan lainnya" jelas Muhammad Iman, Pendamping WUB Kelurahan Beji Timur yang juga koordinator Kue Subuh Juara.</p> <p>Iman menjelaskan, bahwa penanggung jawab kurasi produk adalah ibu Dewi, pendamping WUB yang juga merupakan pengajar cooking class, sehingga produk para supplier bisa diperbaiki terus menerus.</p> <p>Supplier di Kue Subuh JUARA juga hampir seluruhnya adalah peserta WUB, yang telah mengikuti berbagai pelatihan dan memiliki legalitas seperti NIB, Halal, dan PIRT.</p> <p>"Disini jadi semacam inkubator bisnis, ada yang merubah total produknya, dari belum ada penjualan sampai sekarang selalu habis dagangannya, ada yg jadi nambah karyawan, juga ada yang jadi bisa bantu keluarga. Yang penting mindsetnya mau belajar dan berubah." jelas Iman.</p> <p>Selain itu, strategi branding juga dilakukan agar para UMKM bisa "naik kelas". Saat ini mereka sudah mulai terima orderan besar, snack box, dengan brand JUARA.</p> <p>"Produk-produk pilihan dibranding, dikasih rekomendasi, kemasan diperbaiki. Ada produk UMKM yang sudah jadi unggulan seperti kue soes, pastel, arem-arem, sampai lontong sayur, yang favorit di Kue Subuh JUARA. Dijamin enak dan beda!", tutup Iman.</p> <p></p>
